const W = 960, H = 540;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
let isPortrait = false;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  isPortrait = vh > vw;
  const raw = Math.min(vw/W, vh/H);
  // 縮小するときは目一杯、拡大は整数倍だけ（ドットをにじませない）
  const s = raw >= 2 ? 2 : (raw >= 1 ? 1 : raw);
  canvas.style.width = (W*s)+'px'; canvas.style.height = (H*s)+'px';
}
resize(); window.addEventListener('resize', resize);
ctx.imageSmoothingEnabled = false;

let AC=null, master=null, audioOn=false, waterGain=null, furinT=0;
function initAudio(){
  if (AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    audioOn=true; startWater(); startAmb();
  }catch(e){audioOn=false;}
}
function tone(f,dur,type,vol,delay,f2){
  if(!audioOn)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||0.12,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function nbuf(sec,sh){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=sh?sh(i,n):(Math.random()*2-1);return b;}
function nburst(dur,f0,f1,vol){
  if(!audioOn)return;
  const s=AC.createBufferSource(); s.buffer=nbuf(dur,(i,n)=>(Math.random()*2-1)*(1-i/n));
  const bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(f0,AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur); bp.Q.value=1.2;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(bp); bp.connect(g); g.connect(master); s.start();
}
function startWater(){
  const s=AC.createBufferSource(); s.buffer=nbuf(2.2); s.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=880; bp.Q.value=0.7;
  waterGain=AC.createGain(); waterGain.gain.value=0;
  s.connect(bp); bp.connect(waterGain); waterGain.connect(master); s.start();
}
function startAmb(){
  const loop=()=>{
    if (state==='play'||state==='caught'){
      const sc=SC[cur];
      if (sc.amb==='in'){
        // 屋内：風鈴と、たまに柱時計

          const f=1700+Math.random()*500;
          tone(f,0.5,'sine',0.035); tone(f*1.5,0.7,'sine',0.02,0.05);
        }
      } else {
        if (dayT<0.3){ const b0=2400+Math.random()*900;
          for(let i=0;i<3+Math.floor(Math.random()*3);i++) tone(b0*(0.9+Math.random()*0.35),0.06,'sine',0.03,i*0.075);
        } else if (dayT<0.7){
          const s=AC.createBufferSource();
          s.buffer=nbuf(0.55,(i,n)=>(Math.random()*2-1)*Math.sin(Math.PI*i/n)*(0.6+0.4*Math.sin(i*0.09)));
          const bp=AC.createBiquadFilter(); bp.type='bandpass';
          bp.frequency.value=3300+Math.random()*900; bp.Q.value=3.5;
          const g=AC.createGain(); g.gain.value=0.038;
          s.connect(bp); bp.connect(g); g.connect(master); s.start();
        } else {
          if (Math.random()<0.7){ for(let i=0;i<7;i++) tone(2100-i*70,0.11,'triangle',0.026,i*0.1); }
          else { nburst(0.34,900,420,0.045); tone(420,0.3,'sawtooth',0.028,0.02,260); }
        }
      }
    }
    setTimeout(loop, 700+Math.random()*950);
  };
  loop();
}

function mixHex(h1,h2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(h1),[r2,g2,b2]=p(h2);
  return 'rgb('+Math.round(lerp(r1,r2,t))+','+Math.round(lerp(g1,g2,t))+','+Math.round(lerp(b1,b2,t))+')';
}
function skyNow(){
  let i=0; while(i<SKY.length-2 && dayT>SKY[i+1].t) i++;
  const t=clamp((dayT-SKY[i].t)/(SKY[i+1].t-SKY[i].t),0,1);
  return { a:mixHex(SKY[i].a,SKY[i+1].a,t), b:mixHex(SKY[i].b,SKY[i+1].b,t) };
}

const ATLAS_PROPS = { tree:1, bushL:1, bushS:1, rock:1, weed:1 };

function propSolid(k){ return {chabudai:44,hashira:12,kamado:74,mizugame:30,tana:80,ido:48,
  torii:0,saisen:34,lantern:12,kakashi:10,rock:14,tree:16,denchu:10,tokei:26,tana2:0}[k]||0; }

// ===== 画面の中身を作る =====
function enterScreen(id, fromSide){
  cur = id;
  const sc = SC[id];
  bugs = [];
  const rnd = mulberry32(id.length*7919 + step*104729);
  for (const k of sc.bugs) {
    const info = BUGS[k];
    let x,y;
    const trees = sc.props.filter(p=>p[0]==='tree');
    if (info.perch && trees.length) {
      const t = trees[Math.floor(rnd()*trees.length)];
      const a = rnd()*Math.PI*2, rad = 0.35+rnd()*0.55;
      x = t[1]+Math.cos(a)*60*rad; y = t[2]-120+Math.sin(a)*50*rad;
    } else {
      x = sc.area[0]+40+rnd()*(sc.area[1]-sc.area[0]-80);
      y = sc.area[2]+20+rnd()*(sc.area[3]-sc.area[2]-70);
    }
    bugs.push({ key:k, x, y, hx:x, hy:y, t:rnd()*10, perched:!!(info.perch&&trees.length),
                gone:false, spook:0 });
  }
  npcs = (sc.npc||[]).map(([who,x,y])=>({ who, x, y, tx:x, ty:y, t:rnd()*3, bob:rnd()*6 }));
  placeLabel = { txt: sc.name, t:0 };
  talkBox = null;
}

// いちばん近い「立てる場所」を探す。ものの中にめり込んだままにしないため
function nearestFree(x,y){
  if(walkable(x,y)) return {x,y};
  const a=SC[cur].area;
  for(let r=24;r<=560;r+=24){
    for(let i=0;i<16;i++){
      const ang=i/16*Math.PI*2;
      const nx=clamp(x+Math.cos(ang)*r,a[0]+10,a[1]-10);
      const ny=clamp(y+Math.sin(ang)*r,a[2]+10,a[3]-10);
      if(walkable(nx,ny)) return {x:nx,y:ny};
    }
  }
  return {x:(a[0]+a[1])/2, y:a[3]-20};
}
function walkable(x,y){
  const sc = SC[cur], a = sc.area;
  if (x<a[0]||x>a[1]||y<a[2]||y>a[3]) return false;
  for (const p of sc.props){
    const r = propSolid(p[0]); if(!r) continue;
    if (dist(x,y,p[1],p[2]-4)<r) return false;
  }
  return true;
}

// ===== 進行 =====
function startDay(){
  step = 0; dayT = 0;
  caught = [];
  player = { x:700, y:470, face:Math.PI/2, walk:0, moving:false, running:false, stepT:0 };
  enterScreen('zashiki');
  const f0 = nearestFree(player.x, player.y); player.x=f0.x; player.y=f0.y;
  state = 'play';
}
function goto(side){
  const sc = SC[cur];
  const ex = (sc.exits||[]).find(e=>e.side===side);
  if (!ex) return;
  trans = { t:0, to:ex.to, side, done:false };
  sfx.fusuma();
}
function finishTrans(){
  const side = trans.side, to = trans.to;
  step++; dayT = clamp(step/STEPS, 0, 1);
  enterScreen(to, OPP[side]);
  const a = SC[to].area;
  if (side==='right') player.x = a[0]+24;
  if (side==='left')  player.x = a[1]-24;
  if (side==='down')  player.y = a[2]+22;
  if (side==='up')    player.y = a[3]-22;
  player.x = clamp(player.x, a[0]+16, a[1]-16);
  player.y = clamp(player.y, a[2]+16, a[3]-16);
  const free = nearestFree(player.x, player.y);
  player.x = free.x; player.y = free.y;
  if (dayT >= 1) { basketReturn='title'; state='basket'; sfx.bell(); }
}

// ===== 網 =====
function swing(){
  if (net.t>=0 && net.t<0.42) return;
  net.t = 0; net.dir = player.face; sfx.swing();
  const cx = player.x+Math.cos(net.dir)*46, cy = player.y-26+Math.sin(net.dir)*46;
  for (const b of bugs){
    if (b.gone) continue;
    if (dist(cx,cy,b.x,b.y) < 48){ doCatch(b); return; }
  }
  // はずれ。近くの虫は 飛んでいく
  for (const b of bugs) if (!b.gone && dist(player.x,player.y-26,b.x,b.y)<150) flyAway(b);
}
function flyAway(b){
  if (b.gone) return;
  b.gone = true; b.flying = Math.atan2(b.y-(player.y-26), b.x-player.x);
  b.flyT = 0; sfx.fly();
}
function doCatch(b){
  b.gone = true; b.caughtAnim = true;
  const info = BUGS[b.key];
  const r = Math.random();
  const ratio = 0.80 + Math.pow(r,2.1)*0.62;
  const mm = Math.round(info.mm*ratio*10)/10;
  const rank = sizeRank(ratio);
  const first = !seen[b.key];
  const best = record[b.key]||0;
  seen[b.key]=true; if (mm>best) record[b.key]=mm;
  save();
  caught.push({key:b.key, mm});
  caughtView = { key:b.key, mm, ratio, rank, first, isBest:mm>best, prevBest:best, t:0 };
  state='caught'; sfx.net();
}
function save(){ try{ localStorage.setItem('natsu_world_v1', JSON.stringify({record,seen})); }catch(e){} }
function load(){ try{ const s=localStorage.getItem('natsu_world_v1');
  if(s){ const j=JSON.parse(s); record=j.record||{}; seen=j.seen||{}; } }catch(e){} }

// ===== 入力 =====
const keys={};
const MOVE={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],
            ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};
window.addEventListener('keydown',e=>{
  if(MOVE[e.code]||['Space','KeyZ','Enter','ShiftLeft','ShiftRight','KeyB'].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return; keys[e.code]=true; initAudio();
  if(e.code==='Space'||e.code==='KeyZ'||e.code==='Enter'){
    if(state==='title'){ startDay(); return; }
    if(state==='caught'){ state='play'; caughtView=null; return; }
    if(state==='basket'){ state=basketReturn; return; }
    if(state==='play'&&!trans){ if(talkBox){talkBox=null;} else swing(); }
  }
  if(e.code==='KeyB'&&state==='play'){ basketReturn='play'; state='basket'; }
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;stick.on=false;});

// ===== タッチ（スマホ）=====
// ドラッグ＝あるく（大きく倒すと はしる）／タップ＝あみ／右上のかごボタン
let usingTouch=false;
const stick={on:false,id:null,ox:0,oy:0,x:0,y:0,moved:false,t0:0};
const KAGO={x:W-46,y:46,r:30};
function toCanvas(t){
  const r=canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
function tapAction(p){
  if(state==='title'){ startDay(); return; }
  if(state==='caught'){ state='play'; caughtView=null; return; }
  if(state==='basket'){ state=basketReturn; return; }
  if(state==='play'&&!trans){
    if(p && dist(p.x,p.y,KAGO.x,KAGO.y)<KAGO.r+8){ basketReturn='play'; state='basket'; return; }
    if(talkBox){ talkBox=null; } else swing();
  }
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); usingTouch=true; initAudio();
  const t=e.changedTouches[0], p=toCanvas(t);
  if(!stick.on){
    stick.on=true; stick.id=t.identifier;
    stick.ox=p.x; stick.oy=p.y; stick.x=p.x; stick.y=p.y;
    stick.moved=false; stick.t0=performance.now();
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==stick.id) continue;
    const p=toCanvas(t); stick.x=p.x; stick.y=p.y;
    if(dist(p.x,p.y,stick.ox,stick.oy)>14) stick.moved=true;
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==stick.id) continue;
    const held=performance.now()-stick.t0;
    if(!stick.moved && held<400) tapAction({x:stick.ox,y:stick.oy});
    stick.on=false; stick.id=null;
  }
}
canvas.addEventListener('touchend',endTouch,{passive:false});
canvas.addEventListener('touchcancel',endTouch,{passive:false});
canvas.addEventListener('mousedown',e=>{
  if(usingTouch) return;
  e.preventDefault(); initAudio();
  tapAction(toCanvas(e));
});

// ===== 更新 =====
function update(dt){
  elapsed+=dt;
  if(placeLabel){ placeLabel.t+=dt; if(placeLabel.t>2.6) placeLabel=null; }
  if(talkBox){ talkBox.t+=dt; if(talkBox.t>5) talkBox=null; }
  if(state!=='play') return;
  if(trans){ trans.t+=dt;
    if(trans.t>0.22&&!trans.done){trans.done=true;finishTrans();}
    if(trans.t>0.46) trans=null; return; }

  if(net.t>=0){ net.t+=dt; if(net.t>0.48) net.t=-1; }

  let ax=0,ay=0,tilt=0;
  for(const c in MOVE) if(keys[c]){ax+=MOVE[c][0];ay+=MOVE[c][1];}
  if(ax||ay){const m=Math.hypot(ax,ay);ax/=m;ay/=m;tilt=1;}
  if(stick.on){
    const dx=stick.x-stick.ox, dy=stick.y-stick.oy, dd=Math.hypot(dx,dy);
    if(dd>12){ tilt=Math.min(1,(dd-12)/62); ax=dx/dd; ay=dy/dd; }
  }
  // スティックを大きく倒す＝はしる
  player.running=!!(keys.ShiftLeft||keys.ShiftRight)||(stick.on&&tilt>0.72);
  player.moving=!!(ax||ay);
  const SPD=player.running?216:118;
  const sc=SC[cur], a=sc.area;
  if(player.moving){
    player.face=Math.atan2(ay,ax);
    player.walk+=dt*(player.running?14:8);
    player.stepT+=dt;
    if(player.stepT>(player.running?0.21:0.40)){ player.stepT=0;
      sc.floor==='ita' ? sfx.ita() : (sc.floor==='tatami' ? sfx.tatami() : sfx.grass()); }
    const nx=player.x+ax*SPD*dt, ny=player.y+ay*SPD*dt;
    const stuck=!walkable(player.x,player.y);   // ものの中にいる＝脱出を許す
    const hasExit=side=>(sc.exits||[]).some(e=>e.side===side);
    if(nx<a[0]){ if(hasExit('left')) goto('left'); else player.x=a[0]; }
    else if(nx>a[1]){ if(hasExit('right')) goto('right'); else player.x=a[1]; }
    else if(stuck||walkable(nx,player.y)) player.x=nx;
    if(trans) return;
    if(ny<a[2]){ if(hasExit('up')) goto('up'); else player.y=a[2]; }
    else if(ny>a[3]){ if(hasExit('down')) goto('down'); else player.y=a[3]; }
    else if(stuck||walkable(player.x,ny)) player.y=ny;
  } else player.walk=0;

  // 水の音
  if(waterGain) waterGain.gain.value = sc.amb==='water' ? 0.13 : 0.0;

  // 虫：乱暴に近づかれると 飛んでいく。それだけ
  for(const b of bugs){
    if(b.gone){ if(b.flying!==undefined){ b.flyT+=dt;
        b.x+=Math.cos(b.flying)*190*dt; b.y+=Math.sin(b.flying)*190*dt-40*dt; } continue; }
    b.t+=dt;
    const d=dist(player.x,player.y-26,b.x,b.y);
    if(player.running && d<170) { b.spook+=dt*2.4; }
    else if(player.moving && d<70) { b.spook+=dt*0.9; }
    else b.spook=Math.max(0,b.spook-dt*0.8);
    if(b.spook>1) { flyAway(b); continue; }
    if(b.perched){
      b.x=lerp(b.x,b.hx,Math.min(1,dt*4));
      b.y=lerp(b.y,b.hy+Math.sin(b.t*2)*1.6,Math.min(1,dt*4));
    } else {
      const ang=Math.sin(b.t*1.25+b.hx*0.01)*1.6+Math.sin(b.t*0.47)*1.2;
      let nx=b.x+Math.cos(ang)*30*dt+Math.sin(b.t*4)*14*dt;
      let ny=b.y+Math.sin(ang)*30*dt+Math.cos(b.t*3.1)*14*dt;
      if(nx<a[0]+20||nx>a[1]-20){nx=b.x;b.t+=0.9;}
      if(ny<a[2]-30||ny>a[3]-20){ny=b.y;b.t+=0.9;}
      b.x=nx;b.y=ny;
    }
  }

  // キャラ：近づくと ひとこと
  for(const n of npcs){
    n.t+=dt;
    if(n.t>2.6){ n.t=0;
      for(let k=0;k<30;k++){
        const ang=Math.random()*Math.PI*2,r=50+Math.random()*110;
        const x=n.x+Math.cos(ang)*r,y=n.y+Math.sin(ang)*r;
        if(walkable(x,y)){n.tx=x;n.ty=y;break;} } }
    const dx=n.tx-n.x,dy=n.ty-n.y,dd=Math.hypot(dx,dy);
    if(dd>4){ const sp=38*dt;
      if(walkable(n.x+dx/dd*sp,n.y)) n.x+=dx/dd*sp;
      if(walkable(n.x,n.y+dy/dd*sp)) n.y+=dy/dd*sp;
      n.bob+=dt*8; }
    if(!talkBox && dist(n.x,n.y,player.x,player.y)<46)
      talkBox={ who:n.who, line:pick(TALK[n.who]||['……']), t:0 };
  }
}

// ===== 情景 =====
function drawScreen(){
  const sc=SC[cur], a=sc.area;
  if(sc.kind==='in') drawIndoor(sc); else drawOutdoor(sc);

  // 前後ソート
  const items=[];
  for(const p of sc.props){
    if(p[0]==='engawa_far'||p[0]==='ishigaki') continue;
    items.push({y:p[2],kind:'prop',o:p});
  }
  for(const n of npcs) items.push({y:n.y,kind:'npc',o:n});
  items.push({y:player.y,kind:'player',o:player});
  items.sort((x,y)=>x.y-y.y);
  for(const it of items){
    if(it.kind==='prop'){
      const [k,x,y]=it.o;
      if(ATLAS_PROPS[k]){
        const r=ENV[k];
        if(k==='tree'){
          const hide=Math.abs(player.x-x)<76&&player.y>y-200&&player.y<y+14;
          if(hide) ctx.globalAlpha=0.42;
          ctx.drawImage(imgEnv,r[0],r[1],r[2],r[3],Math.round(x-r[2]),Math.round(y-r[3]*2+12),r[2]*2,r[3]*2);
          ctx.globalAlpha=1;
        } else drawEnv(k,x-r[2],y-r[3]*2,2);
      } else if(PROP[k]) PROP[k](x,y);
    } else if(it.kind==='npc'){
      const n=it.o, s=2.6;
      ctx.fillStyle='rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(n.x,n.y,7*s/2.6*7,2.6,0,0,7); ctx.fill();
      drawChar(CI[n.who],n.x,n.y+Math.sin(n.bob)*2,s,false);
    } else {
      const p=it.o, s=2.8;
      ctx.fillStyle='rgba(0,0,0,0.24)';
      ctx.beginPath(); ctx.ellipse(p.x,p.y,20,6,0,0,7); ctx.fill();
      const bob=p.moving?Math.abs(Math.sin(p.walk))*(p.running?-5:-3):0;
      drawChar(CI.cirno,p.x,p.y+bob,s,Math.cos(p.face)<-0.35&&p.moving);
      drawNet(p.x,p.y+bob);
    }
  }
  // 虫（マークも ゲージも 出さない）
  for(const b of bugs){
    if(b.gone && b.flying===undefined) continue;
    if(b.gone && b.flyT>2.2) continue;
    const fr=Math.floor(elapsed*14)%2===0;
    ctx.globalAlpha = b.gone ? Math.max(0,1-b.flyT/2.2) : 1;
    drawBug(b.key,b.x,b.y,1.8,fr);
    ctx.globalAlpha=1;
  }
  // 夕方の色
  if(dayT>0.72 && sc.kind==='out'){
    ctx.fillStyle='rgba(255,132,62,'+((dayT-0.72)/0.28*0.2).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(sc.kind==='in'){
    ctx.fillStyle='rgba(60,40,20,'+(0.06+dayT*0.16).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}
function drawIndoor(sc){
  const a=sc.area;
  if(sc.wall==='fusuma') drawFusuma();
  else if(sc.wall==='shoji') drawShoji();
  else drawItaWall();
  if(sc.floor==='tatami') drawTatami(0,W,a[2]-32,H);
  else if(sc.floor==='ita') drawIta(0,W,a[2]-24,H);
  else drawTsuchi(0,W,a[2]-24,H);
}
function drawOutdoor(sc){
  const sk=skyNow(), a=sc.area;
  const HZ=a[2]-40;
  const g=ctx.createLinearGradient(0,0,0,HZ+30);
  g.addColorStop(0,sk.a); g.addColorStop(1,sk.b);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HZ+30);
  // 雲
  ctx.fillStyle=dayT>0.74?'rgba(255,222,192,0.9)':'rgba(255,255,255,0.9)';
  for(const [cx0,cy,s] of [[660,70,0.9],[230,52,0.62]]){
    const cx=cx0+Math.sin(elapsed*0.05+cy)*8;
    for(const [ox,oy,r] of [[-34,12,26],[0,-6,36],[30,10,24],[58,16,18]])
      { ctx.beginPath(); ctx.arc(cx+ox*s,cy+oy*s,r*s,0,7); ctx.fill(); }
  }
  // 遠くの山と木立
  ctx.fillStyle='#6d90a0';
  ctx.beginPath(); ctx.moveTo(40,HZ); ctx.quadraticCurveTo(320,HZ-76,600,HZ); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5d8494';
  ctx.beginPath(); ctx.moveTo(500,HZ); ctx.quadraticCurveTo(760,HZ-58,1000,HZ); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3c5c32'; ctx.fillRect(0,HZ-22,W,26);
  for(let i=0;i<34;i++){ const x=(i*29+11)%(W+30)-15,s=0.6+((i*37)%10)/12;
    ctx.beginPath(); ctx.moveTo(x-12*s,HZ-18);
    ctx.quadraticCurveTo(x,HZ-18-26*s,x+12*s,HZ-18); ctx.closePath(); ctx.fill(); }

  // 地面
  const gy=HZ+4;
  if(sc.ground==='kawara'){
    for(let y=gy;y<H;y+=TILE) for(let x=0;x<W;x+=TILE) drawEnv(y>a[3]-6?'water':'dirt',x,y,2);
    for(let y=a[3];y<H;y+=TILE) for(let x=0;x<W;x+=TILE) drawEnv('water',x,y,2);
    for(let x=0;x<W;x+=TILE) for(let y=a[3];y<H;y+=TILE){
      const ph=Math.sin(elapsed*2.4+x*0.06+y*0.11);
      if(ph>0.66){ ctx.fillStyle='rgba(255,255,255,'+((ph-0.66)*1.9).toFixed(2)+')';
        ctx.fillRect(x+6,y+10+((x*7+y*3)%12),12,2); } }
  } else if(sc.ground==='paddy'){
    for(let y=gy;y<H;y+=TILE) for(let x=0;x<W;x+=TILE){
      const inPad=(y<a[2]-6)||(y>a[3]+2);
      drawEnv(inPad?'water':'dirt',x,y,2);
    }
    ctx.fillStyle='#78a840';
    for(let y=gy;y<H;y+=TILE) for(let x=0;x<W;x+=TILE){
      if(!((y<a[2]-6)||(y>a[3]+2))) continue;
      for(let k=0;k<3;k++){ const sw=Math.sin(elapsed*1.6+x*0.05+k)*2;
        ctx.fillRect(x+6+k*9,y+8,2,16); ctx.fillRect(x+6+k*9+sw,y+2,2,8); } }
  } else if(sc.ground==='dirt'){
    for(let y=gy;y<H;y+=TILE) for(let x=0;x<W;x+=TILE){
      const v=((x*7+y*13)%97)/97;
      drawEnv(v<0.14?'grass':'dirt',x,y,2); }
  } else {
    for(let y=gy;y<H;y+=TILE) for(let x=0;x<W;x+=TILE){
      const v=((x*7+y*13)%97)/97;
      drawEnv(v<0.10?'gf1':(v<0.19?'gf2':'grass'),x,y,2); }
  }
  // 背景に置く小道具
  for(const p of sc.props) if(p[0]==='engawa_far'||p[0]==='ishigaki') PROP[p[0]]();
}
function drawNet(px,py){
  if(net.t<0) return;
  const prog=clamp(net.t/0.34,0,1);
  const ang=net.dir+(-0.95+prog*1.9), reach=46*(0.55+prog*0.7);
  const nx=px+Math.cos(ang)*reach, ny=py-26+Math.sin(ang)*reach, R=22;
  ctx.save(); ctx.globalAlpha=0.9;
  ctx.strokeStyle='#c8a068'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(px,py-30); ctx.lineTo(nx,ny); ctx.stroke();
  ctx.strokeStyle='#f4f4f4'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(nx,ny,R,0,7); ctx.stroke();
  ctx.fillStyle='rgba(240,250,255,0.26)';
  ctx.beginPath(); ctx.arc(nx,ny,R,0,7); ctx.fill();
  ctx.restore();
}

// ===== 画面に出るものは、これだけ =====
function drawHud(){
  const sc=SC[cur];
  // 日付だけ
  text('8月1日', 22, 34, 17, 'rgba(255,255,255,0.92)');
  // 出口の案内（はしに立ったときだけ、小さく）
  const a=sc.area;
  for(const e of (sc.exits||[])){
    let near=false, lx=0, ly=0;
    if(e.side==='left'  && player.x<a[0]+90){ near=true; lx=a[0]+10; ly=(a[2]+a[3])/2; }
    if(e.side==='right' && player.x>a[1]-90){ near=true; lx=a[1]-10; ly=(a[2]+a[3])/2; }
    if(e.side==='up'    && player.y<a[2]+70){ near=true; lx=player.x; ly=a[2]-6; }
    if(e.side==='down'  && player.y>a[3]-70){ near=true; lx=player.x; ly=a[3]+22; }
    if(near){
      ctx.save(); ctx.globalAlpha=0.8;
      text(SC[e.to].name+' →', clamp(lx,80,W-80), ly, 13, '#ffffff', 'center', '600');
      ctx.restore();
    }
  }
  if(placeLabel){
    const t=placeLabel.t;
    const al=t<0.3?t/0.3:(t>2.1?Math.max(0,(2.6-t)/0.5):1);
    ctx.save(); ctx.globalAlpha=al;
    text(placeLabel.txt, 22, 62, 22, '#ffffff');
    ctx.restore();
  }
  // スマホ：かごボタンとスティック
  if(usingTouch){
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.fillStyle='#1c2418'; ctx.beginPath(); ctx.arc(KAGO.x,KAGO.y,KAGO.r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,238,190,0.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(KAGO.x,KAGO.y,KAGO.r,0,7); ctx.stroke();
    ctx.restore();
    text('かご',KAGO.x,KAGO.y+5,14,'#ffffff','center');
    if(stick.on){
      ctx.save(); ctx.globalAlpha=0.3;
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(stick.ox,stick.oy,62,0,7); ctx.stroke();
      let dx=stick.x-stick.ox,dy=stick.y-stick.oy; const dd=Math.hypot(dx,dy)||1;
      const m=Math.min(62,dd);
      ctx.globalAlpha=0.5; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(stick.ox+dx/dd*m,stick.oy+dy/dd*m,22,0,7); ctx.fill();
      ctx.restore();
    }
  }
  if(talkBox){
    const bx=180, by=H-118, bw=600, bh=76;
    ctx.fillStyle='rgba(20,26,18,0.9)'; rr(bx,by,bw,bh,10); ctx.fill();
    ctx.strokeStyle='rgba(255,235,180,0.5)'; ctx.lineWidth=1.5; rr(bx,by,bw,bh,10); ctx.stroke();
    drawChar(CI[talkBox.who],bx+40,by+bh-8,3.0,false);
    text(talkBox.line, bx+80, by+44, 15, '#ffffff', 'left', '500');
  }
}

// ===== 捕獲画面 =====
function drawCaught(dt){
  drawScreen();
  const v=caughtView; v.t+=dt;
  const z=Math.min(1,v.t/0.26);
  ctx.fillStyle='rgba(8,12,9,'+(0.9*z).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
  if(z<0.6) return;
  const info=BUGS[v.key];
  ctx.save(); ctx.globalAlpha=Math.min(1,(z-0.6)/0.4);
  const CX=W/2, CW=500, CXL=CX-CW/2, CY=66, CH=340;
  ctx.fillStyle='rgba(16,21,15,0.97)'; rr(CXL,CY,CW,CH,14); ctx.fill();
  ctx.strokeStyle=v.rank.king?'rgba(255,209,102,0.85)':'rgba(214,186,126,0.45)';
  ctx.lineWidth=v.rank.king?3:2; rr(CXL,CY,CW,CH,14); ctx.stroke();
  const BY=CY+112, s=7.0+(v.ratio-1)*2.4;
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.beginPath(); ctx.ellipse(CX,BY+66,116,13,0,0,7); ctx.fill();
  drawBug(v.key,CX,BY,s,Math.floor(elapsed*9)%2===0);
  if(v.first) text('はじめて つかまえた！',CX,CY+30,20,'#8fe6a8','center');
  text(info.jp,CX,CY+206,33,'#ffffff','center');
  text(v.mm.toFixed(1)+' mm',CX,CY+240,25,'#ffe066','center');
  const barW=clamp(v.mm*2.2,60,CW-80), bx0=CX-barW/2;
  ctx.fillStyle='rgba(255,255,255,0.34)'; ctx.fillRect(bx0,CY+256,barW,2);
  for(let i=0;i*10<=v.mm;i++){ const x=bx0+barW*(i*10/v.mm),tall=(i%5===0);
    ctx.fillRect(x,CY+256-(tall?8:5),1.5,(tall?8:5)+2); }
  text('★ '+v.rank.t+' ★',CX,CY+298,24,v.rank.c,'center');
  if(v.isBest&&!v.first&&v.prevBest>0)
    text('これまでで いちばん おおきい！',CX,CY+324,13,'#8fe6a8','center');
  text('Z で つづける ▶',W-20,H-16,13,'rgba(255,255,255,0.85)','right');
  ctx.restore();
}

// ===== 虫かご =====
function drawBasket(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3a4a30'); g.addColorStop(1,'#20281c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  text(basketReturn==='play'?'むしかご':'きょうの むしかご',W/2,54,28,'#ffffff','center');
  const bx=76,by=100,bw=W-152,bh=306;
  ctx.fillStyle='rgba(196,164,104,0.14)'; rr(bx,by,bw,bh,14); ctx.fill();
  ctx.strokeStyle='rgba(214,186,126,0.5)'; ctx.lineWidth=3; rr(bx,by,bw,bh,14); ctx.stroke();
  ctx.save(); ctx.beginPath(); rr(bx,by,bw,bh,14); ctx.clip();
  ctx.strokeStyle='rgba(214,186,126,0.14)'; ctx.lineWidth=2;
  for(let x=bx;x<bx+bw;x+=26){ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x,by+bh);ctx.stroke();}
  for(let y=by;y<by+bh;y+=26){ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx+bw,y);ctx.stroke();}
  if(!caught.length) text('からっぽ。……また あした。',W/2,by+bh/2,20,'#8a9a7a','center');
  else{
    const sorted=caught.slice().sort((a,b)=>b.mm-a.mm);
    const PADX=26,GAP=22,LABEL=15;
    function layout(K){ const rows=[]; let row=[],rw=0,rh=0,th=0;
      for(const c of sorted){ const w=c.mm*K;
        if(rw+w>bw-PADX*2&&row.length){rows.push({row,rh});th+=rh+LABEL+GAP;row=[];rw=0;rh=0;}
        row.push({c,w}); rw+=w+GAP; rh=Math.max(rh,w*0.95); }
      if(row.length){rows.push({row,rh});th+=rh+LABEL+GAP;}
      return {rows,th}; }
    let K=1.7,lo=null;
    for(let i=0;i<14;i++){ lo=layout(K); if(lo.th<=bh-34) break; K*=0.87; }
    let y=by+Math.max(20,(bh-lo.th)/2+8);
    for(const {row,rh} of lo.rows){
      let x=bx+PADX+(bw-PADX*2-(row.reduce((s,r)=>s+r.w+GAP,0)-GAP))/2;
      for(const {c,w} of row){
        drawBug(c.key,x+w/2,y+rh/2,w/16,Math.floor(elapsed*6+x)%2===0);
        text(c.mm.toFixed(1)+'mm',x+w/2,y+rh+12,10,'#cfe8b8','center');
        x+=w+GAP; }
      y+=rh+LABEL+GAP; }
  }
  ctx.restore();
  text('じこベスト',bx,438,14,'#ffe066');
  let zx=bx+6;
  for(const k of BUG_KEYS){
    const best=record[k]||0;
    ctx.globalAlpha=best?1:0.22; drawBug(k,zx+24,476,1.3,false); ctx.globalAlpha=1;
    text(best?BUGS[k].jp:'？？？',zx+24,500,10,best?'#e8f0e0':'#7a8a70','center');
    if(best) text(best.toFixed(1)+'mm',zx+24,514,10,'#ffd166','center');
    zx+=112;
  }
  text(basketReturn==='play'?'Z で つづける ▶':'Z で タイトルへ ▶',W-30,H-24,16,'#ffffff','right');
}

// ===== タイトル =====
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6fc0ee'); g.addColorStop(0.42,'#c8e8f6');
  g.addColorStop(0.54,'#b0d4a0'); g.addColorStop(1,'#4d7a3a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.92)';
  const puff=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};
  puff(686+Math.sin(elapsed*0.2)*6,116,40); puff(738,92,52); puff(790,120,34);
  ctx.fillStyle='#6d90a0';
  ctx.beginPath(); ctx.moveTo(360,292); ctx.quadraticCurveTo(560,180,760,292); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3c5c32'; ctx.fillRect(0,286,W,24);
  if(assetsReady>=2){
    for(let y=300;y<H;y+=TILE) for(let x=0;x<W;x+=TILE){
      const v=((x*7+y*13)%97)/97;
      drawEnv(v<0.10?'gf1':(v<0.19?'gf2':'grass'),x,y,2); }
    const r=ENV['tree'];
    ctx.drawImage(imgEnv,r[0],r[1],r[2],r[3],700,132,r[2]*2,r[3]*2);
    PROP.torii(560,470);
    drawChar(CI.cirno,392,512+Math.sin(elapsed*3)*2,4.0,false);
    drawChar(CI.dai,456,522+Math.sin(elapsed*3+1)*2,3.4,true);
  }
  ctx.save(); ctx.textAlign='left';
  ctx.font='bold 54px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.lineWidth=9; ctx.strokeStyle='rgba(30,50,30,0.5)';
  ctx.strokeText('幻想郷の',56,104); ctx.strokeText('なつやすみ',56,166);
  ctx.fillStyle='#fff'; ctx.fillText('幻想郷の',56,104); ctx.fillText('なつやすみ',56,166);
  ctx.restore();
  text('〜 世界のかたち・9画面 〜',60,196,16,'#27492c');
  ctx.fillStyle='rgba(255,255,255,0.9)'; rr(48,218,392,150,12); ctx.fill();
  let y=246; const line=(t,c)=>{text(t,64,y,14,c||'#2e4a2a');y+=25;};
  line('← → ↑ ↓ か WASD で あるく。Shift で はしる。');
  line('画面の はしまで あるくと となりの 場所へ。');
  line('Z で 網。B で 虫かご。');
  line('家の 中から 出て、庭・道・川・林・神社へ。');
  line('点数も ゲージも ない。歩いて 見るだけ。','#1f6a52');
  if(usingTouch||isPortrait){
    y+=2; line('スマホ：ドラッグで あるく（大きく倒すと はしる）','#8a4a20');
    line('　　　　タップで あみ。右上の かご ボタン。','#8a4a20');
  }
  const bp=Math.sin(elapsed*3)*3;
  ctx.fillStyle='#e8604f'; rr(66,392+bp,268,56,28); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3; rr(66,392+bp,268,56,28); ctx.stroke();
  text('Z / Enter で はじめる',200,428+bp,19,'#ffffff','center');
  text('東方Project (C) 上海アリス幻樂団 / ZUN　sprites: Majstek　tiles: Seliel the Shaper',
       W-16,H-12,11,'rgba(255,255,255,0.9)','right','500');
}

// ===== ループ =====
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
  if(assetsReady<2){ elapsed+=dt; ctx.fillStyle='#2e4a2a'; ctx.fillRect(0,0,W,H);
    text('よみこみ中……',W/2,H/2,20,'#cfe8b8','center'); requestAnimationFrame(loop); return; }
  update(dt);
  if(state==='title') drawTitle();
  else if(state==='play'){
    drawScreen(); drawHud();
    if(trans){ const a=trans.t<0.23?trans.t/0.23:Math.max(0,(0.46-trans.t)/0.23);
      ctx.fillStyle='rgba(10,14,9,'+a.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  }
  else if(state==='caught') drawCaught(dt);
  else if(state==='basket') drawBasket();
  if(isPortrait && window.innerWidth < 900){
    ctx.fillStyle='rgba(8,12,9,0.86)'; ctx.fillRect(0,0,W,H);
    text('よこ向きに してね',W/2,H/2-16,30,'#ffffff','center');
    text('横画面のほうが 広く 見えます',W/2,H/2+18,16,'#cfe8b8','center');
  }
  requestAnimationFrame(loop);
}
load(); requestAnimationFrame(loop);

// ===== 自動テスト用 =====
const qp=new URLSearchParams(location.search);
if(qp.get('record')==='1'){
  window._recordCtrl={
    start:()=>{initAudio();startDay();},
    stop:()=>{},
    goto:(id)=>{ if(SC[id]){ enterScreen(id); const a=SC[id].area;
      const f=nearestFree((a[0]+a[1])/2,(a[2]+a[3])/2); player.x=f.x; player.y=f.y; } },
    dbg:()=>({ state, screen:cur, step, dayT:+dayT.toFixed(2), caught:caught.length,
      px:player?Math.round(player.x):0, py:player?Math.round(player.y):0,
      exits:(SC[cur].exits||[]).map(e=>e.side+'->'+e.to),
      bugs:bugs.filter(b=>!b.gone).map(b=>({k:b.key,x:Math.round(b.x),y:Math.round(b.y)})),
      npcs:npcs.map(n=>n.who), talk: talkBox?talkBox.who:null }),
  };
}

})();
