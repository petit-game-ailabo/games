<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>なつやすみ｜写真の中を歩く</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    background:#07100b; display:flex; justify-content:center; align-items:center;
    font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #c { display:block; box-shadow:0 0 50px rgba(0,0,0,0.7); touch-action:none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<!-- 読みこむ順に いみが ある。state.js より あとで input.js を読む -->
<script src="js/core.js"></script>     <!-- 画面の大きさ・データの読みこみ・こまかい計算 -->
<script src="js/world.js"></script>    <!-- 日を またいで のこるもの。セーブの中身 -->
<script src="js/chars.js"></script>    <!-- キャラの絵（base64）。読む必要なし -->
<script src="js/events.js"></script>   <!-- 場面を データから 組み立てる -->
<script src="js/audio.js"></script>    <!-- 環境音と ラジオたいそうの曲 -->
<script src="js/geom.js"></script>     <!-- 歩ける判定と 遠近の計算 -->
<script src="js/state.js"></script>    <!-- いまの状態をしまう箱 -->
<script src="js/draw.js"></script>     <!-- 絵をかく道具 -->
<script src="js/mini.js"></script>     <!-- ミニゲーム。虫とり・釣りは ここに 足す -->
<script src="js/scene.js"></script>    <!-- 場面を すすめる仕組み -->
<script src="js/input.js"></script>    <!-- キーボードとタッチ -->
<script src="js/game.js"></script>     <!-- 毎フレームの本体 -->

<!--
  さわる場所の めやす
    キャラの名まえ・絵        → data/cast.json     ← ツクールが 書きかえる
    背景写真を たす／道を直す → data/screens.json  ← ツクールが 書きかえる
                                （?edit=1 で 歩ける範囲を 引きなおせる）
    セリフを ふやす           → data/talks.json    ← ツクールが 書きかえる
    場面・ひきがね・よやく    → data/events.json   ← ツクールが 書きかえる
    もちもの                  → data/items.json    ← ツクールが 書きかえる

  data/*.json は fetch で よむので、**このファイルを 直接ひらいても うごかない。**
  かならず サーバごしに ひらくこと：
      python -m http.server 8000   →   http://127.0.0.1:8000/photo/
-->
</body>
</html>
