  if (n < 30) return '二十' + KANSUJI[n-20];
  return n === 30 ? '三十' : '三十一';
}

// ===== 音（環境音だけ。曲は 朝の たいそう のときだけ）=====
let AC = null, ambGain = null, ambTimer = 0;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  ambGain = AC.createGain(); ambGain.gain.value = 0.0; ambGain.connect(AC.destination);
  const len = AC.sampleRate * 3;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const wg = AC.createGain(); wg.gain.value = 0.16;
  src.connect(lp); lp.connect(wg); wg.connect(ambGain); src.start();
  ambGain.gain.linearRampToValueAtTime(0.9, AC.currentTime + 1.6);
}
function cicada(vol, freq, dur) {
  if (!AC) return;
  const t = AC.currentTime, len = Math.ceil(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) {
    const ph = i / AC.sampleRate;
    const trill = 0.55 + 0.45*Math.sign(Math.sin(ph*2*Math.PI*36));
    d[i] = (Math.random()*2-1) * trill;
  }
  const s = AC.createBufferSource(); s.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=6;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+dur*0.25);
  g.gain.linearRampToValueAtTime(0, t+dur);
  s.connect(bp); bp.connect(g); g.connect(ambGain); s.start(t); s.stop(t+dur+0.05);
}
// ラジオたいそうの曲。原曲は著作権があるので 雰囲気だけ似せた じさくの メロディ。
// バンドパスと ハイパスを とおして「ラジオから鳴っている」音にする
const TAISO_BPM = 132;
const TAISO_MEL = [
  [0,1],[4,1],[7,1],[4,1],  [5,1],[4,1],[2,2],
  [0,1],[4,1],[7,1],[12,1], [7,4],
  [5,1],[7,1],[9,1],[7,1],  [4,1],[2,1],[0,2],
  [2,1],[4,1],[5,1],[7,1],  [0,4],
];
function beep(freq, t0, dur, vol, type, out) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(out); o.start(t0); o.stop(t0+dur+0.06);
}
function playTaiso() {
  const e = 60/TAISO_BPM/2;                       // 八分音符の長さ
  let n = 0; for (const m of TAISO_MEL) n += m[1];
  if (!AC) return n*e + 0.8;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.8;
  const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=430;
  const g  = AC.createGain(); g.gain.value = 0.55;
  bp.connect(hp); hp.connect(g); g.connect(AC.destination);
  const t0 = AC.currentTime + 0.2;
  let at = 0;
  for (const [semi, dur] of TAISO_MEL) {
    beep(523.25*Math.pow(2, semi/12), t0+at*e, dur*e*0.92, 0.15, 'square', bp);
    at += dur;
  }
  for (let i=0; i<n; i+=2) beep(165, t0+i*e, 0.07, 0.09, 'sine', bp);
  return n*e + 0.8;
}

let usingTouch = false;

const stick = { on:false, id:null, ox:0, oy:0, x:0, y:0, moved:false, t0:0 };
function toCanvas(t) {
  const r = canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); usingTouch = true; initAudio();
  const t = e.changedTouches[0], p = toCanvas(t);
  if (state === 'title') { start(); return; }
  if (!stick.on) { stick.on=true; stick.id=t.identifier; stick.ox=p.x; stick.oy=p.y;
                   stick.x=p.x; stick.y=p.y; stick.moved=false; stick.t0=performance.now(); }
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== stick.id) continue;
    const p = toCanvas(t); stick.x = p.x; stick.y = p.y;
    if (Math.hypot(p.x-stick.ox, p.y-stick.oy) > 14) stick.moved = true;
  }
}, { passive:false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === stick.id) {
    // 指を ちょっと つけただけ＝タップ なら セリフを つぎへ
    if (!stick.moved && performance.now()-stick.t0 < 400) advance = true;
    stick.on=false; stick.id=null;
  }
}
canvas.addEventListener('touchend', endTouch, { passive:false });
canvas.addEventListener('touchcancel', endTouch, { passive:false });

});

// ===== 歩ける範囲 =====
function inPoly(x, y, poly) {
  let c = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if ((yi>y) !== (yj>y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) c = !c;
  }
  return c;
}
function walkable(x, y) {
  const sc = SC[cur];
  let ok = false;
  for (const p of sc.walk) if (inPoly(x, y, p)) { ok = true; break; }
  if (!ok) return false;
  for (const s of (sc.solid || [])) {
    const dx = (x-s[0])/s[2], dy = (y-s[1])/s[3];
    if (dx*dx + dy*dy < 1) return false;
  }
  return true;
}
function nearestFree(x, y) {
  if (walkable(x, y)) return { x, y };
  for (let r=8; r<=700; r+=8) {
    for (let i=0; i<24; i++) {
      const a = i/24*Math.PI*2;
      const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r;
      if (walkable(nx, ny)) return { x:nx, y:ny };
    }
  }
  const k = Object.keys(SC[cur].start)[0];
  const p = SC[cur].start[k];
  return { x:p[0], y:p[1] };
}
function heightAt(y) {
  const sc = SC[cur];
  return lerp(sc.hFar, sc.hNear, clamp((y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1));
}
// 画面のうえの距離ではなく、地面のうえの距離ではかる。
// 遠近があるので、奥へ10px 動くのと 横へ10px 動くのでは 実際に離れる量がぜんぜんちがう。
// 見かけの背の高さ h はカメラからの距離に反比例するので
//   奥ゆき z = FOCAL / h ／ 横 x = (画面のx - 中央) / h
// とすると、両方おなじ単位になる。単位は「そこに立ったときの背の高さ」ぶん。
const FOCAL = 900;   // 写真のおよその画角。奥ゆきと横の はかり方のつりあいを決める
const TALK_R = 1.6;  // はなしができる距離。単位は「背の高さ」ぶん
function ground(x, y) {
  const h = heightAt(y);
  return { x:(x - W/2)/h, z:(SC[cur].focal || FOCAL)/h };
}
function groundDist(x1, y1, x2, y2) {
  const a = ground(x1, y1), b = ground(x2, y2);
  return Math.hypot(a.x-b.x, a.z-b.z);
}

// ===== 状態 =====
let state = 'load';
let cur = 'zashiki';
let day = 1;
const player = { x:430, y:500, face:1, bob:0, moving:false, running:false };
let fade = 0, fadeTo = null, nameT = 0, elapsed = 0, exitLock = false;
let talkNpc = null, lineT = 0;
let scene = null;          // {q, i, t, entered, flags}
// その場面だけのキャラ。ひとりずつ じぶんの じょうたい を持つ
//   pose … 'idle'（ふよふよ）／'walk'（歩いている）／'taiso'（たいそう中）／'gone'（もう居ない）
let cast = [];
let playerPose = 'idle';
let sceneSay = null;       // 場面のセリフ [who, text]
let walkTo = null;         // じどうで あるく先
let taisoT0 = -99, taisoBeats = 0;
let veil = 0;              // 場面の切りかわりの 黒い幕
let talkLock = false;      // 場面が おわった直後に かってに 会話が はじまらないように
let nedokoT = 0, nedokoArmed = false;

function moveMove(x, y, spd, dt) {   // 目的地へ 一歩ぶん すすむ（壁ぞいにすべる）
  const dx = x - player.x, dy = y - player.y, d = Math.hypot(dx, dy);
  if (d < 6) return true;
  const step = Math.min(spd*dt, d);
  const nx = player.x + dx/d*step, ny = player.y + dy/d*step;
  let mx = false, my = false;
  if (walkable(nx, player.y)) { player.x = nx; mx = true; }
  if (walkable(player.x, ny)) { player.y = ny; my = true; }
  const slide = Math.max(4, step*2.6);
  if (!my && Math.abs(dy) > 0.5) {
    for (let k=1; k<=slide; k+=0.5) {
      if (walkable(player.x-k, ny)) { player.x -= k; player.y = ny; break; }
      if (walkable(player.x+k, ny)) { player.x += k; player.y = ny; break; }
    }
  }
  if (!mx && Math.abs(dx) > 0.5) {
    for (let k=1; k<=slide; k+=0.5) {
      if (walkable(nx, player.y-k)) { player.y -= k; player.x = nx; break; }
      if (walkable(nx, player.y+k)) { player.y += k; player.x = nx; break; }
    }
  }
  if (dx > 1) player.face = 1; else if (dx < -1) player.face = -1;
  player.bob += dt*9;
  return false;
}

function enter(id, at) {
  cur = id;
  const st = SC[id].start;
  const p = st[at] || st[Object.keys(st)[0]];
  const f = nearestFree(p[0], p[1]);
  player.x = f.x; player.y = f.y;
  nameT = 3.2; exitLock = true; talkNpc = null; lineT = 0;
}
function linesOf(n) { return (n.days && n.days[day]) || null; }
function resetDay() {
  for (const k in SC) for (const n of (SC[k].npc || [])) {
    n.idx = 0; n.done = !linesOf(n);
  }
  talkNpc = null; nedokoT = 0; nedokoArmed = false;
}
function runScene(q) {
  scene = { q, i:0, t:0, entered:-1, flags:{} };
  sceneSay = null; walkTo = null; cast = []; playerPose = 'idle'; taisoT0 = -99; veil = 0;
}
function startMorning() { resetDay(); runScene(morningScript(day)); state = 'scene'; }
function start() { day = 1; startMorning(); fade = 1; }

// ===== 描画 =====
const tmp = document.createElement('canvas'); tmp.width = 16; tmp.height = 16;
const tctx = tmp.getContext('2d');
function drawChar(ci, x, y, h, flip, haze) {
  const cx = (ci%8)*16, cy = Math.floor(ci/8)*16, w = h;
  let src = imgChars, sx = cx, sy = cy;
  if (haze > 0.01) {
    tctx.clearRect(0,0,16,16);
    tctx.globalCompositeOperation = 'source-over';
    tctx.drawImage(imgChars, cx, cy, 16, 16, 0, 0, 16, 16);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.globalAlpha = haze;
    tctx.fillStyle = SC[cur].haze || '#e6eee0';
    tctx.fillRect(0,0,16,16);
    tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
    src = tmp; sx = 0; sy = 0;
  }
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(src, sx, sy, 16, 16, -w/2, -h, w, h);
  ctx.restore();
}
function shadow(x, y, h, soft) {
  ctx.save();
  ctx.fillStyle = '#0c1608';
  ctx.globalAlpha = 0.16 * (soft || 1);
  ctx.beginPath(); ctx.ellipse(x, y, h*0.30, h*0.105, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.30 * (soft || 1);
  ctx.beginPath(); ctx.ellipse(x, y, h*0.19, h*0.062, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function text(t, x, y, size, col, align, weight) {
  ctx.fillStyle = col;
  ctx.font = (weight||'bold') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}
function wrap(t, size, maxW) {
  ctx.font = 'bold ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  const out = []; let line = '';
  for (const ch of t) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
function hazeOf(y) {
  const sc = SC[cur];
  const far = 1 - clamp((y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1);
  return far*far*0.30;
}
function sayBox(who, txt) {
  const lines = wrap(txt, 19, 660);
  const bh = 46 + lines.length*27, by = H - bh - 18;
  ctx.save(); ctx.fillStyle = 'rgba(10,16,12,0.72)'; ctx.fillRect(28, by, W-56, bh); ctx.restore();
  drawChar(CI[who], 74, by + bh - 12, 56, false, 0);
  text(NAME[who] || '', 112, by + 26, 14, '#a9c79c');
  lines.forEach((s, i) => text(s, 112, by + 52 + i*27, 19, '#ffffff'));
}
const sayDur = t => 1.9 + t.length * 0.085;

// ===== 朝のながれを すすめる =====
function endScene() {
  scene = null; state = 'play'; cast = []; sceneSay = null; walkTo = null;
  playerPose = 'idle'; taisoT0 = -99; veil = 0;
  nedokoArmed = false; talkLock = true;   // 場面あけに かってに 会話が はじまらないように
}
const TO_OUT = 0.55, TO_IN = 0.75;        // 場面の切りかわり：くらくなる／あかるくなる
function stepScene(dt) {
  const st = scene.q[scene.i];
  if (!st) { endScene(); return; }
  if (scene.entered !== scene.i) {
    scene.entered = scene.i; scene.t = 0;
    switch (st.k) {
      case 'put':   { const f = nearestFree(st.x, st.y); player.x=f.x; player.y=f.y; break; }
      case 'cast':  cast = st.list.map(c => ({
                      k:c[0], x:c[1], y:c[2], ph:(c[1]*0.013+c[2]*0.007),
                      pose:'idle', face:1, wbob:0, tx:0, ty:0, gone:false }));
                    break;
      case 'say':   sceneSay = [st.who, st.text]; break;
      case 'walk':  walkTo = { x:st.x, y:st.y }; break;
      case 'move':
        for (const [who, x, y, gone] of st.list) {
          const c = cast.find(c => c.k === who);
          if (c) { c.tx = x; c.ty = y; c.gone = !!gone; c.pose = 'walk'; }
        }
        break;
      case 'taiso':
        st.s = playTaiso(); taisoT0 = elapsed;
        taisoBeats = st.s * (TAISO_BPM/60);
        for (const c of cast) if (c.pose !== 'gone') c.pose = 'taiso';
        playerPose = 'taiso';
        break;
      case 'free':  endScene(); return;
    }
  }
  scene.t += dt;
  let done = false;
  switch (st.k) {
    case 'card':  done = scene.t >= st.s; break;
    case 'wait':  done = scene.t >= st.s; break;
    case 'put':   done = true; break;
    case 'cast':  done = true; break;
    case 'say':   done = scene.t >= sayDur(st.text) || (advance && scene.t > 0.3);
                  if (done) sceneSay = null; break;
    case 'to':
      // まっくらにしてから 画面を入れかえ、また あかるくする
      if (scene.t < TO_OUT) veil = scene.t / TO_OUT;
      else {
        if (!scene.flags[scene.i]) { scene.flags[scene.i] = 1; enter(st.sc, st.at); }
        veil = clamp(1 - (scene.t - TO_OUT) / TO_IN, 0, 1);
      }
      done = scene.t >= TO_OUT + TO_IN;
      if (done) veil = 0;
      break;
    case 'taiso':
      done = scene.t >= st.s;
      if (done) {   // たいそうが おわったら ちゃんと ふだんの すがたに もどす
        for (const c of cast) if (c.pose === 'taiso') c.pose = 'idle';
        playerPose = 'idle'; taisoT0 = -99;
      }
      break;
    case 'move': {
      let all = true;
      for (const c of cast) {
        if (c.pose !== 'walk') continue;
        const dx = c.tx-c.x, dy = c.ty-c.y, dd = Math.hypot(dx, dy);
        if (dd < 5) { c.pose = c.gone ? 'gone' : 'idle'; continue; }
        all = false;
        const depth = Math.max(0.45, heightAt(c.y) / SC[cur].hNear);
        const sp = Math.min(130*depth*dt, dd);
        c.x += dx/dd*sp; c.y += dy/dd*sp;
        c.face = dx > 0 ? 1 : -1; c.wbob += dt*9;
      }
      done = all || scene.t > (st.s || 4);
      if (done) for (const c of cast) if (c.pose === 'walk') c.pose = c.gone ? 'gone' : 'idle';
      break;
    }
    case 'walk':
      done = moveMove(walkTo.x, walkTo.y, 150, dt) || scene.t > 6;
      if (done) walkTo = null;
      break;
    default: done = true;
  }
  if (done) scene.i++;
}

// ===== ループ =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  elapsed += dt;

  if (state === 'load') {
    ctx.fillStyle = '#07100b'; ctx.fillRect(0,0,W,H);
    text('よみこみちゅう…', W/2, H/2, 20, '#7fa87a', 'center');
    requestAnimationFrame(loop); return;
  }
  if (state === 'title') {
    ctx.drawImage(SC.aze.img, 0, 0, W, H);
    ctx.fillStyle = 'rgba(6,14,8,0.45)'; ctx.fillRect(0,0,W,H);
    text('なつやすみ', W/2, 200, 46, '#ffffff', 'center');
    text('しゃしんの なかを あるく', W/2, 240, 18, '#dbead2', 'center');
    text('やじるし / WASD で あるく　　Shift で はしる', W/2, 340, 16, '#c9dcc0', 'center');
    text('だれかの そばに いると はなしを してくれる', W/2, 368, 16, '#c9dcc0', 'center');
    text('スペース / タップ で セリフを つぎへ', W/2, 396, 16, '#c9dcc0', 'center');
    text('ざしきの ふとんで じっとしていると 1にちが おわる', W/2, 424, 16, '#c9dcc0', 'center');
    text(usingTouch ? 'がめんを ドラッグ ではじまる' : 'スペースキー ではじまる', W/2, 456, 16, '#c9dcc0', 'center');
    text('背景写真: Guilhem Vellut / 663highland / Fumihiko Ueno（CC BY・Wikimedia Commons）',
         W/2, 502, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    text('キャラ: Majstek — 非商用　／　ラジオたいそうの曲は じさく（原曲は使っていません）',
         W/2, 520, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    requestAnimationFrame(loop); return;
  }

  const inScene = (state === 'scene');
  if (inScene) stepScene(dt);
  const sc = SC[cur];

  if (!fadeTo && !walkable(player.x, player.y)) {
    const f = nearestFree(player.x, player.y);
    player.x = f.x; player.y = f.y;
  }

  // --- うごく（自由行動のときだけ）
  let ax=0, ay=0, tilt=0;
  if (!fadeTo && !inScene) {
    for (const c in MOVE) if (keys[c]) { ax += MOVE[c][0]; ay += MOVE[c][1]; }
    if (ax || ay) { const m = Math.hypot(ax,ay); ax/=m; ay/=m; tilt = 1; }
    if (stick.on) {
      const dx = stick.x-stick.ox, dy = stick.y-stick.oy, dd = Math.hypot(dx,dy);
      if (dd > 12) { tilt = Math.min(1, (dd-12)/62); ax = dx/dd; ay = dy/dd; }
    }
  }
  player.running = !inScene && (!!(keys.ShiftLeft || keys.ShiftRight) || (stick.on && tilt > 0.72));
  player.moving = (ax !== 0 || ay !== 0) || !!walkTo;

  if (ax !== 0 || ay !== 0) {
    const depth = Math.max(0.45, heightAt(player.y) / sc.hNear);
    const spd = (player.running ? 300 : 172) * depth * (stick.on ? Math.max(0.35, tilt) : 1);
    const step = spd*dt;
    const nx = player.x + ax*step, ny = player.y + ay*step;
    let movedX = false, movedY = false;
    if (ax !== 0 && walkable(nx, player.y)) { player.x = nx; movedX = true; }
    if (ay !== 0 && walkable(player.x, ny)) { player.y = ny; movedY = true; }
    const slide = Math.max(4, step * 2.6);
    if (ay !== 0 && !movedY) {
      for (let k = 1; k <= slide; k += 0.5) {
        if (walkable(player.x - k, ny)) { player.x -= k; player.y = ny; break; }
        if (walkable(player.x + k, ny)) { player.x += k; player.y = ny; break; }
      }
    }
    if (ax !== 0 && !movedX) {
      for (let k = 1; k <= slide; k += 0.5) {
        if (walkable(nx, player.y - k)) { player.y -= k; player.x = nx; break; }
        if (walkable(nx, player.y + k)) { player.y += k; player.x = nx; break; }
      }
    }
    if (ax > 0.2) player.face = 1; else if (ax < -0.2) player.face = -1;
    player.bob += dt * (player.running ? 15 : 9);
  } else if (!walkTo) {
    player.bob += dt * 1.6;
  }

  // --- 画面のはしへ（自由行動のときだけ）
  const onExit = e => player.x > e.x0 && player.x < e.x1 && player.y > e.y0 && player.y < e.y1;
  if (exitLock && !sc.exits.some(onExit)) exitLock = false;
  if (!fadeTo && !inScene && !exitLock) {
    for (const e of sc.exits) if (onExit(e)) { fadeTo = e; break; }
  }
  if (fadeTo) {
    fade += dt * 2.2;
    if (fade >= 1 && fadeTo.to) { enter(fadeTo.to, fadeTo.at); fadeTo = { done:true }; }
    if (fadeTo && fadeTo.done) { fade -= dt*3.6; if (fade <= 0) { fade = 0; fadeTo = null; } }
  } else if (fade > 0) {
    fade = Math.max(0, fade - dt*1.4);
  }

  // --- ふとんで じっとしていたら 1にちが おわる
  if (!inScene && !fadeTo && sc.nedoko) {
    const inBed = dist(player.x, player.y, sc.nedoko.x, sc.nedoko.y) < sc.nedoko.r;
    if (!inBed) nedokoArmed = true;
    if (inBed && nedokoArmed && !player.moving) {
      nedokoT += dt;
      if (nedokoT > 1.2) {
        day++;
        runScene([...NIGHT, ...morningScript(day)]);
        state = 'scene'; resetDay();
      }
    } else nedokoT = 0;
  }

  // --- はなし。そばに居るあいだ だけ すすむ。ぜんぶ おわったら もう ひらかない
  let near = null, anyNear = false;
  for (const n of (sc.npc || [])) {
    for (const w of n.who) {
      if (groundDist(player.x, player.y, w[1], w[2]) < TALK_R) {
        anyNear = true;
        if (!n.done && !near) near = n;
      }
    }
  }
  // 場面が おわった直後に となりに 居あわせただけで はじまらないように、
  // いちど はなれてから でないと 会話しない
  if (!anyNear) talkLock = false;
  if (fadeTo || inScene || talkLock) near = null;
  if (near !== talkNpc) { talkNpc = near; lineT = 0; }
  if (talkNpc) {
    const L = linesOf(talkNpc);
    const li = L[talkNpc.idx || 0];
    lineT += dt;
    if (lineT >= sayDur(li[1]) || (advance && lineT > 0.3)) {
      talkNpc.idx = (talkNpc.idx || 0) + 1;
      lineT = 0;
      if (talkNpc.idx >= L.length) { talkNpc.done = true; talkNpc = null; }
    }
  }

  // --- セミ
  if (AC) {
    ambTimer -= dt;
    if (ambTimer <= 0) {
      ambTimer = (sc.amb === 'in' ? 1.6 : 0.7) + Math.random()*1.8;
      const k = sc.amb === 'ki';
      cicada(k ? 0.13 : (sc.amb === 'in' ? 0.035 : 0.06),
             k ? 2300 + Math.random()*900 : 3000 + Math.random()*700,
             0.8 + Math.random()*1.4);
    }
  }

  // --- えがく
  ctx.drawImage(sc.img, 0, 0, W, H);

  // ラジオたいそうの ひょうし。曲が おわったら もう はずまない
  const tb = (elapsed - taisoT0) * (TAISO_BPM/60);
  const beat = (taisoT0 > -90 && tb >= 0 && tb < taisoBeats) ? tb : -1;
  const hop  = beat >= 0 ? Math.abs(Math.sin(beat*Math.PI)) : 0;
  const nobi = beat >= 0 && (Math.floor(beat) % 8) >= 4 ? 1 : 0;

  // だれが どの すがたで居るかは、そのキャラ じしんが 持っている
  const actors = [];
  if (inScene) {
    for (const c of cast) if (c.pose !== 'gone')
      actors.push({ k:c.k, x:c.x, y:c.y, ph:c.ph, pose:c.pose, face:c.face, wbob:c.wbob });
  } else {
    for (const n of (sc.npc || [])) for (const w of n.who)
      actors.push({ k:w[0], x:w[1], y:w[2], ph:(w[1]*0.013 + w[2]*0.007), pose:'idle', face:1 });
  }
  actors.push({ k:'cirno', x:player.x, y:player.y, me:true,
                pose:inScene ? playerPose : 'idle', face:player.face });
  actors.sort((a,b) => a.y - b.y);
  for (const a of actors) {
    let h = heightAt(a.y);
    let off;
    if (a.pose === 'taiso') {
      h *= 1 + 0.10*nobi*hop;
      off = h*0.14*hop;
    } else if (a.me) {
      off = player.moving ? Math.abs(Math.sin(player.bob)) * h*0.035
                          : Math.sin(player.bob) * h*0.008;
    } else if (a.pose === 'walk') {
      off = Math.abs(Math.sin(a.wbob)) * h*0.05 + h*0.05;
    } else {
      // ふよふよ。妖精なので すこし浮いている
      off = Math.sin(elapsed*1.7 + a.ph*7) * h*0.055 + h*0.06;
    }
    shadow(a.x, a.y, h, a.me ? 1 : 0.65);
    drawChar(CI[a.k], a.x, a.y - off, h, a.face < 0, hazeOf(a.y));
  }

  // 場所の名まえ
  if (nameT > 0) {
    nameT -= dt;
    const a = clamp(nameT > 2.6 ? (3.2-nameT)/0.6 : Math.min(1, nameT/0.9), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,16,10,0.42)'; ctx.fillRect(0, 40, 250, 44);
    text(sc.name, 24, 71, 25, '#ffffff');
    ctx.restore();
  }

  // はなしの まど
  if (inScene && sceneSay) sayBox(sceneSay[0], sceneSay[1]);
  else if (talkNpc) {
    const li = linesOf(talkNpc)[talkNpc.idx || 0];
    sayBox(li[0], li[1]);
  }

  if (fade > 0) {
    ctx.fillStyle = 'rgba(250,252,246,' + clamp(fade,0,1) + ')';
    ctx.fillRect(0,0,W,H);
  }
  // 場面の切りかわり。いちど まっくらに してから つぎの場所へ
  if (veil > 0) {
    ctx.fillStyle = 'rgba(6,9,7,' + clamp(veil,0,1) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // 日づけ／よる の 黒い画面
  if (inScene) {
    const st = scene && scene.q[scene.i];
    if (st && st.k === 'card') {
      const a = clamp(Math.min(scene.t/0.5, (st.s-scene.t)/0.6), 0, 1);
      ctx.fillStyle = 'rgba(8,10,9,' + (0.94*Math.min(1, a*1.6)) + ')'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.globalAlpha = a;
      text(st.text, W/2, H/2 + 10, 40, '#f2f6ee', 'center');
      ctx.restore();
    }
  }

  // --- ?edit=1 の下書き
  if (EDIT) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,60,60,0.95)'; ctx.lineWidth = 2;
    for (const p of sc.walk) {
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for (let i=1;i<p.length;i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.closePath(); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,180,60,0.95)';
    for (const s of (sc.solid || [])) {
      ctx.beginPath(); ctx.ellipse(s[0], s[1], s[2], s[3], 0, 0, Math.PI*2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(90,220,255,0.8)';
    for (const e of sc.exits) ctx.strokeRect(e.x0, e.y0, e.x1-e.x0, e.y1-e.y0);
    if (sc.nedoko) {
      ctx.strokeStyle = 'rgba(255,140,220,0.9)';
      ctx.beginPath(); ctx.arc(sc.nedoko.x, sc.nedoko.y, sc.nedoko.r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(120,255,150,0.85)';
    for (const n of (sc.npc || [])) for (const w of n.who) {
      ctx.beginPath();
      for (let i=0; i<=48; i++) {
        const a = i/48*Math.PI*2;
        let lo = 0, hi = 900;
        for (let k=0; k<18; k++) {
          const mid = (lo+hi)/2;
          if (groundDist(w[1]+Math.cos(a)*mid, w[2]+Math.sin(a)*mid, w[1], w[2]) < TALK_R) lo = mid;
          else hi = mid;
        }
        const px = w[1]+Math.cos(a)*lo, py = w[2]+Math.sin(a)*lo;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H-58, W, 58);
    text(cur + '  八月' + day + '日  [' + Math.round(mouse.x) + ', ' + Math.round(mouse.y)
       + ']  せ:' + Math.round(heightAt(player.y)) + '  ' + (walkable(player.x,player.y)?'ゆか':'そと'),
       12, H-34, 15, '#ffe08a');
    text('クリックで点を置く／Backspaceで戻す／Cでコンソールに出力：' + JSON.stringify(editPts).slice(0,84),
       12, H-12, 13, '#bcd6ff');
    ctx.restore();
  }

  advance = false;   // 1フレームで つかいきる
  requestAnimationFrame(loop);
}

// ===== よみこみ =====
let pending = 0;
function done() { if (--pending === 0) { resetDay(); state = 'title'; } }
function load() {
  pending = 1;
  imgChars.onload = done;
  imgChars.src = 'data:image/png;base64,' + CHARS_B64;
  for (const k in SC) {
    pending++;
    const im = new Image();
    im.onload = done; im.onerror = done;
    im.src = SC[k].src;
    SC[k].img = im;
  }
}
load();
requestAnimationFrame(loop);

// 録画・検証用
if (qs.has('record') || EDIT) {
  window._ctrl = {
    start: () => { if (state === 'title') start(); },
    goto: (id, at) => { if (SC[id]) enter(id, at); },
    put: (x,y) => { player.x = x; player.y = y; },
    free: () => { endScene(); talkLock = false; },
    sleep: () => { day++; runScene([...NIGHT, ...morningScript(day)]);
                   state = 'scene'; resetDay(); },
    scene: () => scene ? { i:scene.i, n:scene.q.length,
                           k:(scene.q[scene.i]||{}).k, say:sceneSay, veil:+veil.toFixed(2) } : null,
    poses: () => ({ me:playerPose,
                    cast:cast.map(c => ({ k:c.k, pose:c.pose, x:Math.round(c.x), y:Math.round(c.y) })),
                    taisoT0: +(elapsed - taisoT0).toFixed(1), lock:talkLock }),
    talk: () => talkNpc ? { idx:talkNpc.idx||0, n:linesOf(talkNpc).length,
                            line:linesOf(talkNpc)[talkNpc.idx||0] } : null,
    gdist: () => (SC[cur].npc||[]).map(n => n.who.map(
      w => +groundDist(player.x, player.y, w[1], w[2]).toFixed(2))),
    npcState: () => (SC[cur].npc||[]).map(n => ({ idx:n.idx||0, done:!!n.done,
                                                  n:(linesOf(n)||[]).length })),
    R: TALK_R,
    dbg: () => ({ state, cur, day, x:Math.round(player.x), y:Math.round(player.y),
                  h:Math.round(heightAt(player.y)), on:walkable(player.x, player.y),
                  lock:exitLock, talking:!!talkNpc, scene:!!scene }),
  };
}
</script>
