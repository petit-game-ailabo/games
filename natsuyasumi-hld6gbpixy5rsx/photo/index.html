// ===== 音（環境音だけ。曲は鳴らさない）=====
let AC = null, ambGain = null, ambTimer = 0;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  ambGain = AC.createGain(); ambGain.gain.value = 0.0; ambGain.connect(AC.destination);
  const len = AC.sampleRate * 3;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const wg = AC.createGain(); wg.gain.value = 0.16;
  src.connect(lp); lp.connect(wg); wg.connect(ambGain); src.start();
  ambGain.gain.linearRampToValueAtTime(0.9, AC.currentTime + 1.6);
}
function cicada(vol, freq, dur) {
  if (!AC) return;
  const t = AC.currentTime, len = Math.ceil(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) {
    const ph = i / AC.sampleRate;
    const trill = 0.55 + 0.45*Math.sign(Math.sin(ph*2*Math.PI*36));
    d[i] = (Math.random()*2-1) * trill;
  }
  const s = AC.createBufferSource(); s.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=6;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+dur*0.25);
  g.gain.linearRampToValueAtTime(0, t+dur);
  s.connect(bp); bp.connect(g); g.connect(ambGain); s.start(t); s.stop(t+dur+0.05);
}

let usingTouch = false;
const stick = { on:false, id:null, ox:0, oy:0, x:0, y:0 };
function toCanvas(t) {
  const r = canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); usingTouch = true; initAudio();
  const t = e.changedTouches[0], p = toCanvas(t);
  if (state === 'title') { start(); return; }
  if (!stick.on) { stick.on=true; stick.id=t.identifier; stick.ox=p.x; stick.oy=p.y; stick.x=p.x; stick.y=p.y; }
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== stick.id) continue;
    const p = toCanvas(t); stick.x = p.x; stick.y = p.y;
  }
}, { passive:false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === stick.id) { stick.on=false; stick.id=null; }
}
canvas.addEventListener('touchend', endTouch, { passive:false });

// ===== 歩ける範囲 =====
function inPoly(x, y, poly) {
  let c = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if ((yi>y) !== (yj>y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) c = !c;
  }
  return c;
}
function walkable(x, y) {
  const sc = SC[cur];
  let ok = false;
  for (const p of sc.walk) if (inPoly(x, y, p)) { ok = true; break; }
  if (!ok) return false;
  for (const s of (sc.solid || [])) {
    const dx = (x-s[0])/s[2], dy = (y-s[1])/s[3];
    if (dx*dx + dy*dy < 1) return false;
  }
  return true;
}
function nearestFree(x, y) {
  if (walkable(x, y)) return { x, y };
  for (let r=8; r<=700; r+=8) {
    for (let i=0; i<24; i++) {
      const a = i/24*Math.PI*2;
      const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r;
      if (walkable(nx, ny)) return { x:nx, y:ny };
    }
  }
  const k = Object.keys(SC[cur].start)[0];
  const p = SC[cur].start[k];
  return { x:p[0], y:p[1] };
}
function heightAt(y) {
  const sc = SC[cur];
  return lerp(sc.hFar, sc.hNear, clamp((y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1));
}

// 画面のうえの距離ではなく、地面のうえの距離ではかる。
// 遠近があるので、奥へ10px 動くのと 横へ10px 動くのでは 実際に離れる量がぜんぜんちがう。
// 見かけの背の高さ h はカメラからの距離に反比例するので
//   奥ゆき z = FOCAL / h ／ 横 x = (画面のx - 中央) / h
// とすると、両方おなじ単位になる。単位は「そこに立ったときの背の高さ」ぶん。
const FOCAL = 900;   // 写真のおよその画角。奥ゆきと横の はかり方のつりあいを決める
const TALK_R = 1.6;  // はなしができる距離。単位は「背の高さ」ぶん
function ground(x, y) {
  const h = heightAt(y);
  return { x:(x - W/2)/h, z:(SC[cur].focal || FOCAL)/h };
}
function groundDist(x1, y1, x2, y2) {
  const a = ground(x1, y1), b = ground(x2, y2);
  return Math.hypot(a.x-b.x, a.z-b.z);
}

let state = 'load';

const player = { x:430, y:500, face:1, bob:0, moving:false, running:false };
let fade = 0, fadeTo = null, nameT = 0, elapsed = 0, exitLock = false;
let talkNpc = null, lineT = 0;

function enter(id, at) {
  cur = id;
  const st = SC[id].start;
  const p = st[at] || st[Object.keys(st)[0]];
  const f = nearestFree(p[0], p[1]);
  player.x = f.x; player.y = f.y;
  nameT = 3.2; exitLock = true; talkNpc = null; lineT = 0;
}
function start() {
  state = 'play';
  enter('zashiki', 'mae');
  fade = 1;
}

// ===== 描画 =====
const tmp = document.createElement('canvas'); tmp.width = 16; tmp.height = 16;
const tctx = tmp.getContext('2d');
function drawChar(ci, x, y, h, flip, haze) {
  const cx = (ci%8)*16, cy = Math.floor(ci/8)*16, w = h;
  let src = imgChars, sx = cx, sy = cy;
  if (haze > 0.01) {
    tctx.clearRect(0,0,16,16);
    tctx.globalCompositeOperation = 'source-over';
    tctx.drawImage(imgChars, cx, cy, 16, 16, 0, 0, 16, 16);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.globalAlpha = haze;
    tctx.fillStyle = SC[cur].haze || '#e6eee0';
    tctx.fillRect(0,0,16,16);
    tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
    src = tmp; sx = 0; sy = 0;
  }
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(src, sx, sy, 16, 16, -w/2, -h, w, h);
  ctx.restore();
}
function shadow(x, y, h, soft) {
  ctx.save();
  ctx.fillStyle = '#0c1608';
  ctx.globalAlpha = 0.16 * (soft || 1);
  ctx.beginPath(); ctx.ellipse(x, y, h*0.30, h*0.105, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.30 * (soft || 1);
  ctx.beginPath(); ctx.ellipse(x, y, h*0.19, h*0.062, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function text(t, x, y, size, col, align, weight) {
  ctx.fillStyle = col;
  ctx.font = (weight||'bold') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}
function wrap(t, size, maxW) {
  ctx.font = 'bold ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  const out = []; let line = '';
  for (const ch of t) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
function hazeOf(y) {
  const sc = SC[cur];
  const far = 1 - clamp((y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1);
  return far*far*0.30;
}

// ===== ループ =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  elapsed += dt;

  if (state === 'load') {
    ctx.fillStyle = '#07100b'; ctx.fillRect(0,0,W,H);
    text('よみこみちゅう…', W/2, H/2, 20, '#7fa87a', 'center');
    requestAnimationFrame(loop); return;
  }
  if (state === 'title') {
    ctx.drawImage(SC.aze.img, 0, 0, W, H);
    ctx.fillStyle = 'rgba(6,14,8,0.45)'; ctx.fillRect(0,0,W,H);
    text('なつやすみ', W/2, 206, 46, '#ffffff', 'center');
    text('しゃしんの なかを あるく', W/2, 246, 18, '#dbead2', 'center');
    text('やじるし / WASD で あるく　　Shift で はしる', W/2, 348, 16, '#c9dcc0', 'center');
    text('だれかの そばに いると はなしを してくれる', W/2, 376, 16, '#c9dcc0', 'center');
    text(usingTouch ? 'がめんを ドラッグ' : 'スペースキー ではじまる', W/2, 410, 16, '#c9dcc0', 'center');
    text('背景写真: Guilhem Vellut / 663highland / Fumihiko Ueno / 先従隗始',
         W/2, 500, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    text('（CC BY・CC0 / Wikimedia Commons）　キャラ: Majstek — 非商用',
         W/2, 518, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    requestAnimationFrame(loop); return;
  }

  const sc = SC[cur];

  if (!fadeTo && !walkable(player.x, player.y)) {
    const f = nearestFree(player.x, player.y);
    player.x = f.x; player.y = f.y;
  }

  // --- うごく
  let ax=0, ay=0, tilt=0;
  if (!fadeTo) {
    for (const c in MOVE) if (keys[c]) { ax += MOVE[c][0]; ay += MOVE[c][1]; }
    if (ax || ay) { const m = Math.hypot(ax,ay); ax/=m; ay/=m; tilt = 1; }
    if (stick.on) {
      const dx = stick.x-stick.ox, dy = stick.y-stick.oy, dd = Math.hypot(dx,dy);
      if (dd > 12) { tilt = Math.min(1, (dd-12)/62); ax = dx/dd; ay = dy/dd; }
    }
  }
  player.running = !!(keys.ShiftLeft || keys.ShiftRight) || (stick.on && tilt > 0.72);
  player.moving = (ax !== 0 || ay !== 0);

  if (player.moving) {
    const depth = Math.max(0.45, heightAt(player.y) / sc.hNear);
    const spd = (player.running ? 300 : 172) * depth * (stick.on ? Math.max(0.35, tilt) : 1);
    const step = spd*dt;
    const nx = player.x + ax*step, ny = player.y + ay*step;
    let movedX = false, movedY = false;
    if (ax !== 0 && walkable(nx, player.y)) { player.x = nx; movedX = true; }
    if (ay !== 0 && walkable(player.x, ny)) { player.y = ny; movedY = true; }
    // 壁ぞいにすべる。道は奥ですぼまるので、これがないと まっすぐ奥へ押すだけで引っかかる
    const slide = Math.max(4, step * 2.6);
    if (ay !== 0 && !movedY) {
      for (let k = 1; k <= slide; k += 0.5) {
        if (walkable(player.x - k, ny)) { player.x -= k; player.y = ny; break; }
        if (walkable(player.x + k, ny)) { player.x += k; player.y = ny; break; }
      }
    }
    if (ax !== 0 && !movedX) {
      for (let k = 1; k <= slide; k += 0.5) {
        if (walkable(nx, player.y - k)) { player.y -= k; player.x = nx; break; }
        if (walkable(nx, player.y + k)) { player.y += k; player.x = nx; break; }
      }
    }
    if (ax > 0.2) player.face = 1; else if (ax < -0.2) player.face = -1;
    player.bob += dt * (player.running ? 15 : 9);
  } else {
    player.bob += dt * 1.6;
  }

  // --- 画面のはしへ。入ってすぐ出口の上に立っていても すぐには通さない
  const onExit = e => player.x > e.x0 && player.x < e.x1 && player.y > e.y0 && player.y < e.y1;
  if (exitLock && !sc.exits.some(onExit)) exitLock = false;
  if (!fadeTo && !exitLock) {
    for (const e of sc.exits) if (onExit(e)) { fadeTo = e; break; }
  }
  if (fadeTo) {
    fade += dt * 2.2;
    if (fade >= 1 && fadeTo.to) { enter(fadeTo.to, fadeTo.at); fadeTo = { done:true }; }
    if (fadeTo && fadeTo.done) { fade -= dt*3.6; if (fade <= 0) { fade = 0; fadeTo = null; } }
  } else if (fade > 0) {
    fade = Math.max(0, fade - dt*1.4);
  }

  // --- はなし。そばに居るあいだだけ すすむ。ぜんぶ おわったら もう ひらかない
  let near = null;
  if (!fadeTo) {
    for (const n of (sc.npc || [])) {
      if (n.done) continue;
      for (const w of n.who) {
        // 「背の高さ 1.6 人ぶん」まで近づいたら はなしができる。
        // 横に離れても 奥に離れても おなじだけ 会話は終わる
        if (groundDist(player.x, player.y, w[1], w[2]) < TALK_R) { near = n; break; }
      }
      if (near) break;
    }
  }
  if (near !== talkNpc) { talkNpc = near; lineT = 0; }
  if (talkNpc) {
    const li = talkNpc.lines[talkNpc.idx || 0];
    lineT += dt;
    if (lineT >= 1.9 + li[1].length * 0.085) {
      talkNpc.idx = (talkNpc.idx || 0) + 1;
      lineT = 0;
      if (talkNpc.idx >= talkNpc.lines.length) { talkNpc.done = true; talkNpc = null; }
    }
  }

  // --- セミ
  if (AC) {
    ambTimer -= dt;
    if (ambTimer <= 0) {
      ambTimer = (sc.amb === 'in' ? 1.6 : 0.7) + Math.random()*1.8;
      const near2 = sc.amb === 'ki';
      cicada(near2 ? 0.13 : (sc.amb === 'in' ? 0.035 : 0.06),
             near2 ? 2300 + Math.random()*900 : 3000 + Math.random()*700,
             0.8 + Math.random()*1.4);
    }
  }

  // --- えがく
  ctx.drawImage(sc.img, 0, 0, W, H);

  // 手前のものが後に来るように 足元のyで並べる
  const actors = [];
  for (const n of (sc.npc || [])) for (const w of n.who)
    actors.push({ k:w[0], x:w[1], y:w[2], npc:true, ph:(w[1]*0.013 + w[2]*0.007) });
  actors.push({ k:'cirno', x:player.x, y:player.y, npc:false });
  actors.sort((a,b) => a.y - b.y);
  for (const a of actors) {
    const h = heightAt(a.y);
    if (a.npc) {
      // ふよふよ。妖精なので すこし浮いている
      const fu = Math.sin(elapsed*1.7 + a.ph*7) * h*0.055 + h*0.06;
      shadow(a.x, a.y, h, 0.65);
      drawChar(CI[a.k], a.x, a.y - fu, h, false, hazeOf(a.y));
    } else {
      shadow(a.x, a.y, h);
      const bob = player.moving ? Math.abs(Math.sin(player.bob)) * h*0.035
                                : Math.sin(player.bob) * h*0.008;
      drawChar(CI.cirno, a.x, a.y - bob, h, player.face < 0, hazeOf(a.y));
    }
  }

  // 場所の名まえ
  if (nameT > 0) {
    nameT -= dt;
    const a = clamp(nameT > 2.6 ? (3.2-nameT)/0.6 : Math.min(1, nameT/0.9), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,16,10,0.42)'; ctx.fillRect(0, 40, 250, 44);
    text(sc.name, 24, 71, 25, '#ffffff');
    ctx.restore();
  }

  // はなしの まど
  if (talkNpc) {
    const li = talkNpc.lines[talkNpc.idx || 0];
    const lines = wrap(li[1], 19, 660);
    const bh = 46 + lines.length*27;
    const by = H - bh - 18;
    ctx.save();
    ctx.fillStyle = 'rgba(10,16,12,0.72)';
    ctx.fillRect(28, by, W-56, bh);
    ctx.restore();
    drawChar(CI[li[0]], 74, by + bh - 12, 56, false, 0);
    text(NAME[li[0]] || '', 112, by + 26, 14, '#a9c79c');
    lines.forEach((s, i) => text(s, 112, by + 52 + i*27, 19, '#ffffff'));
  }

  if (fade > 0) {
    ctx.fillStyle = 'rgba(250,252,246,' + clamp(fade,0,1) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // --- ?edit=1 の下書き
  if (EDIT) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,60,60,0.95)'; ctx.lineWidth = 2;
    for (const p of sc.walk) {
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for (let i=1;i<p.length;i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.closePath(); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,180,60,0.95)';
    for (const s of (sc.solid || [])) {
      ctx.beginPath(); ctx.ellipse(s[0], s[1], s[2], s[3], 0, 0, Math.PI*2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(90,220,255,0.8)';
    for (const e of sc.exits) ctx.strokeRect(e.x0, e.y0, e.x1-e.x0, e.y1-e.y0);
    // はなしができる範囲。遠近があるので 円ではなく 奥がすぼまった形になる
    ctx.strokeStyle = 'rgba(120,255,150,0.85)';
    for (const n of (sc.npc || [])) for (const w of n.who) {
      ctx.beginPath();
      for (let i=0; i<=48; i++) {
        const a = i/48*Math.PI*2;
        let lo = 0, hi = 900;
        for (let k=0; k<18; k++) {
          const mid = (lo+hi)/2;
          if (groundDist(w[1]+Math.cos(a)*mid, w[2]+Math.sin(a)*mid, w[1], w[2]) < TALK_R) lo = mid;
          else hi = mid;
        }
        const px = w[1]+Math.cos(a)*lo, py = w[2]+Math.sin(a)*lo;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    if (editPts.length) {
      ctx.strokeStyle = 'rgba(60,200,255,0.95)';
      ctx.beginPath(); ctx.moveTo(editPts[0][0], editPts[0][1]);
      for (let i=1;i<editPts.length;i++) ctx.lineTo(editPts[i][0], editPts[i][1]);
      ctx.stroke();
      ctx.fillStyle = 'rgba(60,200,255,0.95)';
      for (const p of editPts) ctx.fillRect(p[0]-3, p[1]-3, 6, 6);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H-58, W, 58);
    text(cur + '  [' + Math.round(mouse.x) + ', ' + Math.round(mouse.y) + ']  せ:'
       + Math.round(heightAt(player.y)) + '  ' + (walkable(player.x,player.y)?'ゆか':'そと'),
       12, H-34, 15, '#ffe08a');
    text('クリックで点を置く／Backspaceで戻す／Cでコンソールに出力：' + JSON.stringify(editPts).slice(0,84),
       12, H-12, 13, '#bcd6ff');
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// ===== よみこみ =====
let pending = 0;
function done() { if (--pending === 0) state = 'title'; }
function load() {
  pending = 1;
  imgChars.onload = done;
  imgChars.src = 'data:image/png;base64,' + CHARS_B64;
  for (const k in SC) {
    pending++;
    const im = new Image();
    im.onload = done; im.onerror = done;
    im.src = SC[k].src;
    SC[k].img = im;
  }
}
load();
requestAnimationFrame(loop);

// 録画・検証用
if (qs.has('record') || EDIT) {
  window._ctrl = {
    start: () => { if (state === 'title') start(); },
    goto: (id, at) => { if (SC[id]) enter(id, at); },
    put: (x,y) => { player.x = x; player.y = y; },
    talk: () => talkNpc ? { idx:talkNpc.idx||0, n:talkNpc.lines.length,
                            line:talkNpc.lines[talkNpc.idx||0] } : null,
    gdist: () => (SC[cur].npc||[]).map(n => n.who.map(
      w => +groundDist(player.x, player.y, w[1], w[2]).toFixed(2))),
    R: TALK_R,
    npcState: () => (SC[cur].npc||[]).map(n => ({ idx:n.idx||0, n:n.lines.length, done:!!n.done })),
    dbg: () => ({ state, cur, x:Math.round(player.x), y:Math.round(player.y),
                  h:Math.round(heightAt(player.y)), on:walkable(player.x, player.y),
                  lock:exitLock, talking:!!talkNpc }),
  };
}
</script>
