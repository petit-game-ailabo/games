    start: { far:[473,214], near:[500,505] },
    exits: [
      { x0:436, x1:512, y0:186, y1:222, to:'michi', at:'near' },   // 奥へ
    ],
    amb: 'ki',    // 木のざわめき・セミ多め
  },
  michi: {
    name: 'むらのみち',
    src: 'bg/michi.jpg',
    walk: [
      [[496,206],[528,206],[572,246],[604,302],[644,362],[672,422],[690,482],[700,545],
       [100,545],[160,482],[215,422],[276,362],[346,302],[430,246]],
      // 祠の前の白い砂利。とくに用のない場所
      [[620,352],[940,336],[956,470],[956,545],[702,545],[664,440]]
    ],
    yTop:206, yBot:540, hFar:30, hNear:136,
    haze: '#dfe9f2',
    start: { far:[512,228], near:[400,500] },
    exits: [
      { x0:480, x1:548, y0:200, y1:236, to:'aze', at:'near' },
    ],
    amb: 'mura',  // 開けた場所。風と とおくのセミ
  },
};

// ===== 音（環境音だけ。曲は鳴らさない）=====
let AC = null, ambGain = null, ambTimer = 0;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  ambGain = AC.createGain(); ambGain.gain.value = 0.0; ambGain.connect(AC.destination);
  // 風：ノイズを低く絞ったもの
  const len = AC.sampleRate * 3;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const wg = AC.createGain(); wg.gain.value = 0.16;
  src.connect(lp); lp.connect(wg); wg.connect(ambGain); src.start();
  ambGain.gain.linearRampToValueAtTime(0.9, AC.currentTime + 1.6);
}
// セミ：短い帯域ノイズを小刻みに切って鳴らす
function cicada(vol, freq, dur) {
  if (!AC) return;
  const t = AC.currentTime, len = Math.ceil(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) {
    const ph = i / AC.sampleRate;
    const trill = 0.55 + 0.45*Math.sign(Math.sin(ph*2*Math.PI*36));
    d[i] = (Math.random()*2-1) * trill;
  }
  const s = AC.createBufferSource(); s.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=6;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+dur*0.25);
  g.gain.linearRampToValueAtTime(0, t+dur);
  s.connect(bp); bp.connect(g); g.connect(ambGain); s.start(t); s.stop(t+dur+0.05);
}

// ===== 入力 =====
const keys = {};
const MOVE = { ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1],
               ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0] };
window.addEventListener('keydown', e => {
  if (e.code in MOVE || e.code === 'Space' || e.code.startsWith('Shift')) e.preventDefault();
  keys[e.code] = true; initAudio();
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) start();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick.on = false; });

let usingTouch = false;
const stick = { on:false, id:null, ox:0, oy:0, x:0, y:0, moved:false, t0:0 };
function toCanvas(t) {
  const r = canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H };
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); usingTouch = true; initAudio();
  const t = e.changedTouches[0], p = toCanvas(t);
  if (state === 'title') { start(); return; }
  if (!stick.on) { stick.on=true; stick.id=t.identifier; stick.ox=p.x; stick.oy=p.y;
                   stick.x=p.x; stick.y=p.y; stick.moved=false; stick.t0=performance.now(); }
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== stick.id) continue;
    const p = toCanvas(t); stick.x = p.x; stick.y = p.y;
    if (Math.hypot(p.x-stick.ox, p.y-stick.oy) > 14) stick.moved = true;
  }
}, { passive:false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === stick.id) { stick.on=false; stick.id=null; }
}
canvas.addEventListener('touchend', endTouch, { passive:false });
canvas.addEventListener('touchcancel', endTouch, { passive:false });

// ?edit=1：クリックした点を並べて、歩ける範囲を作り直せるようにしておく
const editPts = [];
let mouse = { x:0, y:0 };
canvas.addEventListener('mousemove', e => { mouse = toCanvas(e); });
canvas.addEventListener('mousedown', e => {
  if (usingTouch) return;
  initAudio();
  if (state === 'title') { start(); return; }
  if (EDIT) { const p = toCanvas(e); editPts.push([Math.round(p.x), Math.round(p.y)]); }
});
window.addEventListener('keydown', e => {
  if (EDIT && e.code === 'Backspace') { editPts.pop(); e.preventDefault(); }
  if (EDIT && e.code === 'KeyC') { console.log(JSON.stringify(editPts)); }
});

// ===== 歩ける範囲 =====
function inPoly(x, y, poly) {
  let c = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if ((yi>y) !== (yj>y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) c = !c;
  }
  return c;
}
function walkable(x, y) {
  const sc = SC[cur];
  for (const p of sc.walk) if (inPoly(x, y, p)) return true;
  return false;
}
function nearestFree(x, y) {
  if (walkable(x, y)) return { x, y };
  for (let r=8; r<=600; r+=8) {
    for (let i=0; i<20; i++) {
      const a = i/20*Math.PI*2;
      const nx = x + Math.cos(a)*r, ny = y + Math.sin(a)*r;
      if (walkable(nx, ny)) return { x:nx, y:ny };
    }
  }
  const p = SC[cur].start.near;
  return { x:p[0], y:p[1] };
}
// 足元のy座標から 背の高さを決める。写真の遠近に合わせる
function heightAt(y) {
  const sc = SC[cur];
  const t = clamp((y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1);
  return lerp(sc.hFar, sc.hNear, t);
}

// ===== 状態 =====
let state = 'load';
let cur = 'aze';
const player = { x:500, y:505, face:1, bob:0, moving:false, running:false };
let fade = 0, fadeTo = null, nameT = 0, elapsed = 0;

function enter(id, at) {
  cur = id;
  const p = SC[id].start[at || 'near'];
  const f = nearestFree(p[0], p[1]);
  player.x = f.x; player.y = f.y;
  nameT = 3.2;
}
function start() {
  state = 'play';
  enter('aze', 'near');
  fade = 1;
}

// ===== 描画 =====
// 遠くのものは 空気の色にすこし溶ける。これがないとキャラが写真から浮く
const tmp = document.createElement('canvas'); tmp.width = 16; tmp.height = 16;
const tctx = tmp.getContext('2d');
function drawChar(ci, x, y, h, flip, haze) {
  const cx = (ci%8)*16, cy = Math.floor(ci/8)*16;
  const w = h; // 16x16 なので 高さ＝幅
  let src = imgChars, sx = cx, sy = cy;
  if (haze > 0.01) {
    tctx.clearRect(0,0,16,16);
    tctx.globalCompositeOperation = 'source-over';
    tctx.drawImage(imgChars, cx, cy, 16, 16, 0, 0, 16, 16);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.globalAlpha = haze;
    tctx.fillStyle = SC[cur].haze || '#e6eee0';
    tctx.fillRect(0,0,16,16);
    tctx.globalAlpha = 1;
    tctx.globalCompositeOperation = 'source-over';
    src = tmp; sx = 0; sy = 0;
  }
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(src, sx, sy, 16, 16, -w/2, -h, w, h);
  ctx.restore();
}
function shadow(x, y, h) {
  ctx.save();
  // 足もとの濃い影と、そのまわりのやわらかい影。地面に乗っている感じを出す
  ctx.fillStyle = '#0c1608';
  ctx.globalAlpha = 0.16;
  ctx.beginPath(); ctx.ellipse(x, y, h*0.30, h*0.105, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.30;
  ctx.beginPath(); ctx.ellipse(x, y, h*0.19, h*0.062, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function text(t, x, y, size, col, align, weight) {
  ctx.fillStyle = col;
  ctx.font = (weight||'bold') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}

// ===== ループ =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  elapsed += dt;

  if (state === 'load') {
    ctx.fillStyle = '#07100b'; ctx.fillRect(0,0,W,H);
    text('よみこみちゅう…', W/2, H/2, 20, '#7fa87a', 'center');
    requestAnimationFrame(loop); return;
  }

  if (state === 'title') {
    ctx.drawImage(SC.aze.img, 0, 0, W, H);
    ctx.fillStyle = 'rgba(6,14,8,0.45)'; ctx.fillRect(0,0,W,H);
    text('なつやすみ', W/2, 214, 46, '#ffffff', 'center');
    text('しゃしんの なかを あるく', W/2, 254, 18, '#dbead2', 'center');
    text('やじるし / WASD で あるく　　Shift で はしる', W/2, 372, 16, '#c9dcc0', 'center');
    text(usingTouch ? 'がめんを ドラッグ' : 'スペースキー ではじまる', W/2, 400, 16, '#c9dcc0', 'center');
    // CC BY は表示が必須なので ここに出しておく
    text('背景写真: Fumihiko Ueno (CC BY 3.0) / 先従隗始 (CC0) — Wikimedia Commons',
         W/2, 500, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    text('キャラ: Majstek (Touhou 16x16 Mini Pack) — 非商用', W/2, 518, 12, 'rgba(226,238,220,0.72)', 'center', 'normal');
    requestAnimationFrame(loop); return;
  }

  const sc = SC[cur];

  // --- うごく
  let ax=0, ay=0, tilt=0;
  if (!fadeTo) {
    for (const c in MOVE) if (keys[c]) { ax += MOVE[c][0]; ay += MOVE[c][1]; }
    if (ax || ay) { const m = Math.hypot(ax,ay); ax/=m; ay/=m; tilt = 1; }
    if (stick.on) {
      const dx = stick.x-stick.ox, dy = stick.y-stick.oy, dd = Math.hypot(dx,dy);
      if (dd > 12) { tilt = Math.min(1, (dd-12)/62); ax = dx/dd; ay = dy/dd; }
    }
  }
  player.running = !!(keys.ShiftLeft || keys.ShiftRight) || (stick.on && tilt > 0.72);
  player.moving = (ax !== 0 || ay !== 0);

  if (player.moving) {
    // 奥にいるほど 画面のうえでは ゆっくり動く（遠近に合わせる）
    const depth = Math.max(0.34, heightAt(player.y) / sc.hNear);
    const spd = (player.running ? 300 : 172) * depth * (stick.on ? Math.max(0.35, tilt) : 1);
    const nx = player.x + ax*spd*dt, ny = player.y + ay*spd*dt;
    const stuck = !walkable(player.x, player.y);
    if (stuck || walkable(nx, player.y)) player.x = nx;
    if (stuck || walkable(player.x, ny)) player.y = ny;
    player.x = clamp(player.x, 4, W-4);
    player.y = clamp(player.y, sc.yTop-6, H-2);
    if (ax > 0.2) player.face = 1; else if (ax < -0.2) player.face = -1;
    player.bob += dt * (player.running ? 15 : 9);
  } else {
    player.bob += dt * 1.6;
  }

  // --- 画面のはしへ
  if (!fadeTo) {
    for (const e of sc.exits) {
      if (player.x > e.x0 && player.x < e.x1 && player.y > e.y0 && player.y < e.y1) {
        fadeTo = e; break;
      }
    }
  }
  if (fadeTo) {
    fade += dt * 2.2;
    if (fade >= 1 && fadeTo.to) { enter(fadeTo.to, fadeTo.at); fadeTo = { to:null, done:true }; }
    if (fadeTo && fadeTo.done) { fade -= dt*3.6; if (fade <= 0) { fade = 0; fadeTo = null; } }
  } else if (fade > 0) {
    fade = Math.max(0, fade - dt*1.4);
  }

  // --- セミ
  if (AC) {
    ambTimer -= dt;
    if (ambTimer <= 0) {
      ambTimer = 0.7 + Math.random()*1.6;
      const near = sc.amb === 'ki';
      cicada(near ? 0.13 : 0.06, near ? 2300 + Math.random()*900 : 3000 + Math.random()*700,
             0.8 + Math.random()*1.4);
    }
  }

  // --- えがく
  ctx.drawImage(sc.img, 0, 0, W, H);

  const h = heightAt(player.y);
  shadow(player.x, player.y, h);
  const bob = player.moving ? Math.abs(Math.sin(player.bob)) * h*0.035 : Math.sin(player.bob)*h*0.008;
  const far = 1 - clamp((player.y - sc.yTop) / (sc.yBot - sc.yTop), 0, 1);
  drawChar(CI.cirno, player.x, player.y - bob, h, player.face < 0, far*far*0.30);

  // 場所の名まえ
  if (nameT > 0) {
    nameT -= dt;
    const a = clamp(nameT > 2.6 ? (3.2-nameT)/0.6 : Math.min(1, nameT/0.9), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,16,10,0.42)'; ctx.fillRect(0, 40, 250, 44);
    text(sc.name, 24, 71, 25, '#ffffff');
    ctx.restore();
  }

  if (fade > 0) {
    ctx.fillStyle = 'rgba(250,252,246,' + clamp(fade,0,1) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // --- ?edit=1 の下書き
  if (EDIT) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,60,60,0.95)'; ctx.lineWidth = 2;
    for (const p of sc.walk) {
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for (let i=1;i<p.length;i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.closePath(); ctx.stroke();
    }
    if (editPts.length) {
      ctx.strokeStyle = 'rgba(60,200,255,0.95)';
      ctx.beginPath(); ctx.moveTo(editPts[0][0], editPts[0][1]);
      for (let i=1;i<editPts.length;i++) ctx.lineTo(editPts[i][0], editPts[i][1]);
      ctx.stroke();
      ctx.fillStyle = 'rgba(60,200,255,0.95)';
      for (const p of editPts) ctx.fillRect(p[0]-3, p[1]-3, 6, 6);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, H-58, W, 58);
    text('[' + Math.round(mouse.x) + ', ' + Math.round(mouse.y) + ']  '
       + 'せ:' + Math.round(h) + '  ' + (walkable(player.x,player.y)?'道の上':'外'),
       12, H-34, 15, '#ffe08a');
    text('クリックで点を置く／Backspaceで戻す／Cでコンソールに出力：' + JSON.stringify(editPts).slice(0,86),
       12, H-12, 13, '#bcd6ff');
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// ===== よみこみ =====
let pending = 0;
function done() { if (--pending === 0) state = 'title'; }
function load() {
  pending = 1;
  imgChars.onload = done;
  imgChars.src = 'data:image/png;base64,' + CHARS_B64;
  for (const k in SC) {
    pending++;
    const im = new Image();
    im.onload = done;
    im.onerror = done;
    im.src = SC[k].src;
    SC[k].img = im;
  }
}
load();
requestAnimationFrame(loop);

// 録画・検証用
if (qs.has('record') || EDIT) {
  window._ctrl = {
    start: () => { if (state === 'title') start(); },
    goto: id => { if (SC[id]) { enter(id, 'near'); } },
    put: (x,y) => { player.x = x; player.y = y; },
    dbg: () => ({ state, cur, x:Math.round(player.x), y:Math.round(player.y),
                  h:Math.round(heightAt(player.y)), on:walkable(player.x, player.y) }),
  };
}
</script>
