// =====================================================================
//  幻想郷のなつやすみ — 縦切りプロトタイプ
//
//  検証したいこと（これだけ）
//   1. 「忍び寄る」は「撃つ」より面白いか
//   2. 捕獲画面とサイズが出た瞬間、嬉しいか
//   3. 虫かごに実物大で並ぶのは、点数の代わりになるか

// =====================================================================

const W = 960, H = 540;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
function resize() {
  const raw = Math.min(window.innerWidth / W, window.innerHeight / H);
  const s = raw >= 2 ? 2 : (raw >= 1 ? 1 : raw);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);
ctx.imageSmoothingEnabled = false;

function sizeRank(ratio) {
  if (ratio < 0.90) return { t:'ちびサイズ',   c:'#9fd0e8' };
  if (ratio < 1.06) return { t:'ふつうサイズ', c:'#e8e8e0' };
  if (ratio < 1.19) return { t:'ビッグサイズ', c:'#ffd166' };
  return { t:'キングサイズ', c:'#ff7a4a', king:true };
}
// チルノの一言
function cirnoLine(rank, first, best) {
  if (first) return 'はじめて 見た！ ずかんに かいとかなきゃ！';
  if (rank.king) return 'で、でっけー！ あたい 天才ね！';
  if (rank.t === 'ビッグサイズ') return 'おっきい！ 大ちゃんに 見せてやろ';
  if (rank.t === 'ちびサイズ') return '……ちっちゃ。まあ いいや';
  return 'ふつうね。まだまだ いるはず';
}

let elapsed = 0, shake = 0;
let escapedCount = 0;
let toast = null;

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

// ===== 情景（1画面ぶん・固定）=====
const TREES = [[168, 336], [520, 300], [826, 356]];
const DECOR = [
  ['bushL', 74, 300], ['bushS', 296, 268], ['rock', 640, 262], ['weed', 400, 250],
  ['weed', 244, 430], ['bushL', 700, 440], ['rock', 108, 442], ['weed', 596, 412],
  ['bushS', 880, 268], ['weed', 760, 300], ['bushL', 430, 452], ['weed', 900, 430],
];
function solids() {
  const out = [];
  for (const [x,y] of TREES) out.push({x, y, r:16});
  for (const [k,x,y] of DECOR) if (k === 'rock') out.push({x, y, r:14});
  return out;
}
const SOLIDS = solids();
function walkable(x, y) {
  if (x < PAD_X || x > W - PAD_X) return false;
  if (y < HORIZON + PAD_TOP || y > STREAM_Y - PAD_BOT) return false;
  for (const s of SOLIDS) if (dist(x, y, s.x, s.y - 4) < s.r) return false;
  return true;
}
function freeSpot() {
  for (let i = 0; i < 300; i++) {
    const x = PAD_X + 20 + Math.random() * (W - PAD_X*2 - 40);
    const y = HORIZON + PAD_TOP + 10 + Math.random() * (STREAM_Y - HORIZON - PAD_TOP - 30);
    if (walkable(x, y)) return { x, y };
  }
  return { x: W/2, y: 400 };
}

// ===== 音 =====
let AC=null, master=null, audioOn=false, waterGain=null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    audioOn = true;
    startWater(); startAmbience();
  } catch(e) { audioOn = false; }
}
function tone(f, dur, type, vol, delay, f2) {
  if (!audioOn) return;
  const t0 = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.12, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBuf(sec, shaper) {
  const n = Math.floor(AC.sampleRate*sec);
  const b = AC.createBuffer(1, n, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = shaper ? shaper(i, n) : (Math.random()*2-1);
  return b;
}
function noiseBurst(dur, f0, f1, vol) {
  if (!audioOn) return;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf(dur, (i,n)=>(Math.random()*2-1)*(1-i/n));
  const bp = AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(f0, AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(f1, AC.currentTime+dur);
  bp.Q.value = 1.2;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(master); src.start();
}
// 小川：ずっと鳴っていて、近づくと大きくなる
function startWater() {
  const src = AC.createBufferSource();
  src.buffer = noiseBuf(2.2); src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 900; bp.Q.value = 0.7;
  const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 380;
  waterGain = AC.createGain(); waterGain.gain.value = 0;
  src.connect(bp); bp.connect(hp); hp.connect(waterGain); waterGain.connect(master);
  src.start();
}
// 時間帯ごとの環境音
function startAmbience() {
  const loop = () => {
    if (state === 'play' || state === 'caught') {
      if (dayT < 0.30) {                      // 朝：すずめ
        const base = 2400 + Math.random()*900;
        for (let i=0;i<3+Math.floor(Math.random()*3);i++)
          tone(base*(0.9+Math.random()*0.35), 0.06, 'sine', 0.035, i*0.075);
      } else if (dayT < 0.68) {               // 昼：セミ
        const src = AC.createBufferSource();
        src.buffer = noiseBuf(0.55, (i,n)=>(Math.random()*2-1)*Math.sin(Math.PI*i/n)*(0.6+0.4*Math.sin(i*0.09)));
        const bp = AC.createBiquadFilter(); bp.type='bandpass';
        bp.frequency.value = 3300+Math.random()*900; bp.Q.value = 3.5;
        const g = AC.createGain(); g.gain.value = 0.04;
        src.connect(bp); bp.connect(g); g.connect(master); src.start();
      } else {                                // 夕：ヒグラシ＋たまにカラス
        if (Math.random() < 0.75) {
          for (let i=0;i<7;i++) tone(2100 - i*70, 0.11, 'triangle', 0.028, i*0.1);
        } else {
          noiseBurst(0.34, 900, 420, 0.05);
          tone(420, 0.3, 'sawtooth', 0.03, 0.02, 260);
        }
      }
    }
    setTimeout(loop, 620 + Math.random()*900);
  };
  loop();
}
const sfx = {
  swing: () => noiseBurst(0.16, 2800, 520, 0.16),
  step:  () => noiseBurst(0.07, 1100, 420, 0.035),
  grass: () => noiseBurst(0.11, 2200, 700, 0.05),
  catch: () => { tone(784,0.1,'triangle',0.12); tone(1046,0.1,'triangle',0.12,0.09); tone(1568,0.3,'triangle',0.1,0.18); },
  king:  () => { tone(784,0.1,'square',0.11); tone(1046,0.1,'square',0.11,0.1); tone(1318,0.1,'square',0.11,0.2); tone(2093,0.45,'square',0.1,0.3); },
  flee:  () => { noiseBurst(0.28, 2400, 900, 0.09); tone(700,0.22,'sine',0.05,0,420); },
  miss:  () => tone(150, 0.11, 'sawtooth', 0.06),
  notice:() => tone(1400, 0.07, 'sine', 0.05),
  bell:  () => { tone(1046,0.5,'sine',0.11); tone(1568,0.8,'sine',0.06,0.06); },
};

// ===== 虫の生成 =====
function spawnBug(key) {
  key = key || pick(SPAWN_TABLE);
  const info = BUGS[key];
  let x, y, tree = null;
  for (let a=0; a<24; a++) {
    if (info.perch) {
      tree = pick(TREES);
      const ang = Math.random()*Math.PI*2, rad = 0.35 + Math.random()*0.6;
      x = tree[0] + Math.cos(ang)*62*rad;
      y = tree[1] - 122 + Math.sin(ang)*52*rad;
    } else {
      const s = freeSpot();
      x = s.x; y = s.y - 30 - Math.random()*46;
    }
    x = clamp(x, 34, W-34);
    let crowded = false;
    for (const b of bugs) if (b.state !== 'gone' && dist(x,y,b.x,b.y) < 76) { crowded = true; break; }
    if (!crowded) break;
  }
  return {
    key, x, y, hx:x, hy:y, tree,
    perched: info.perch, aware: 0, state: 'calm', t: Math.random()*10,
    fleeAng: 0, mark: 0,
  };
}
const DAY_POOL = 18;        // その日その場所に「いる」虫の総数
let spawned = 0, poolNoticed = false;
function topUpBugs() {
  const target = 6;
  let alive = 0;
  for (const b of bugs) if (b.state !== 'gone') alive++;
  if (alive < target && spawned < DAY_POOL) { bugs.push(spawnBug()); spawned++; return; }
  if (alive === 0 && spawned >= DAY_POOL && !poolNoticed) {
    poolNoticed = true;
    toast = { txt: '……虫が いなくなっちゃった。おどかしすぎたかな', t: 0 };
  }
}

// ===== 入力 =====
const keys = {};
const MOVE = {
  ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0],
  ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1],
};
window.addEventListener('keydown', e => {
  if (MOVE[e.code] || ['Space','KeyZ','Enter','ShiftLeft','ShiftRight','KeyB'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  initAudio();
  if (e.code==='Space'||e.code==='KeyZ'||e.code==='Enter') {
    if (state==='title') { startDay(); return; }
    if (state==='caught') { state='play'; caughtView=null; return; }
    if (state==='basket') { state = basketReturn; return; }
    if (state==='play') swing();
  }
  if (e.code==='KeyB' && state==='play') { basketReturn = 'play'; state = 'basket'; }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k]=false; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); initAudio();
  if (state==='title') startDay();
  else if (state==='caught') { state='play'; caughtView=null; }
  else if (state==='basket') state = basketReturn;
  else if (state==='play') swing();
});

// ===== 進行 =====
function startDay() {
  player = { x: W/2, y: 420, face: -Math.PI/2, walk:0, moving:false, running:false, stepT:0 };
  bugs = []; parts = []; hints = [];
  spawned = 0; poolNoticed = false;
  for (let i=0;i<6;i++) { bugs.push(spawnBug()); spawned++; }
  net = { t:-1, dir:0 };
  dayT = 0; caught = []; escapedCount = 0; caughtView = null;
  toast = { txt:'8月1日　あさ　—　むしとりに いこう', t:0 };
  state = 'play';
}
function loadRec() {
  try {
    const s = localStorage.getItem('natsu_proto_v1');
    if (s) { const j = JSON.parse(s); record = j.record||{}; seen = j.seen||{}; }
  } catch(e) {}
}
function saveRec() {
  try { localStorage.setItem('natsu_proto_v1', JSON.stringify({record, seen})); } catch(e) {}
}

// ===== 網 =====
const NET_REACH = 46, NET_R = 36;
const RUN_NOTICE = 1.9;   // 走っているときの警戒半径の倍率
const CALM_RATE  = 0.5;   // 毎秒これだけ警戒がさめる
function swing() {
  if (net.t >= 0 && net.t < 0.42) return;
  net.t = 0; net.dir = player.face;
  sfx.swing();
  const cx = player.x + Math.cos(net.dir)*NET_REACH;
  const cy = player.y - 26 + Math.sin(net.dir)*NET_REACH;
  let hit = null;
  for (const b of bugs) {
    if (b.state === 'gone') continue;
    if (dist(cx, cy, b.x, b.y) < NET_R + 12) { hit = b; break; }
  }
  if (hit) { doCatch(hit); return; }
  sfx.miss();
  // 空振り＝まわりの虫に気づかれて、逃げられる
  for (const b of bugs) {
    if (b.state === 'gone') continue;
    if (dist(player.x, player.y-26, b.x, b.y) < 190) startFlee(b, true);
  }
}
function startFlee(b, byMiss) {
  if (b.state === 'flee' || b.state === 'gone') return;
  b.state = 'flee';
  b.aware = 1;
  b.fleeAng = Math.atan2(b.y - (player.y-26), b.x - player.x) + (Math.random()-0.5)*0.5;
  escapedCount++;
  sfx.flee();
  hints.push({ x:b.x, y:b.y-26, txt: byMiss ? 'からぶり！' : 'にげられた！', t:0, col:'#ff9a8c' });
}
function doCatch(b) {
  const info = BUGS[b.key];
  b.state = 'gone';
  // 大きさは毎回ゆらぐ。大物はまれ。
  const r = Math.random();
  const ratio = 0.80 + Math.pow(r, 2.1) * 0.62;
  const mm = Math.round(info.mm * ratio * 10) / 10;
  const rank = sizeRank(ratio);
  const first = !seen[b.key];
  const best = record[b.key] || 0;
  const isBest = mm > best;
  seen[b.key] = true;
  if (isBest) record[b.key] = mm;
  saveRec();
  caught.push({ key:b.key, mm, ratio, rankT:rank.t });
  caughtView = { key:b.key, mm, ratio, rank, first, isBest, prevBest:best, t:0 };
  state = 'caught';
  if (rank.king || first) sfx.king(); else sfx.catch();
  shake = rank.king ? 7 : 4;
  for (let i=0;i<20;i++) {
    const a = Math.random()*Math.PI*2, s = 50+Math.random()*140;
    parts.push({ x:b.x, y:b.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-50, t:0, life:0.6,
      col: rank.king ? '#ffd166' : '#fff6c8', r:2+Math.random()*2 });
  }
  setTimeout(()=>{ const i=bugs.indexOf(b); if (i>=0) bugs.splice(i,1); topUpBugs(); }, 400);
}

// ===== 更新 =====
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake = Math.max(0, shake - dt*22);
  for (let i=parts.length-1;i>=0;i--) {
    const p = parts[i]; p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 280*dt;
    if (p.t > p.life) parts.splice(i,1);
  }
  for (let i=hints.length-1;i>=0;i--) {
    const h = hints[i]; h.t += dt; h.y -= dt*24;
    if (h.t > 1.2) hints.splice(i,1);
  }
  if (toast) { toast.t += dt; if (toast.t > 3.2) toast = null; }
  if (state !== 'play') return;

  dayT += dt / DAY_SEC;
  if (dayT >= 1) { dayT = 1; basketReturn = 'title'; state = 'basket'; sfx.bell(); return; }
  if (net.t >= 0) { net.t += dt; if (net.t > 0.48) net.t = -1; }

  // --- 移動 ---
  let ax=0, ay=0;
  for (const c in MOVE) if (keys[c]) { ax += MOVE[c][0]; ay += MOVE[c][1]; }
  if (ax||ay) { const m = Math.hypot(ax,ay); ax/=m; ay/=m; }
  player.running = !!(keys.ShiftLeft || keys.ShiftRight);
  player.moving = !!(ax||ay);
  const SPD = player.running ? 236 : 108;
  if (player.moving) {
    player.face = Math.atan2(ay, ax);
    player.walk += dt * (player.running ? 15 : 8);
    player.stepT += dt;
    if (player.stepT > (player.running ? 0.20 : 0.38)) {
      player.stepT = 0;
      player.running ? sfx.step() : sfx.grass();
    }
    const nx = player.x + ax*SPD*dt, ny = player.y + ay*SPD*dt;
    if (walkable(nx, player.y)) player.x = nx;
    if (walkable(player.x, ny)) player.y = ny;
  } else player.walk = 0;

  // 小川の音は距離で
  if (waterGain) {
    const d = clamp((STREAM_Y - player.y) / 260, 0, 1);
    waterGain.gain.value = 0.16 * (1 - d) * (1 - d) + 0.012;
  }

  // --- 虫：警戒ゲージ ---
  for (const b of bugs) {
    if (b.state === 'gone') continue;
    const info = BUGS[b.key];
    b.t += dt;

    if (b.state === 'flee') {
      b.x += Math.cos(b.fleeAng) * info.spd * 1.5 * dt;
      b.y += Math.sin(b.fleeAng) * info.spd * 1.5 * dt - 26*dt;
      if (b.x < -60 || b.x > W+60 || b.y < -60) { b.state = 'gone'; setTimeout(topUpBugs, 1400); }
      continue;
    }

    // 走っていると、ずっと遠くから気づかれる
    const d = dist(player.x, player.y - 26, b.x, b.y);
    const nr = info.notice * (player.running ? RUN_NOTICE : 1);
    let rate = 0;
    if (d < nr) {
      // 半径のふちでも「なんか来た」ぐらいには気づく
      const near = 0.35 + 0.65 * (1 - d / nr);
      const move = player.running ? 3.4 : (player.moving ? 1.15 : 0.10);
      rate = near * move * info.wary;
    }
    const was = b.aware;
    // 差し引き。じっとしていれば さめていく
    b.aware = clamp(b.aware + (rate - CALM_RATE) * dt, 0, 1);
    if (was < 0.36 && b.aware >= 0.36) sfx.notice();
    if (b.aware >= 1) { startFlee(b, false); continue; }

    // 動き
    if (b.perched) {
      const j = b.aware > 0.6 ? (Math.random()-0.5) * b.aware * 3 : 0;
      b.x = lerp(b.x, b.hx + j, Math.min(1, dt*5));
      b.y = lerp(b.y, b.hy + Math.sin(b.t*2)*1.6 + j, Math.min(1, dt*5));
    } else {
      const ang = Math.sin(b.t*1.25 + b.hx*0.01)*1.6 + Math.sin(b.t*0.47)*1.2;
      const sp = info.spd * 0.36 * (1 + b.aware*0.6);
      let nx = b.x + Math.cos(ang)*sp*dt + Math.sin(b.t*4)*info.wob*12*dt;
      let ny = b.y + Math.sin(ang)*sp*dt + Math.cos(b.t*3.1)*info.wob*12*dt;
      if (nx < 40 || nx > W-40) { nx = b.x; b.t += 0.9; }
      if (ny < HORIZON+6 || ny > STREAM_Y-20) { ny = b.y; b.t += 0.9; }
      b.x = nx; b.y = ny;
    }
  }
  topUpBugs();
}

// ===== 描画ヘルパ =====
function drawEnv(key, x, y, s) {
  const r = ENV[key];
  ctx.drawImage(imgEnv, r[0], r[1], r[2], r[3], Math.round(x), Math.round(y), r[2]*(s||2), r[3]*(s||2));
}
function drawChar(ci, x, y, s, flip) {
  const cx = (ci%8)*16, cy = Math.floor(ci/8)*16, w = 16*s;
  ctx.save();
  if (flip) {
    ctx.translate(Math.round(x), Math.round(y)); ctx.scale(-1,1);
    ctx.drawImage(imgChars, cx, cy, 16, 16, -w/2, -w, w, w);
  } else {
    ctx.drawImage(imgChars, cx, cy, 16, 16, Math.round(x-w/2), Math.round(y-w), w, w);
  }
  ctx.restore();
}
function drawBug(key, x, y, s, frame) {
  const art = BUG_ART[key];
  if (!art) return;
  ctx.save(); ctx.translate(Math.round(x), Math.round(y));
  for (const r of art) {
    let [rx,ry,rw,rh,col,wing] = r;
    let px = (rx-8)*s, pw = rw*s;
    if (wing && frame) { px *= 0.62; pw *= 0.62; }
    ctx.fillStyle = col;
    ctx.fillRect(px, (ry-8)*s, Math.max(s*0.6, pw), rh*s);
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function text(t,x,y,size,col,align,weight) {
  ctx.fillStyle = col;
  ctx.font = (weight||'bold')+' '+size+'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(t,x,y);
}

// ===== 空の色（時計は出さない）=====
const SKY = [
  { t:0.00, a:'#8fd0f0', b:'#e6f2e2', sun:'#fff4c8' },  // 朝
  { t:0.35, a:'#4fa8e8', b:'#eaf6e2', sun:'#ffffff' },  // 昼
  { t:0.72, a:'#7fa0d8', b:'#ffd9a8', sun:'#ffd08a' },  // 西日
  { t:1.00, a:'#3f5a9a', b:'#ff9a5a', sun:'#ff8a4a' },  // 夕
];
function mixHex(h1, h2, t) {
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(h1), [r2,g2,b2]=p(h2);
  return 'rgb('+Math.round(lerp(r1,r2,t))+','+Math.round(lerp(g1,g2,t))+','+Math.round(lerp(b1,b2,t))+')';
}
function skyNow() {
  let i = 0;
  while (i < SKY.length-2 && dayT > SKY[i+1].t) i++;
  const t = clamp((dayT - SKY[i].t) / (SKY[i+1].t - SKY[i].t), 0, 1);
  return {
    a: mixHex(SKY[i].a, SKY[i+1].a, t),
    b: mixHex(SKY[i].b, SKY[i+1].b, t),
    sun: mixHex(SKY[i].sun, SKY[i+1].sun, t),
  };
}

// ===== 情景 =====
function drawScene() {
  const sk = skyNow();
  const g = ctx.createLinearGradient(0,0,0,HORIZON+30);
  g.addColorStop(0, sk.a); g.addColorStop(1, sk.b);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HORIZON+30);

  // 太陽（東から西へ）
  const sx = 120 + dayT*720, sy = 130 - Math.sin(dayT*Math.PI)*66;
  ctx.fillStyle = sk.sun; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // 入道雲
  ctx.fillStyle = dayT>0.72 ? 'rgba(255,214,186,0.9)' : 'rgba(255,255,255,0.9)';
  const puffs = [[640,96,1.0],[250,74,0.72],[830,120,0.6]];
  for (const [cx0,cy,s] of puffs) {
    const cx = cx0 + Math.sin(elapsed*0.05 + cy)*8;
    for (const [ox,oy,r] of [[-34,12,26],[0,-6,36],[30,10,24],[58,16,18]]) {
      ctx.beginPath(); ctx.arc(cx+ox*s, cy+oy*s, r*s, 0, Math.PI*2); ctx.fill();
    }
  }
  // 遠くの山
  ctx.fillStyle = '#6d90a0';
  ctx.beginPath(); ctx.moveTo(60,HORIZON-4); ctx.quadraticCurveTo(300,HORIZON-84,560,HORIZON-4); ctx.closePath(); ctx.fill();

  ctx.beginPath(); ctx.moveTo(460,HORIZON-4); ctx.quadraticCurveTo(720,HORIZON-64,980,HORIZON-4); ctx.closePath(); ctx.fill();
  // 中景の木立
  ctx.fillStyle = '#3c5c32'; ctx.fillRect(0, HORIZON-26, W, 30);
  for (let i=0;i<34;i++) {

    ctx.quadraticCurveTo(x, HORIZON-22-26*s, x+12*s, HORIZON-22);
    ctx.closePath(); ctx.fill();
  }

  // 地面
  for (let y=HORIZON; y<STREAM_Y+TILE; y+=TILE) {
    for (let x=0; x<W; x+=TILE) {
      const v = ((x*7+y*13)%97)/97;
      drawEnv(v<0.10?'gf1':(v<0.19?'gf2':'grass'), x, y, 2);
    }
  }
  // 小川
  for (let y=STREAM_Y; y<H; y+=TILE) {
    for (let x=0; x<W; x+=TILE) drawEnv('water', x, y, 2);
  }
  ctx.fillStyle = 'rgba(120,96,58,0.5)'; ctx.fillRect(0, STREAM_Y-6, W, 8);
  for (let x=0;x<W;x+=TILE) {
    for (let y=STREAM_Y;y<H;y+=TILE) {
      const ph = Math.sin(elapsed*2.4 + x*0.06 + y*0.11);
      if (ph > 0.66) {
        ctx.fillStyle = 'rgba(255,255,255,'+((ph-0.66)*1.9).toFixed(2)+')';
        ctx.fillRect(x+6, y+10+((x*7+y*3)%12), 12, 2);
      }
    }
  }

  // 前後ソート
  const items = [];
  for (const [k,x,y] of DECOR) items.push({y, k:'decor', o:{k,x,y}});
  for (const [x,y] of TREES) items.push({y:y+2, k:'tree', o:{x,y}});
  items.push({y:player.y, k:'player', o:player});
  items.sort((a,b)=>a.y-b.y);
  for (const it of items) {
    const o = it.o;
    if (it.k === 'decor') {
      const r = ENV[o.k]; drawEnv(o.k, o.x - r[2], o.y - r[3]*2, 2);
    } else if (it.k === 'tree') {
      const r = ENV['tree'];
      const hide = Math.abs(player.x-o.x)<78 && player.y>o.y-200 && player.y<o.y+14;
      if (hide) ctx.globalAlpha = 0.42;
      ctx.drawImage(imgEnv, r[0],r[1],r[2],r[3], Math.round(o.x-r[2]), Math.round(o.y-r[3]*2+12), r[2]*2, r[3]*2);

    } else {
      const s = depthScale(o.y);

      ctx.beginPath(); ctx.ellipse(o.x, o.y, 8*s, 3*s, 0,0,Math.PI*2); ctx.fill();
      const bob = o.moving ? Math.abs(Math.sin(o.walk))*(o.running?-5:-3) : 0;
      drawChar(CI_CIRNO, o.x, o.y+bob, s, Math.cos(o.face)<-0.35 && o.moving);
      drawNet(o.x, o.y+bob);
    }
  }

  // 虫（最前面）＋ 警戒マーク
  for (const b of bugs) {
    if (b.state === 'gone') continue;
    const fr = Math.floor(elapsed*14)%2===0;
    const alpha = b.state==='flee' ? 0.85 : 1;
    ctx.globalAlpha = alpha;
    if (!b.perched) {

    drawBug(b.key, b.x, b.y, 1.85, fr);
    ctx.globalAlpha = 1;
    if (b.state !== 'flee' && b.aware > 0.34) drawAware(b);
  }

  // 時間帯の色味
  if (dayT > 0.7) {
    ctx.fillStyle = 'rgba(255,132,62,'+((dayT-0.7)/0.3*0.22).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0,1-p.t/p.life);
    ctx.fillStyle = p.col; ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2);
  }
  ctx.globalAlpha = 1;
  for (const h of hints) {
    ctx.globalAlpha = Math.max(0, 1-h.t/1.2);
    text(h.txt, h.x, h.y, 15, 'rgba(0,0,0,0.6)', 'center');
    text(h.txt, h.x, h.y-1.5, 15, h.col, 'center');
  }
  ctx.globalAlpha = 1;
}

function drawAware(b) {
  const y = b.y - 34;
  const hot = b.aware > 0.72;

function drawNet(px, py) {
  if (net.t < 0) return;
  const prog = clamp(net.t/0.34, 0, 1);
  const ang = net.dir + (-0.95 + prog*1.9);
  const reach = NET_REACH*(0.55+prog*0.7);
  const nx = px + Math.cos(ang)*reach, ny = py - 26 + Math.sin(ang)*reach;
  const R = NET_R*0.62;
  ctx.save(); ctx.globalAlpha = 0.9;
  ctx.strokeStyle = '#c8a068'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px, py-30); ctx.lineTo(nx, ny); ctx.stroke();
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(240,250,255,0.28)';
  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  for (let i=-1;i<=1;i++) {
    ctx.beginPath(); ctx.moveTo(nx+i*R*0.55, ny-R); ctx.lineTo(nx+i*R*0.55, ny+R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(nx-R, ny+i*R*0.55); ctx.lineTo(nx+R, ny+i*R*0.55); ctx.stroke();
  }
  ctx.globalAlpha = 0.2*(1-prog);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(px, py-26, reach, net.dir-0.95, ang); ctx.stroke();
  ctx.restore();
}

function drawBasket() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3a4a30'); g.addColorStop(1,'#20281c');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

       W/2, 80, 15, '#cfe8b8', 'center');

  const bx = 76, by = 100, bw = W-152, bh = 306;
  ctx.fillStyle = 'rgba(196,164,104,0.14)';
  roundRect(bx,by,bw,bh,14); ctx.fill();
  ctx.strokeStyle = 'rgba(214,186,126,0.5)'; ctx.lineWidth = 3;
  roundRect(bx,by,bw,bh,14); ctx.stroke();
  ctx.save();
  ctx.beginPath(); roundRect(bx,by,bw,bh,14); ctx.clip();
  ctx.strokeStyle = 'rgba(214,186,126,0.14)'; ctx.lineWidth = 2;
  for (let x=bx; x<bx+bw; x+=26) { ctx.beginPath(); ctx.moveTo(x,by); ctx.lineTo(x,by+bh); ctx.stroke(); }
  for (let y=by; y<by+bh; y+=26) { ctx.beginPath(); ctx.moveTo(bx,y); ctx.lineTo(bx+bw,y); ctx.stroke(); }

  if (!caught.length) {
    text('からっぽ。……また あした。', W/2, by+bh/2, 20, '#8a9a7a', 'center');
  } else {
    // 相対的な大きさは保ったまま、全部が収まるまで縮める
    const sorted = caught.slice().sort((a,b)=>b.mm-a.mm);
    const PADX = 26, GAP = 22, LABEL = 15;
    function layout(K) {
      const rows = [];
      let row = [], rowW = 0, rowH = 0, totalH = 0;
      for (const c of sorted) {
        const w = c.mm * K;
        if (rowW + w > bw - PADX*2 && row.length) {
          rows.push({row, rowH}); totalH += rowH + LABEL + GAP;
          row = []; rowW = 0; rowH = 0;
        }
        row.push({ c, w }); rowW += w + GAP; rowH = Math.max(rowH, w*0.95);
      }
      if (row.length) { rows.push({row, rowH}); totalH += rowH + LABEL + GAP; }
      return { rows, totalH };
    }
    let K = 1.7, lo = null;
    for (let i=0; i<14; i++) {
      lo = layout(K);
      if (lo.totalH <= bh - 34) break;
      K *= 0.87;
    }
    let y = by + Math.max(20, (bh - lo.totalH) / 2 + 8);
    for (const { row, rowH } of lo.rows) {
      let x = bx + PADX + (bw - PADX*2 - (row.reduce((a,r)=>a+r.w+GAP,0) - GAP)) / 2;
      for (const { c, w } of row) {
        const cx = x + w/2, cy = y + rowH/2;
        drawBug(c.key, cx, cy, w/16, Math.floor(elapsed*6 + x)%2===0);
        text(c.mm.toFixed(1)+'mm', cx, y + rowH + 12, 10, '#cfe8b8', 'center');
        x += w + GAP;
      }
      y += rowH + LABEL + GAP;
    }
  }
  ctx.restore();

  // じこベスト
  text('じこベスト', bx, 438, 14, '#ffe066');
  let zx = bx + 6;
  for (const k of BUG_KEYS) {
    const best = record[k] || 0;
    ctx.globalAlpha = best ? 1 : 0.22;
    drawBug(k, zx+24, 476, 1.3, false);
    ctx.globalAlpha = 1;
    text(best ? BUGS[k].jp : '？？？', zx+24, 500, 10, best?'#e8f0e0':'#7a8a70', 'center');
    if (best) text(best.toFixed(1)+'mm', zx+24, 514, 10, '#ffd166', 'center');
    zx += 104;
  }

  const bp = Math.sin(elapsed*3)*2;
  text(basketReturn === 'play' ? 'Z / クリック で つづける ▶' : 'Z / クリック で タイトルへ ▶', W-30, H-22+bp, 16, '#ffffff', 'right');
}

let last = performance.now();
function loop(now) {
  let dt = (now-last)/1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (assetsReady < 2) {
    elapsed += dt;
    ctx.fillStyle='#2e4a2a'; ctx.fillRect(0,0,W,H);
    text('よみこみ中……', W/2, H/2, 20, '#cfe8b8', 'center');
    requestAnimationFrame(loop); return;
  }
  update(dt);
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  if (state==='title') drawTitle();
  else if (state==='play') { drawScene(); drawHud(); }
  else if (state==='caught') drawCaught(dt);
  else if (state==='basket') drawBasket();
  ctx.restore();
  requestAnimationFrame(loop);
}

  window._recordCtrl = {
    start: () => { initAudio(); startDay(); },
    stop: () => {},
    skipToEnd: () => { dayT = 0.999; },
    dbg: () => ({
      state, dayT, caught: caught.length, escaped: escapedCount, left: DAY_POOL - spawned,
      px: player ? player.x : 0, py: player ? player.y : 0,
      running: player ? player.running : false,
      bugs: bugs.filter(b=>b.state!=='gone').map(b=>({k:b.key,x:b.x,y:b.y,aware:+b.aware.toFixed(2),st:b.state})),
      view: caughtView ? { key:caughtView.key, mm:caughtView.mm, rank:caughtView.rank.t, first:caughtView.first } : null,
    }),
  };
}

})();
</script>
