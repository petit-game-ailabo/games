const W = 960, H = 540;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  // 等倍 or 2倍だけ使ってドットをにじませない
  const raw = Math.min(window.innerWidth / W, window.innerHeight / H);
  const s = raw >= 2 ? 2 : (raw >= 1 ? 1 : raw);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);
ctx.imageSmoothingEnabled = false;

// ===== ユーティリティ =====
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(20260726);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

// ===== オーディオ =====
let AC = null, masterGain = null, audioOn = false, bgmStep = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
    audioOn = true; startBgm(); startCicadas();
  } catch (e) { audioOn = false; }
}
function tone(freq, dur, type, vol, delay) {
  if (!audioOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, f0, f1, vol) {
  if (!audioOn) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(f0, AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + dur);
  bp.Q.value = 1.2;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start();
}
function startCicadas() {
  if (!audioOn) return;
  const loop = () => {
    if (state === 'play') {
      const n = Math.floor(AC.sampleRate * 0.5);
      const buf = AC.createBuffer(1, n, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n) * (0.6 + 0.4 * Math.sin(i * 0.09));
      }
      const src = AC.createBufferSource(); src.buffer = buf;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 3400 + Math.random() * 900; bp.Q.value = 3.5;
      const g = AC.createGain();
      g.gain.value = (cur === 'take' || cur === 'forest') ? 0.05 : 0.033;
      src.connect(bp); bp.connect(g); g.connect(masterGain);
      src.start();
    }
    setTimeout(loop, 700 + Math.random() * 900);
  };
  loop();
}
const SCALE = [0, 2, 4, 7, 9];
function startBgm() {
  if (!audioOn) return;
  const base = 261.63;
  const loop = () => {
    if (state !== 'title') {
      const beat = bgmStep % 8;
      if (beat === 0 || beat === 3 || beat === 5) {
        const deg = SCALE[Math.floor(Math.random() * SCALE.length)];
        tone(base * Math.pow(2, deg / 12) * (Math.random() < 0.35 ? 2 : 1), 0.7, 'triangle', 0.05);
      }
      if (beat === 0) tone(base / 2, 1.4, 'sine', 0.07);
      if (beat === 4) tone(base / 2 * Math.pow(2, 7 / 12), 1.4, 'sine', 0.055);
      bgmStep++;
    }
    setTimeout(loop, 340);
  };
  loop();
}

// ===== エリアの地面を作る =====
function buildField(id) {
  if (fieldCache[id]) return fieldCache[id];
  const A = AREAS[id];
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = seed * 31 + id.charCodeAt(i);
  const r = mulberry32(seed + 777);
  const g = [];
  for (let ty = 0; ty < GT; ty++) {
    g.push([]);
    for (let tx = 0; tx < GW; tx++) {
      const v = r();
      g[ty].push(v < 0.10 ? 'gf1' : (v < 0.18 ? 'gf2' : 'grass'));
    }
  }
  for (const [px, py, pw, ph] of (A.paths || [])) {
    for (let ty = py; ty < py + ph && ty < GT; ty++) {
      for (let tx = px; tx < px + pw && tx < GW; tx++) {
        if (tx >= 0 && ty >= 0) g[ty][tx] = 'dirt';
      }
    }
  }
  if (A.kind === 'lake') {
    // 画面の下半分が湖。岸はうねらせる
    for (let tx = 0; tx < GW; tx++) {
      const top = 6 + Math.round(Math.sin(tx * 0.34) * 1.7 + Math.sin(tx * 0.11) * 1.5 + r() * 0.6);
      for (let ty = top; ty < GT; ty++) g[ty][tx] = 'water';
      if (top - 1 >= 0) g[top - 1][tx] = 'dirt';
    }
    // 桟橋の上は歩ける
    for (let tx = 13; tx <= 16; tx++) for (let ty = 5; ty < GT; ty++) g[ty][tx] = 'dirt';
  }
  if (A.kind === 'paddy') {
    for (const band of [[0, 2], [10, 12]]) {
      for (let ty = band[0]; ty <= band[1] && ty < GT; ty++) {
        for (let tx = 0; tx < GW; tx++) g[ty][tx] = 'water';
      }
    }
  }
  const bamboo = [];
  if (A.kind === 'bamboo') {
    for (let i = 0; i < 26; i++) {
      const bx = 20 + r() * (W - 40);
      if (bx > 250 && bx < 420) continue;     // 小径をあける
      bamboo.push({ x: bx, y: HORIZON + 26 + r() * (H - HORIZON - 56), h: 210 + r() * 180, sw: 5 + r() * 4 });
    }
    bamboo.sort((a, b) => a.y - b.y);
  }
  const hills = [];
  for (let i = 0; i < 3; i++) hills.push({ x: r() * W, w: 220 + r() * 320, h: 40 + r() * 55 });
  const farTrees = [];
  for (let i = 0; i < 30; i++) farTrees.push({ x: r() * (W + 40) - 20, s: 0.6 + r() * 0.7 });
  const clouds = [];
  for (let i = 0; i < 4; i++) clouds.push({ x: r() * W, y: 24 + r() * 60, s: 0.7 + r() * 0.7 });

  fieldCache[id] = { g, bamboo, hills, farTrees, clouds };
  return fieldCache[id];
}

function tileAt(px, py) {
  const f = buildField(cur);
  const tx = Math.floor(px / TILE), ty = Math.floor((py - HORIZON) / TILE);
  if (ty < 0 || ty >= GT || tx < 0 || tx >= GW) return 'grass';
  return f.g[ty][tx];
}
function solidObjects() {
  const A = AREAS[cur], out = [];
  for (const [x, y] of A.trees) out.push({ x, y, r: 15 });
  for (const [k, x, y] of A.decor) if (k === 'rock') out.push({ x, y, r: 13 });
  for (const [k, x, y] of A.props) {
    if (k === 'saisen') out.push({ x, y, r: 30 });
    if (k === 'lantern') out.push({ x, y, r: 12 });
    if (k === 'scarecrow') out.push({ x, y, r: 10 });
  }
  if (A.kind === 'bamboo') for (const b of buildField(cur).bamboo) out.push({ x: b.x, y: b.y, r: 7 });
  return out;
}
let solidsCache = null, solidsFor = null;
function solids() {
  if (solidsFor !== cur) { solidsCache = solidObjects(); solidsFor = cur; }
  return solidsCache;
}
function walkable(px, py) {
  if (px < PAD_X || px > W - PAD_X) return false;
  if (py < HORIZON + PAD_TOP || py > H - PAD_BOT) return false;
  if (tileAt(px, py) === 'water') return false;
  for (const s of solids()) if (dist(px, py, s.x, s.y - 3) < s.r) return false;
  return true;
}
function nearWater(px, py) {
  for (let a = 0; a < 12; a++) {
    const ang = a / 12 * Math.PI * 2;
    for (const r of [40, 74]) {
      if (tileAt(px + Math.cos(ang) * r, py + Math.sin(ang) * r) === 'water') return true;
    }
  }
  return false;
}

// ===== 出現 =====
function freeSpot() {
  for (let i = 0; i < 300; i++) {
    const x = PAD_X + 10 + rnd() * (W - PAD_X * 2 - 20);
    const y = HORIZON + PAD_TOP + rnd() * (H - HORIZON - PAD_TOP - PAD_BOT);
    if (walkable(x, y)) return { x, y };
  }
  return { x: W / 2, y: H - 90 };
}
const BUG_CEIL = HORIZON + 12;      // これより上には行かせない（空に浮いて見える）
function tooCrowded(x, y) {
  for (const b of bugs) if (!b.dead && dist(x, y, b.x, b.y) < 44) return true;
  return false;
}
function spawnBug(key) {
  const A = AREAS[cur];
  if (!key) {
    const pool = A.bugs.filter(k => k !== 'hotaru' || day === DAY_COUNT - 1);
    key = pick(pool.length ? pool : A.bugs);
  }
  const info = BUGS[key];
  let x = W / 2, y = H - 120, tree = null;
  // かたまらないよう何度か引き直す
  for (let attempt = 0; attempt < 24; attempt++) {
    if (info.perch && A.trees.length) {
      tree = A.trees[(perchTurn++) % A.trees.length];
      const a = rnd() * Math.PI * 2, rad = 0.35 + rnd() * 0.6;
      x = tree[0] + Math.cos(a) * 62 * rad;
      y = tree[1] - 120 + Math.sin(a) * 52 * rad;
    } else if (key === 'gengoro' || key === 'hotaru') {
      let ok = null;
      for (let i = 0; i < 120; i++) { const c = freeSpot(); if (nearWater(c.x, c.y)) { ok = c; break; } }
      const c = ok || freeSpot(); x = c.x; y = c.y - 20;
    } else {
      const c = freeSpot(); x = c.x; y = c.y - 26 - rnd() * 40;
    }
    x = clamp(x, 34, W - 34);
    if (!(info.perch && tree)) y = Math.max(BUG_CEIL, y);
    if (!tooCrowded(x, y)) break;
  }
  return { key, x, y, hx: x, hy: y, t: rnd() * 10, flee: 0, perched: !!(info.perch && tree), tree, dead: false };
}
let perchTurn = 0;
function refillArea() {
  bugs = [];
  const n = 7 + day;
  for (let i = 0; i < n; i++) bugs.push(spawnBug());
  npcs = [];
  for (const rec of dayNpcs) {
    if (rec.area !== cur || rec.met) continue;
    const s = freeSpot();
    npcs.push({ rec, ci: rec.ci, x: s.x, y: s.y, tx: s.x, ty: s.y, t: rnd() * 3, talk: 0, bob: rnd() * 6 });
  }
}
function assignNpcs() {
  const idx = [];
  for (let i = 1; i < CHAR_NAMES.length; i++) idx.push(i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  dayNpcs = [];
  let k = 0;
  for (const aid of AREA_IDS) for (let n = 0; n < 2; n++) dayNpcs.push({ ci: idx[k++], area: aid, met: false });
}

function startDay() {
  rnd = mulberry32(4700 + day * 977);
  cur = 'shrine'; solidsFor = null;
  player = { x: 448, y: H - 120, face: Math.PI / 2, walk: 0, moving: false, stepT: 0 };

function nextFromDiary() {

  day++;

    state = 'result';
    if (score > zukan.best) zukan.best = score;
    saveZukan();

}
function loadZukan() {
  try { const s = localStorage.getItem('gensokyo_natsu_pc_v1'); if (s) zukan = JSON.parse(s); } catch (e) {}
  if (!zukan.bugs) zukan.bugs = {};

const keys = {};
const MOVE_KEYS = {
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
};
window.addEventListener('keydown', e => {
  if (MOVE_KEYS[e.code] || ['Space', 'KeyZ', 'KeyF', 'Enter', 'KeyX'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  initAudio();
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ') {
    if (state === 'title') { startGame(); return; }
    if (state === 'diary') { nextFromDiary(); return; }
    if (state === 'result') { startGame(); return; }
    if (fishing) { resolveFishing(); return; }
    if (state === 'play' && !trans) swing();
    return;
  }
  if (e.code === 'KeyF' || e.code === 'KeyX') {
    if (state === 'play' && !fishing && !trans && nearWater(player.x, player.y)) beginFishing();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); initAudio();
  if (state === 'title') startGame();
  else if (state === 'diary') nextFromDiary();
  else if (state === 'result') startGame();
  else if (fishing) resolveFishing();
  else if (state === 'play' && !trans) swing();
});

// ===== アクション =====
function netRadius() { return net.big > 0 ? 48 : 34; }
function netReach() { return 44; }

function swing() {
  if (net.t >= 0 && net.t < 0.34) return;
  net.t = 0; net.dir = player.face;
  sfx.swing();
  const cx = player.x + Math.cos(net.dir) * netReach();
  const cy = player.y - 22 + Math.sin(net.dir) * netReach();
  const R = netRadius();
  let hit = null;
  for (const b of bugs) {
    if (b.dead) continue;
    if (dist(cx, cy, b.x, b.y) < R + 10) { hit = b; break; }
  }
  if (hit) catchBug(hit);
  else {
    sfx.miss();
    for (const b of bugs) if (!b.dead && dist(player.x, player.y, b.x, b.y) < 155) b.flee = 1.4;
  }
}
function catchBug(b) {
  const info = BUGS[b.key];
  b.dead = true;
  dayCatch[b.key] = (dayCatch[b.key] || 0) + 1;
  totalCatch[b.key] = (totalCatch[b.key] || 0) + 1;
  zukan.bugs[b.key] = (zukan.bugs[b.key] || 0) + 1;
  dayScore += info.pt; score += info.pt;
  if (info.pt >= 50) sfx.rare(); else sfx.catch();
  popups.push({ x: b.x, y: b.y, txt: info.jp + ' +' + info.pt, t: 0, col: info.pt >= 50 ? '#ffe066' : '#ffffff' });
  for (let i = 0; i < 16; i++) {
    const a = rnd() * Math.PI * 2, s = 40 + rnd() * 120;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.55,
      col: info.pt >= 50 ? '#ffe066' : '#fff6c8', r: 2 + rnd() * 2 });
  }
  shake = Math.min(6, 3 + info.pt / 24);
  setTimeout(() => { const i = bugs.indexOf(b); if (i >= 0) bugs[i] = spawnBug(); }, 1000);
}
function beginFishing() {
  sfx.splash();
  const zw = 52 + rnd() * 30;
  fishing = { cur: 0, dir: 1, spd: 320 + day * 50, zs: 40 + rnd() * (380 - zw - 80), zw, res: null, t: 0 };
}
function resolveFishing() {
  if (!fishing || fishing.res) return;
  const f = fishing;
  if (f.cur >= f.zs && f.cur <= f.zs + f.zw) {
    const acc = 1 - Math.abs(f.cur - (f.zs + f.zw / 2)) / (f.zw / 2);
    const pool = [];
    for (const fi of FISH) {
      const w = fi.w + (fi.w < 0.6 ? acc * 0.9 : 0);
      for (let i = 0; i < Math.max(1, Math.round(w * 10)); i++) pool.push(fi);
    }
    const got = pool[Math.floor(rnd() * pool.length)];
    f.res = { ok: true, fish: got };
    dayFish[got.jp] = (dayFish[got.jp] || 0) + 1;
    totalFish[got.jp] = (totalFish[got.jp] || 0) + 1;
    dayScore += got.pt; score += got.pt;
    sfx.fishOk();
  } else { f.res = { ok: false }; sfx.miss(); }
  setTimeout(() => { fishing = null; }, 1300);
}
function meetNpc(n) {
  n.rec.met = true; n.talk = 3.4;
  metChars[n.ci] = true; zukan.chars[n.ci] = true;
  dayMet.push(n.ci);
  score += 40; dayScore += 40;
  sfx.meet();
  const bonus = CHAR_LINES[n.ci] ? CHAR_LINES[n.ci][1] : 'score';
  if (bonus === 'time') { timeLeft += 8; n.bonusTxt = 'のこり時間 +8びょう'; }
  else if (bonus === 'net') { net.big = 14; n.bonusTxt = 'あみが 大きくなった！'; }
  else if (bonus === 'radar') { radarT = 14; n.bonusTxt = '虫の いばしょが わかる！'; }
  else { score += 60; dayScore += 60; n.bonusTxt = 'おみやげ +60てん'; }
}

function goArea(dir) {
  const to = AREAS[cur].nb[dir];
  if (!to) return;
  trans = { t: 0, to, dir, done: false };
  sfx.step();
}
function finishTrans() {
  const dir = trans.dir;
  cur = trans.to; solidsFor = null;
  if (dir === 'right') player.x = PAD_X + 16;
  if (dir === 'left') player.x = W - PAD_X - 16;
  if (dir === 'down') player.y = HORIZON + PAD_TOP + 12;
  if (dir === 'up') player.y = H - PAD_BOT - 12;
  // 入った先が歩けない場所なら空きへ押し出す
  if (!walkable(player.x, player.y)) {
    let best = null, bestD = 1e9;
    for (let i = 0; i < 400; i++) {
      const s = freeSpot();
      const d = dist(s.x, s.y, player.x, player.y);
      if (d < bestD) { bestD = d; best = s; }
      if (bestD < 60) break;
    }
    if (best) { player.x = best.x; player.y = best.y; }
  }
  refillArea();
  toast = { txt: AREAS[cur].name, t: 0 };
}

// ===== 更新 =====
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
  if (toast) { toast.t += dt; if (toast.t > 2.4) toast = null; }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.t += dt; p.y -= dt * 26;
    if (p.t > 1.1) popups.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  if (state !== 'play') return;

  if (trans) {
    trans.t += dt;
    if (trans.t > 0.22 && !trans.done) { trans.done = true; finishTrans(); }
    if (trans.t > 0.46) trans = null;
    return;
  }
  if (fishing) {
    fishing.t += dt;
    if (!fishing.res) {
      fishing.cur += fishing.dir * fishing.spd * dt;
      if (fishing.cur > 380) { fishing.cur = 380; fishing.dir = -1; }
      if (fishing.cur < 0) { fishing.cur = 0; fishing.dir = 1; }
    }
    return;
  }

  timeLeft -= dt;
  if (net.big > 0) net.big -= dt;
  if (radarT > 0) radarT -= dt;
  if (net.t >= 0) { net.t += dt; if (net.t > 0.4) net.t = -1; }

  // --- 移動 ---
  let ax = 0, ay = 0;
  for (const code in MOVE_KEYS) {
    if (keys[code]) { ax += MOVE_KEYS[code][0]; ay += MOVE_KEYS[code][1]; }
  }
  if (ax || ay) { const m = Math.sqrt(ax * ax + ay * ay); ax /= m; ay /= m; }
  const SPEED = 168;
  player.moving = !!(ax || ay);
  if (player.moving) {
    player.face = Math.atan2(ay, ax);
    player.walk += dt * 9.5;
    player.stepT += dt;
    if (player.stepT > 0.30) { player.stepT = 0; sfx.step(); }
    const nx = player.x + ax * SPEED * dt, ny = player.y + ay * SPEED * dt;
    if (walkable(nx, player.y)) player.x = nx;
    else if (nx < PAD_X && AREAS[cur].nb.left) { goArea('left'); return; }
    else if (nx > W - PAD_X && AREAS[cur].nb.right) { goArea('right'); return; }
    if (walkable(player.x, ny)) player.y = ny;
    else if (ny < HORIZON + PAD_TOP && AREAS[cur].nb.up) { goArea('up'); return; }
    else if (ny > H - PAD_BOT && AREAS[cur].nb.down) { goArea('down'); return; }
  } else player.walk = 0;

  // --- 虫 ---
  for (const b of bugs) {
    if (b.dead) continue;
    const info = BUGS[b.key];
    b.t += dt;
    if (dist(player.x, player.y - 22, b.x, b.y) < info.alert) b.flee = Math.max(b.flee, 0.9);
    if (b.flee > 0) b.flee -= dt;

    if (b.perched && b.flee <= 0) {
      b.x = lerp(b.x, b.hx, Math.min(1, dt * 4));
      b.y = lerp(b.y, b.hy + Math.sin(b.t * 2) * 1.6, Math.min(1, dt * 4));
    } else if (b.flee > 0) {
      const ang = Math.atan2(b.y - (player.y - 22), b.x - player.x) + Math.sin(b.t * 6) * 0.35;
      const sp = info.spd * (b.perched ? 1.25 : 1.0);
      let nx = b.x + Math.cos(ang) * sp * dt, ny = b.y + Math.sin(ang) * sp * dt;
      if (nx < 18 || nx > W - 18) nx = b.x;
      const ceilFlee = b.perched ? 108 : BUG_CEIL;
      if (ny < ceilFlee || ny > H - 20) ny = b.y;
      b.x = nx; b.y = ny;
      if (b.perched && b.flee <= 0 && AREAS[cur].trees.length) {
        const t = pick(AREAS[cur].trees);
        const a2 = rnd() * Math.PI * 2, rad2 = 0.35 + rnd() * 0.6;
        b.tree = t;
        b.hx = clamp(t[0] + Math.cos(a2) * 62 * rad2, 34, W - 34);
        b.hy = t[1] - 120 + Math.sin(a2) * 52 * rad2;
      }
    } else {
      const ang = Math.sin(b.t * 1.3 + b.hx * 0.01) * 1.6 + Math.sin(b.t * 0.47) * 1.2;
      const sp = info.spd * 0.44;
      let nx = b.x + Math.cos(ang) * sp * dt + Math.sin(b.t * 4) * 14 * dt;
      let ny = b.y + Math.sin(ang) * sp * dt + Math.cos(b.t * 3.1) * 14 * dt;
      if (b.key === 'gengoro' && !nearWater(nx, ny + 20)) { nx = b.x; ny = b.y; b.t += 0.7; }
      if (nx < 26 || nx > W - 26) { nx = b.x; b.t += 0.9; }
      if (ny < BUG_CEIL || ny > H - 30) { ny = b.y; b.t += 0.9; }
      b.x = nx; b.y = ny;
    }
  }

  // --- キャラ ---
  for (const n of npcs) {
    n.t += dt;
    if (n.talk > 0) n.talk -= dt;
    if (n.t > 2.4) {
      n.t = 0;
      for (let k = 0; k < 40; k++) {
        const a = rnd() * Math.PI * 2, r = 60 + rnd() * 140;
        const x = n.x + Math.cos(a) * r, y = n.y + Math.sin(a) * r;
        if (walkable(x, y)) { n.tx = x; n.ty = y; break; }
      }
    }
    const dx = n.tx - n.x, dy = n.ty - n.y, dd = Math.sqrt(dx * dx + dy * dy);
    if (dd > 4) {
      const sp = 44 * dt;
      if (walkable(n.x + dx / dd * sp, n.y)) n.x += dx / dd * sp;
      if (walkable(n.x, n.y + dy / dd * sp)) n.y += dy / dd * sp;
      n.bob += dt * 8;
    }
    if (!n.rec.met && dist(n.x, n.y, player.x, player.y) < 42) meetNpc(n);
  }

  if (timeLeft <= 0) endDay();
}

function drawBug(key, x, y, s, frame, glow) {

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(t, x, y, size, col, align, weight) {
  ctx.fillStyle = col;
  ctx.font = (weight || 'bold') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}
function wrapText(t, x, y, size, col, maxW, lh) {
  ctx.fillStyle = col;
  ctx.font = 'bold ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = 'left';
  let line = '', yy = y;
  for (const ch of t) {
    if (ch === '\n' || ctx.measureText(line + ch).width > maxW) {
      ctx.fillText(line, x, yy); line = (ch === '\n' ? '' : ch); yy += lh;
    } else line += ch;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy + lh;
}

// ===== 情景 =====
function drawScene() {
  const A = AREAS[cur], D = DAYS[day], f = buildField(cur);

  // 空
  const sg = ctx.createLinearGradient(0, 0, 0, HORIZON + 30);
  sg.addColorStop(0, D.sky[0]); sg.addColorStop(0.6, D.sky[1]); sg.addColorStop(1, D.sky[2]);
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, HORIZON + 30);
  ctx.fillStyle = day === 2 ? 'rgba(255,226,196,0.92)' : 'rgba(255,255,255,0.92)';
  for (const c of f.clouds) {
    const cx = c.x + Math.sin(elapsed * 0.05 + c.y) * 10;
    for (const [ox, oy, r] of [[-34, 12, 26], [0, -6, 36], [30, 10, 24], [58, 16, 18]]) {
      ctx.beginPath(); ctx.arc(cx + ox * c.s, c.y + oy * c.s, r * c.s, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (day === 2) {
    ctx.fillStyle = 'rgba(255,238,180,0.85)';
    ctx.beginPath(); ctx.arc(W * 0.78, 120, 30, 0, Math.PI * 2); ctx.fill();
  }
  // 遠くの山
  for (let i = 0; i < f.hills.length; i++) {
    const hl = f.hills[i];
    ctx.fillStyle = ['#7f9ea8', '#6d90a0', '#5d8494'][i % 3];
    ctx.beginPath();
    ctx.moveTo(hl.x - hl.w / 2, HORIZON - 4);
    ctx.quadraticCurveTo(hl.x, HORIZON - 4 - hl.h, hl.x + hl.w / 2, HORIZON - 4);
    ctx.closePath(); ctx.fill();
  }
  // 中景の木立
  ctx.fillStyle = A.kind === 'forest' ? '#2b4426' : '#3c5c32';
  ctx.fillRect(0, HORIZON - 26, W, 30);
  for (const t of f.farTrees) {
    const h = 26 * t.s;
    ctx.beginPath();
    ctx.moveTo(t.x - 12 * t.s, HORIZON - 22);
    ctx.quadraticCurveTo(t.x, HORIZON - 22 - h, t.x + 12 * t.s, HORIZON - 22);
    ctx.closePath(); ctx.fill();
  }

  // 地面
  for (let ty = 0; ty < GT; ty++) {
    for (let tx = 0; tx < GW; tx++) drawEnv(f.g[ty][tx], tx * TILE, HORIZON + ty * TILE, 2);
  }
  // 水面のきらめき
  for (let ty = 0; ty < GT; ty++) {
    for (let tx = 0; tx < GW; tx++) {
      if (f.g[ty][tx] !== 'water') continue;
      const ph = Math.sin(elapsed * 2.2 + tx * 0.9 + ty * 1.7);
      if (ph > 0.7) {
        ctx.fillStyle = 'rgba(255,255,255,' + ((ph - 0.7) * 1.7).toFixed(2) + ')';
        ctx.fillRect(tx * TILE + 6, HORIZON + ty * TILE + 10 + ((tx * 7 + ty * 3) % 12), 11, 2);
      }
    }
  }
  // 稲
  if (A.kind === 'paddy') {
    ctx.fillStyle = '#78a840';
    for (let ty = 0; ty < GT; ty++) {
      for (let tx = 0; tx < GW; tx++) {
        if (f.g[ty][tx] !== 'water') continue;
        const bx = tx * TILE + 8, by = HORIZON + ty * TILE + 26;
        for (let k = 0; k < 3; k++) {
          const sw = Math.sin(elapsed * 1.6 + tx + k) * 2;
          ctx.fillRect(bx + k * 9, by - 16, 2, 16);
          ctx.fillRect(bx + k * 9 + sw, by - 22, 2, 8);
        }
      }
    }
  }
  // 石段・桟橋（地面の一部として先に）
  for (const [k, x] of A.props) if (k === 'steps') drawSteps(x);
  for (const [k, x, y] of A.props) if (k === 'jetty') drawJetty(x, y);

  // 前後ソート
  const items = [];
  for (const [k, x, y] of A.decor) items.push({ y, k: 'decor', o: { k, x, y } });
  for (const [x, y] of A.trees) items.push({ y: y + 2, k: 'tree', o: { x, y } });
  for (const [k, x, y] of A.props) {
    if (k === 'torii' || k === 'lantern' || k === 'saisen' || k === 'scarecrow' || k === 'mushroom') {
      items.push({ y, k, o: { x, y } });
    }
  }
  if (A.kind === 'bamboo') for (const b of f.bamboo) items.push({ y: b.y, k: 'bamboo1', o: b });
  for (const n of npcs) items.push({ y: n.y, k: 'npc', o: n });
  items.push({ y: player.y, k: 'player', o: player });
  items.sort((a, b) => a.y - b.y);

  for (const it of items) {
    const o = it.o;
    if (it.k === 'decor') {
      const r = ENV[o.k];
      drawEnv(o.k, o.x - r[2], o.y - r[3] * 2, 2);
    } else if (it.k === 'tree') {
      const r = ENV['tree'];
      const hide = Math.abs(player.x - o.x) < 76 && player.y > o.y - 200 && player.y < o.y + 12;
      if (hide) ctx.globalAlpha = 0.44;
      ctx.drawImage(imgEnv, r[0], r[1], r[2], r[3],
        Math.round(o.x - r[2]), Math.round(o.y - r[3] * 2 + 12), r[2] * 2, r[3] * 2);
      ctx.globalAlpha = 1;
    } else if (it.k === 'torii') {
      const hide = Math.abs(player.x - o.x) < 110 && player.y > o.y - 180 && player.y < o.y + 10;
      if (hide) ctx.globalAlpha = 0.5;
      drawTorii(o.x, o.y, 1.0);
      ctx.globalAlpha = 1;
    } else if (it.k === 'lantern') drawLantern(o.x, o.y);
    else if (it.k === 'saisen') drawSaisen(o.x, o.y);
    else if (it.k === 'scarecrow') drawScarecrow(o.x, o.y);
    else if (it.k === 'mushroom') drawMushroom(o.x, o.y);
    else if (it.k === 'bamboo1') {
      const hide = Math.abs(player.x - o.x) < 26 && player.y > o.y - 160 && player.y < o.y + 10;
      if (hide) ctx.globalAlpha = 0.45;
      drawOneBamboo(o);
      ctx.globalAlpha = 1;
    } else if (it.k === 'npc') {
      const s = depthScale(o.y) * 0.94;
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(o.x, o.y, 7 * s, 2.6 * s, 0, 0, Math.PI * 2); ctx.fill();
      drawChar(o.ci, o.x, o.y + Math.sin(o.bob) * 2, s, false);
      if (!o.rec.met) {
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(o.x, o.y - 16 * s - 10 + Math.sin(elapsed * 4) * 2.5, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (it.k === 'player') {
      const s = depthScale(o.y);
      ctx.fillStyle = 'rgba(0,0,0,0.26)';
      ctx.beginPath(); ctx.ellipse(o.x, o.y, 8 * s, 3 * s, 0, 0, Math.PI * 2); ctx.fill();
      const bob = o.moving ? Math.abs(Math.sin(o.walk)) * -3.5 : 0;
      const flip = Math.cos(o.face) < -0.35 && o.moving;
      drawChar(0, o.x, o.y + bob, s, flip);
      drawNet(o.x, o.y + bob);
    }
  }

  // 虫は見やすさ優先で最前面
  for (const b of bugs) {
    if (b.dead) continue;
    const fr = Math.floor(elapsed * 14) % 2 === 0;
    if (radarT > 0) {
      ctx.strokeStyle = 'rgba(255,240,150,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, 18 + Math.sin(elapsed * 5 + b.hx) * 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (!b.perched) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y + 24, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
    drawBug(b.key, b.x, b.y, 1.8, fr, b.key === 'hotaru');
  }

  // 色味
  ctx.fillStyle = D.tint; ctx.fillRect(0, 0, W, H);
  if (A.kind === 'forest') { ctx.fillStyle = 'rgba(20,40,24,0.22)'; ctx.fillRect(0, HORIZON - 30, W, H); }
  if (A.kind === 'bamboo') { ctx.fillStyle = 'rgba(40,70,30,0.12)'; ctx.fillRect(0, HORIZON - 30, W, H); }

  // 木もれ日
  ctx.save();
  ctx.globalAlpha = 0.055; ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 6; i++) {
    const px = ((i * 197 + Math.sin(elapsed * 0.3 + i) * 34) % (W + 220)) - 110;
    ctx.beginPath();
    ctx.moveTo(px, HORIZON - 40); ctx.lineTo(px + 86, HORIZON - 40);
    ctx.lineTo(px + 190, H + 20); ctx.lineTo(px + 104, H + 20);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  drawExits();

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.col; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    text(p.txt, p.x, p.y, 16, 'rgba(0,0,0,0.6)', 'center');
    text(p.txt, p.x, p.y - 1.5, 16, p.col, 'center');
  }
  ctx.globalAlpha = 1;

  for (const n of npcs) {
    if (n.talk <= 0) continue;
    drawBubble(n.x, n.y - 60, CHAR_JP[n.ci], (CHAR_LINES[n.ci] || ['……'])[0], n.bonusTxt, n.ci);
  }
}

function drawBubble(x, y, name, line, bonus, ci) {
  ctx.save();
  const wid = 420, pad = 14;
  ctx.font = 'bold 14px "Hiragino Kaku Gothic ProN",sans-serif';
  const lines = []; let curl = '';
  for (const ch of line) {
    if (ctx.measureText(curl + ch).width > wid - pad * 2 - 52) { lines.push(curl); curl = ch; }
    else curl += ch;
  }
  if (curl) lines.push(curl);
  const hgt = 34 + lines.length * 20 + (bonus ? 22 : 0);
  const bx = clamp(x - wid / 2, 12, W - wid - 12), by = clamp(y - hgt, HORIZON - 66, H - 160);
  ctx.fillStyle = 'rgba(20,26,18,0.88)';
  roundRect(bx, by, wid, hgt, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,235,180,0.6)'; ctx.lineWidth = 2;
  roundRect(bx, by, wid, hgt, 12); ctx.stroke();
  drawChar(ci, bx + 30, by + hgt - 8, 2.3, false);
  text(name, bx + 58, by + 24, 14, '#ffe9a8');
  let yy = by + 46;
  for (const l of lines) { text(l, bx + 58, yy, 14, '#ffffff', 'left', '500'); yy += 20; }
  if (bonus) text('★ ' + bonus, bx + 58, yy + 3, 14, '#a8e6ff');
  ctx.restore();
}
function drawNet(px, py) {
  if (net.t < 0) return;
  const prog = clamp(net.t / 0.34, 0, 1);
  const ang = net.dir + (-0.9 + prog * 1.8);
  const reach = netReach() * (0.55 + prog * 0.7);
  const nx = px + Math.cos(ang) * reach, ny = py - 22 + Math.sin(ang) * reach;
  const R = netRadius() * 0.62;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.strokeStyle = '#c8a068'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px, py - 26); ctx.lineTo(nx, ny); ctx.stroke();
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(240,250,255,0.30)';
  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(nx + i * R * 0.55, ny - R); ctx.lineTo(nx + i * R * 0.55, ny + R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(nx - R, ny + i * R * 0.55); ctx.lineTo(nx + R, ny + i * R * 0.55); ctx.stroke();
  }
  ctx.globalAlpha = 0.22 * (1 - prog);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(px, py - 22, reach, net.dir - 0.9, ang); ctx.stroke();
  ctx.restore();
}

  const nFish = Object.values(dayFish).reduce((a, b) => a + b, 0);
  let s = 'きょうは ' + ['あさから', 'ひるから', 'ゆうがたに'][day] + ' 博麗神社の まわりを あるいた。';
  if (nCatch === 0) s += ' むしは 一ぴきも つかまらなかった。くやしい。';
  else {
    s += ' あみで ' + nCatch + 'ひき つかまえた。';
    if (total.length) s += ' いちばんの しゅうかくは ' + BUGS[total[0][0]].jp + '。';
  }
  if (nFish > 0) s += ' 霧の湖で さかなも ' + nFish + 'びき つれた。';
  if (dayMet.length) {
    s += ' ' + dayMet.slice(0, 3).map(i => CHAR_JP[i]).join('と') + 'に あった。';
    if (dayMet.length > 3) s += ' ほかにも 何人か あった。';
  } else s += ' だれにも 会わなかった。しずかな 一日。';
  s += day === DAY_COUNT - 1 ? ' あしたから また ふつうの 日が つづく。' : ' あしたも いい天気に なるといいな。';
  return s;
}
function drawDiary() {
  drawScene();
  ctx.fillStyle = 'rgba(20,16,10,0.7)'; ctx.fillRect(0, 0, W, H);
  const D = DAYS[day];
  const px = 84, py = 34, pw = W - 168, ph = H - 122;
  ctx.fillStyle = '#fdf6e0';
  roundRect(px, py, pw, ph, 10); ctx.fill();
  ctx.fillStyle = '#e8d9b0'; ctx.fillRect(px, py, 30, ph);
  ctx.fillStyle = '#c04a3a';
  for (let y = py + 26; y < py + ph - 18; y += 52) { ctx.beginPath(); ctx.arc(px + 15, y, 4.5, 0, Math.PI * 2); ctx.fill(); }

  const inX = px + 46;
  text('えにっき', inX, py + 34, 24, '#3a3020');
  text(D.date + '（' + D.wd + '）　' + D.weather, px + pw - 20, py + 34, 17, '#6a5a3a', 'right');
  ctx.strokeStyle = '#ded0a4'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(inX, py + 44); ctx.lineTo(px + pw - 20, py + 44); ctx.stroke();

  // 左：絵
  const aw = 352, ah = 204, ax = inX, ay = py + 58;
  ctx.save();
  ctx.beginPath(); ctx.rect(ax, ay, aw, ah); ctx.clip();
  ctx.fillStyle = ['#d8ecc0', '#e0f0c8', '#ffd9a8'][day]; ctx.fillRect(ax, ay, aw, ah);
  ctx.fillStyle = '#8fc46a'; ctx.fillRect(ax, ay + ah * 0.5, aw, ah * 0.5);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(ax + 70, ay + 50, 23, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ax + 100, ay + 38, 29, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = day === 2 ? '#ff8a4a' : '#ffe066';
  ctx.beginPath(); ctx.arc(ax + aw - 44, ay + 40, 18, 0, Math.PI * 2); ctx.fill();
  if (assetsReady >= 2) {
    const r = ENV['tree'];
    ctx.drawImage(imgEnv, r[0], r[1], r[2], r[3], ax + aw - 146, ay + ah - 178, r[2] * 1.7, r[3] * 1.7);
    drawTorii(ax + 62, ay + ah - 16, 0.42);
    drawChar(0, ax + 146, ay + ah - 14, 2.9, false);
    let mx = ax + 196;
    for (const ci of dayMet.slice(0, 4)) { drawChar(ci, mx, ay + ah - 18, 2.2, false); mx += 36; }
  }
  ctx.restore();
  ctx.strokeStyle = '#8a7a52'; ctx.lineWidth = 2; ctx.strokeRect(ax, ay, aw, ah);

  // 右：虫と魚
  const rx = ax + aw + 32;
  text('つかまえた むし', rx, py + 76, 14, '#8a7a52');
  const entries = Object.entries(dayCatch).sort((a, b) => BUGS[b[0]].pt - BUGS[a[0]].pt);
  if (!entries.length) text('（きょうは ぼうず……）', rx + 6, py + 108, 15, '#9a8a6a');
  else {
    let cy = py + 100, col = 0, cx = rx;
    for (const [k, n] of entries) {
      if (col === 2) { col = 0; cx = rx; cy += 38; }
      drawBug(k, cx + 14, cy - 6, 1.3, false, false);
      text(BUGS[k].jp, cx + 30, cy - 9, 12, '#5a4a30');
      text('x' + n, cx + 30, cy + 6, 12.5, '#3a3020');
      cx += 114; col++;
    }
  }
  const fe = Object.entries(dayFish);
  if (fe.length) {
    text('つった さかな', rx, py + 220, 14, '#8a7a52');
    text(fe.map(([k, n]) => k + ' x' + n).join('　'), rx + 6, py + 242, 13, '#3a3020');
  }

  wrapText(diaryText(), inX, py + 292, 15, '#3a3020', pw - 70, 24);

  ctx.fillStyle = 'rgba(30,40,26,0.92)';
  roundRect(px, py + ph + 12, pw, 46, 10); ctx.fill();
  text('きょうの てんすう', px + 20, py + ph + 42, 15, '#cfe8b8');
  text(String(dayScore) + ' てん', px + 270, py + ph + 42, 22, '#ffe066', 'right');
  const bp = Math.sin(elapsed * 3) * 2;
  text((day < DAY_COUNT - 1 ? 'Z / Enter で つぎの日へ' : 'Z / Enter で けっかを みる') + ' ▶',
       px + pw - 20, py + ph + 42 + bp, 16, '#ffffff', 'right');
}

// ===== 結果 =====
function rankOf(s) {
  if (s >= 2400) return { r: 'S', msg: 'わすれられない 夏に なった。' };
  if (s >= 1700) return { r: 'A', msg: 'とても いい 夏休みだった。' };
  if (s >= 1000) return { r: 'B', msg: 'まあまあ 楽しい 夏だった。' };
  return { r: 'C', msg: 'また 来年、遊びに おいで。' };
}
function drawResult() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3f5a9a'); g.addColorStop(0.4, '#f09a5a');
  g.addColorStop(0.7, '#ffcf8a'); g.addColorStop(1, '#5a4a3a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,244,196,0.9)';
  ctx.beginPath(); ctx.arc(W * 0.24, 172, 40, 0, Math.PI * 2); ctx.fill();
  const GY = H - 116;
  ctx.fillStyle = '#2a3a24'; ctx.fillRect(0, GY, W, H - GY);
  if (assetsReady >= 2) {
    drawTorii(86, GY + 28, 0.44);
    drawChar(0, 268, GY + 44, 2.8, false);
    drawChar(1, 314, GY + 48, 2.5, true);
    ctx.fillStyle = 'rgba(26,24,18,0.5)'; ctx.fillRect(0, GY - 34, W, H - GY + 34);
  }

  const rk = rankOf(score);
  text('夏休み おわり', W * 0.24, 74, 30, '#ffffff', 'center');
  text('8月3日（月） ゆうがた', W * 0.24, 100, 14, 'rgba(255,255,255,0.92)', 'center');
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 96px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.lineWidth = 11; ctx.strokeStyle = 'rgba(70,36,22,0.5)';
  ctx.strokeText(rk.r, W * 0.24, 300);
  ctx.fillStyle = '#ffe066'; ctx.fillText(rk.r, W * 0.24, 300);
  ctx.restore();
  text(rk.msg, W * 0.24, 332, 16, '#ffffff', 'center');

  const px = 470, py = 52, pw = W - px - 34, ph = 386;
  ctx.fillStyle = 'rgba(18,24,16,0.82)';
  roundRect(px, py, pw, ph, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,235,180,0.3)'; ctx.lineWidth = 1.5;
  roundRect(px, py, pw, ph, 12); ctx.stroke();

  const bugTypes = Object.keys(totalCatch).length;
  const nCatch = Object.values(totalCatch).reduce((a, b) => a + b, 0);
  const nFish = Object.values(totalFish).reduce((a, b) => a + b, 0);
  const nMet = Object.keys(metChars).length;
  const rows = [
    ['ごうけい てんすう', score + ' てん'],
    ['つかまえた むし', nCatch + ' ひき（' + bugTypes + '/' + BUG_KEYS.length + 'しゅ）'],
    ['つった さかな', nFish + ' びき'],
    ['出会った なかま', nMet + ' / ' + (CHAR_NAMES.length - 1) + ' 人'],
  ];
  let yy = py + 32;
  for (const [k, v] of rows) {
    text(k, px + 20, yy, 14, '#cfe8b8');
    text(v, px + pw - 20, yy + 1, 16, '#ffffff', 'right');
    yy += 28;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.moveTo(px + 18, yy - 12); ctx.lineTo(px + pw - 18, yy - 12); ctx.stroke();

  text('むし ずかん（これまでの きろく）', px + 20, yy + 10, 12.5, '#ffe066');
  const cellW = (pw - 40) / 5;
  let bi = 0;
  for (const k of BUG_KEYS) {
    const n = zukan.bugs[k] || 0;
    const cx = px + 20 + (bi % 5) * cellW + cellW / 2;
    const cy = yy + 44 + Math.floor(bi / 5) * 52;
    ctx.globalAlpha = n > 0 ? 1 : 0.22;
    drawBug(k, cx, cy, 1.2, false, false);
    ctx.globalAlpha = 1;
    text(n > 0 ? BUGS[k].jp : '？？？', cx, cy + 22, 9.5, n > 0 ? '#e8f0e0' : '#7a8a70', 'center');
    bi++;
  }
  const my = yy + 44 + 2 * 52 + 14;
  const metList = Object.keys(zukan.chars).map(Number).sort((a, b) => a - b);
  text('会った なかま ' + metList.length + ' / ' + (CHAR_NAMES.length - 1) + '人', px + 20, my, 12.5, '#ffe066');
  let mx = px + 22;
  for (const ci of metList.slice(0, 22)) { drawChar(ci, mx + 8, my + 30, 1.25, false); mx += 19; }
  if (metList.length > 22) text('…', mx + 8, my + 28, 13, '#cfe8b8');

  const bp = Math.sin(elapsed * 3) * 3;
  text('Z / Enter で もういちど ▶', W * 0.24, 356 + bp, 19, '#ffffff', 'center');
  text('東方Project (C) 上海アリス幻樂団 / ZUN　sprites: Majstek　tiles: Seliel the Shaper',
       W / 2, H - 12, 11, 'rgba(255,255,255,0.85)', 'center', '500');
}

function drawLoading() {
  ctx.fillStyle = '#2e4a2a'; ctx.fillRect(0, 0, W, H);
  text('よみこみ中……', W / 2, H / 2, 20, '#cfe8b8', 'center');
}

// ===== メインループ =====
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;

  if (assetsReady < 2) { elapsed += dt; drawLoading(); requestAnimationFrame(loop); return; }

  update(dt);

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state === 'title') drawTitle();
  else if (state === 'play') {
    drawScene(); drawHud();
    if (fishing) drawFishingUi();
    if (trans) {
      const a = trans.t < 0.23 ? trans.t / 0.23 : Math.max(0, (0.46 - trans.t) / 0.23);
      ctx.fillStyle = 'rgba(12,16,10,' + a.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }
  else if (state === 'diary') drawDiary();
  else if (state === 'result') drawResult();
  ctx.restore();

  requestAnimationFrame(loop);
}
loadZukan();
requestAnimationFrame(loop);

// ===== 録画・自動テスト用 =====
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('record') === '1') {
  window._recordCtrl = {
    start: function() { startGame(); },
    stop: function() { /* no-op */ },
    setDay: function(d) { day = clamp(d | 0, 0, DAY_COUNT - 1); startDay(); },
    goto: function(id) { if (AREAS[id]) { cur = id; solidsFor = null; refillArea(); } },
    dbg: function() {
      if (state !== 'play') return { state: state, score: score };
      return {
        state: state, score: score, timeLeft: timeLeft, area: cur,
        px: player.x, py: player.y, nearWater: nearWater(player.x, player.y),
        exits: Object.keys(AREAS[cur].nb),
        bugs: bugs.filter(b => !b.dead).map(b => ({ k: b.key, x: b.x, y: b.y })),
        npcs: npcs.filter(n => !n.rec.met).map(n => ({ x: n.x, y: n.y })),
      };
    },
  };
}

})();
</script>
