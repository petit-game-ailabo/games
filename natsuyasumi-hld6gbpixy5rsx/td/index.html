<!doctype html>
<meta charset="utf-8">
<title>なつやすみ（2D見下ろし・試作）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#0d120b;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;overscroll-behavior:none}
  /* 画面に フィット（16:9を たもって 拡大縮小）。ドット絵は くっきり */
  canvas{width:min(100vw, 177.78vh);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  /* スマホ縦：よこ向き 推奨（タッチ端末＋縦 のときだけ） */
  #rot{display:none}
  @media (orientation:portrait) and (pointer:coarse){
    #rot{display:flex;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;
         background:#0d120b;color:#eef3e6;font:600 20px system-ui;text-align:center;flex-direction:column;gap:10px}
  }
</style>
<canvas id="c" width="960" height="540"></canvas>
<div id="rot">📱↻<br>よこむきに すると<br>おおきく あそべるよ</div>
<script src="chars.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
