// ===== UTIL =====
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(12345);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

let AC = null, masterGain = null, audioOn = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
    audioOn = true;
    startBgm();
    startCicadas();
  } catch (e) { audioOn = false; }
}
function tone(freq, dur, type, vol, delay) {
  if (!audioOn) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, f0, f1, vol) {
  if (!audioOn) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(f0, AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + dur);
  bp.Q.value = 1.2;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start();
}
// せみしぐれ
let cicadaTimer = null;
function startCicadas() {
  if (!audioOn) return;
  const loop = () => {
    if (state === 'play') {
      const n = Math.floor(AC.sampleRate * 0.5);
      const buf = AC.createBuffer(1, n, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const env = Math.sin(Math.PI * i / n);
        const trill = 0.6 + 0.4 * Math.sin(i * 0.09);
        d[i] = (Math.random() * 2 - 1) * env * trill;
      }
      const src = AC.createBufferSource(); src.buffer = buf;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 3400 + Math.random() * 900; bp.Q.value = 3.5;
      const g = AC.createGain(); g.gain.value = 0.035;
      src.connect(bp); bp.connect(g); g.connect(masterGain);
      src.start();
    }
    cicadaTimer = setTimeout(loop, 700 + Math.random() * 900);
  };
  loop();
}
// のんびりした夏のBGM（ヨナ抜き音階）
const SCALE = [0, 2, 4, 7, 9];
let bgmTimer = null, bgmStep = 0;
function startBgm() {
  if (!audioOn) return;
  const base = 261.63;
  const loop = () => {
    if (state !== 'title') {
      const beat = bgmStep % 8;
      if (beat === 0 || beat === 3 || beat === 5) {
        const deg = SCALE[Math.floor(Math.random() * SCALE.length)];
        const oct = Math.random() < 0.35 ? 2 : 1;
        tone(base * Math.pow(2, deg / 12) * oct, 0.7, 'triangle', 0.05);
      }
      if (beat === 0) tone(base / 2, 1.4, 'sine', 0.07);
      if (beat === 4) tone(base / 2 * Math.pow(2, 7 / 12), 1.4, 'sine', 0.055);
      bgmStep++;
    }
    bgmTimer = setTimeout(loop, 340);
  };
  loop();
}

// ===== MAP GENERATION =====
function genWorld(seed) {
  rnd = mulberry32(seed);
  ground = new Uint8Array(WT * HT);
  for (let ty = 0; ty < HT; ty++) {
    for (let tx = 0; tx < WT; tx++) {
      const r = rnd();
      ground[ty * WT + tx] = r < 0.10 ? G_F1 : (r < 0.18 ? G_F2 : G_GRASS);
    }
  }
  // 川（うねった川岸）
  for (let tx = 0; tx < WT; tx++) {
    const wob = Math.round(Math.sin(tx * 0.42) * 1.4 + Math.sin(tx * 0.17) * 0.9);
    const top = RIVER_TOP + wob, bot = RIVER_BOT + wob;
    for (let ty = top; ty <= bot; ty++) if (ty >= 0 && ty < HT) ground[ty * WT + tx] = G_WATER;
    if (top - 1 >= 0) ground[(top - 1) * WT + tx] = G_DIRT;
    if (bot + 1 < HT) ground[(bot + 1) * WT + tx] = G_DIRT;
  }
  // 橋
  for (let ty = RIVER_TOP - 4; ty <= RIVER_BOT + 4; ty++) {
    for (let tx = BRIDGE_L; tx <= BRIDGE_R; tx++) {
      if (ty >= 0 && ty < HT) ground[ty * WT + tx] = G_BRIDGE;
    }
  }
  // 神社の石段（上部中央）
  const sx = SHRINE_X;
  for (let ty = 1; ty <= 9; ty++) {
    for (let tx = sx - 2; tx <= sx + 2; tx++) ground[ty * WT + tx] = G_DIRT;
  }

  // 木・岩・やぶ
  trees = []; decor = [];
  const occupied = [];
  function farEnough(x, y, r) {
    for (const o of occupied) if (dist(x, y, o.x, o.y) < r) return false;
    return true;
  }
  function isFree(tx, ty) {
    if (tx < 1 || ty < 3 || tx >= WT - 1 || ty >= HT - 1) return false;
    const g = ground[ty * WT + tx];
    return g !== G_WATER && g !== G_BRIDGE;
  }
  // 木（虫のいる場所）
  const spawnX = sx * TILE + 16, spawnY = 12 * TILE;
  let guard = 0;
  while (trees.length < 7 && guard++ < 5000) {
    const tx = 2 + Math.floor(rnd() * (WT - 5));
    const ty = 5 + Math.floor(rnd() * (HT - 9));
    if (!isFree(tx, ty) || !isFree(tx + 1, ty) || !isFree(tx, ty + 1)) continue;
    if (Math.abs(ty - RIVER_TOP) < 4 || Math.abs(ty - RIVER_BOT) < 4) continue;
    if (ty <= 11 && Math.abs(tx - sx) < 5) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE;
    if (dist(x, y, spawnX, spawnY) < 190) continue;
    if (!farEnough(x, y, 215)) continue;
    occupied.push({ x, y });
    trees.push({ x, y, r: 15 });
  }
  // 岩・やぶ・くさむら
  const kinds = [['rock', 15, 9], ['bushL', 0, 13], ['bushS', 0, 11], ['weed', 0, 18]];
  for (const [key, solidR, count] of kinds) {
    let g2 = 0, made = 0;
    while (made < count && g2++ < 3000) {
      const tx = 1 + Math.floor(rnd() * (WT - 2));
      const ty = 3 + Math.floor(rnd() * (HT - 5));
      if (!isFree(tx, ty)) continue;
      const x = tx * TILE + TILE / 2, y = ty * TILE + TILE;
      if (!farEnough(x, y, 62)) continue;
      occupied.push({ x, y });
      decor.push({ key, x, y, solidR });
      made++;
    }
  }
  decor.sort((a, b) => a.y - b.y);
}

function inBounds(px, py) {
  return px >= 0 && py >= 0 && px < WORLD_W && py < WORLD_H;
}
function groundAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || ty < 0 || tx >= WT || ty >= HT) return G_GRASS;
  return ground[ty * WT + tx];
}
function isWalkable(px, py) {
  if (px < 16 || py < TOP_LIMIT || px > WORLD_W - 16 || py > WORLD_H - 16) return false;
  if (groundAt(px, py) === G_WATER) return false;
  for (const t of trees) if (dist(px, py, t.x, t.y - 4) < t.r) return false;
  for (const d of decor) if (d.solidR > 0 && dist(px, py, d.x, d.y - 6) < d.solidR) return false;
  return true;
}
function nearWater(px, py) {
  for (let a = 0; a < 12; a++) {
    const ang = a / 12 * Math.PI * 2;
    for (const r of [44, 78]) {
      const sx = px + Math.cos(ang) * r, sy = py + Math.sin(ang) * r;
      if (!inBounds(sx, sy)) continue;
      if (groundAt(sx, sy) === G_WATER) return true;
    }
  }
  return false;
}

// ===== SPAWNING =====
function randomSpot(spot) {
  for (let i = 0; i < 200; i++) {
    if (spot === 'tree') {
      const t = trees[Math.floor(rnd() * trees.length)];
      return { x: t.x + (rnd() - 0.5) * 40, y: t.y - 34 - rnd() * 62, tree: t };
    }
    if (spot === 'water') {
      const tx = 1 + Math.floor(rnd() * (WT - 2));
      const ty = RIVER_TOP - 3 + Math.floor(rnd() * 10);
      const x = tx * TILE + 16, y = ty * TILE + 16;
      if (groundAt(x, y) !== G_WATER && nearWater(x, y)) return { x, y };
      continue;
    }
    const x = 40 + rnd() * (WORLD_W - 80), y = TOP_LIMIT + 12 + rnd() * (WORLD_H - TOP_LIMIT - 60);
    if (groundAt(x, y) === G_WATER) continue;
    if (spot === 'grass' && groundAt(x, y) === G_DIRT) continue;
    return { x, y };
  }
  return { x: WORLD_W / 2, y: WORLD_H / 2 };
}

function pickBugKey() {
  const pool = [];
  for (const k of BUG_KEYS) {
    if (k === 'hotaru' && day < DAY_COUNT - 1) continue;    // ホタルは夕方だけ
    let w = BUGS[k].rare * (1 + day * 0.14);
    if (BUGS[k].pt >= 50) w *= 0.55 + day * 0.28;
    for (let i = 0; i < Math.max(1, Math.round(w * 10)); i++) pool.push(k);
  }
  return pool[Math.floor(rnd() * pool.length)];
}

function spawnBug() {
  const key = pickBugKey();
  const b = BUGS[key];
  const s = randomSpot(b.spot);
  const perched = b.spot === 'tree' && key !== 'onma';
  return {
    key, x: s.x, y: s.y,
    hx: s.x, hy: s.y,
    vx: 0, vy: 0,
    t: rnd() * 10,
    flee: 0,
    perched,
    tree: s.tree || null,
    life: 0,
    dead: false,
  };
}

function spawnNpcs() {
  npcs = [];
  const idx = [];
  for (let i = 1; i < CHAR_NAMES.length; i++) idx.push(i);
  // シャッフル
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  const n = 6;
  for (let i = 0; i < n; i++) {
    const ci = idx[i];
    let p = null;
    for (let k = 0; k < 200; k++) {
      const x = 60 + rnd() * (WORLD_W - 120), y = 120 + rnd() * (WORLD_H - 200);
      if (isWalkable(x, y) && dist(x, y, player.x, player.y) > 240) { p = { x, y }; break; }
    }
    if (!p) p = { x: WORLD_W / 2, y: WORLD_H / 2 };
    npcs.push({ ci, x: p.x, y: p.y, tx: p.x, ty: p.y, t: rnd() * 3, met: false, talk: 0, bob: rnd() * 6 });
  }
}

function startDay() {
  genWorld(4700 + day * 977);
  player = { x: SHRINE_X * TILE + 16, y: 12 * TILE, face: Math.PI / 2, vx: 0, vy: 0, walk: 0, moving: false };
  bugs = [];
  const count = 22 + day * 2;
  for (let i = 0; i < count; i++) bugs.push(spawnBug());
  spawnNpcs();
  net = { t: -1, dir: 0, big: 0 };
  radarT = 0;
  fishing = null;
  popups = [];
  particles = [];
  dayCatch = {};
  dayFish = {};
  dayMet = [];
  dayScore = 0;
  timeLeft = DAYS[day].time;
  camX = clamp(player.x - W / 2, 0, WORLD_W - W);
  camY = clamp(player.y - H / 2, 0, WORLD_H - H);
  state = 'play';
}

// ===== INPUT =====
let stick = { active: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
const BTN_NET = { x: W - 70, y: H - 112, r: 45 };
const BTN_FISH = { x: W - 156, y: H - 60, r: 32 };

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function inCircle(p, c) { return dist(p.x, p.y, c.x, c.y) < c.r + 6; }

function onDown(p, id) {
  initAudio();
  if (state === 'title') { startGame(); return; }
  if (state === 'diary') { nextFromDiary(); return; }
  if (state === 'result') { if (p.y > H * 0.72) startGame(); return; }
  if (state !== 'play') return;

  if (fishing) { resolveFishing(); return; }
  if (inCircle(p, BTN_NET)) { swing(); return; }
  if (fishAvailable() && inCircle(p, BTN_FISH)) { beginFishing(); return; }
  if (!stick.active) {
    stick.active = true; stick.id = id;
    stick.ox = p.x; stick.oy = p.y; stick.x = p.x; stick.y = p.y;
  }
}
function onMove(p, id) {
  if (stick.active && stick.id === id) { stick.x = p.x; stick.y = p.y; }
}
function onUp(id) {
  if (stick.active && stick.id === id) {
    // ほとんど動かさなかったら網を振る
    if (dist(stick.x, stick.y, stick.ox, stick.oy) < 12 && state === 'play' && !fishing) swing();
    stick.active = false; stick.id = null;
  }
}
canvas.addEventListener('mousedown', e => { e.preventDefault(); onDown(canvasPos(e), 'm'); });
canvas.addEventListener('mousemove', e => onMove(canvasPos(e), 'm'));
window.addEventListener('mouseup', () => onUp('m'));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onDown(canvasPos(t), t.identifier);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onMove(canvasPos(t), t.identifier);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onUp(t.identifier);
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (state === 'title') startGame();
    else if (state === 'diary') nextFromDiary();
    else if (state === 'result') startGame();
    else if (fishing) resolveFishing();
    else swing();
  }
});

// ===== ACTIONS =====
function netRadius() { return net.big > 0 ? 46 : 32; }
function netReach() { return 42; }

function swing() {
  if (net.t >= 0 && net.t < 0.34) return;
  net.t = 0;
  net.dir = player.face;
  sfx.swing();
  const cx = player.x + Math.cos(net.dir) * netReach();
  const cy = player.y - 14 + Math.sin(net.dir) * netReach();
  const R = netRadius();
  let hit = null;
  for (const b of bugs) {
    if (b.dead) continue;
    if (dist(cx, cy, b.x, b.y) < R + 10) { hit = b; break; }
  }
  if (hit) {
    catchBug(hit);
  } else {
    sfx.miss();
    // 空振りで近くの虫が逃げる
    for (const b of bugs) {
      if (!b.dead && dist(player.x, player.y, b.x, b.y) < 150) b.flee = 1.4;
    }
  }
}

function catchBug(b) {
  const info = BUGS[b.key];
  b.dead = true;
  dayCatch[b.key] = (dayCatch[b.key] || 0) + 1;
  totalCatch[b.key] = (totalCatch[b.key] || 0) + 1;
  zukan.bugs[b.key] = (zukan.bugs[b.key] || 0) + 1;
  const pts = info.pt;
  dayScore += pts; score += pts;
  if (info.pt >= 50) sfx.rare(); else sfx.catch();
  popups.push({ x: b.x, y: b.y, txt: info.jp + ' +' + pts, t: 0, col: info.pt >= 50 ? '#ffe066' : '#ffffff' });
  for (let i = 0; i < 14; i++) {
    const a = rnd() * Math.PI * 2, s = 40 + rnd() * 110;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.55, col: info.pt >= 50 ? '#ffe066' : '#fff6c8', r: 2 + rnd() * 2 });
  }
  shake = Math.min(6, 3 + info.pt / 24);
  setTimeout(() => {
    const i = bugs.indexOf(b);
    if (i >= 0) bugs[i] = spawnBug();
  }, 900);
}

function fishAvailable() {
  return state === 'play' && !fishing && player && nearWater(player.x, player.y);
}
function beginFishing() {
  sfx.splash();
  const zw = 46 + rnd() * 26;
  fishing = { cur: 0, dir: 1, spd: 300 + day * 45, zs: 40 + rnd() * (260 - zw - 80), zw, res: null, t: 0 };
}
function resolveFishing() {
  if (!fishing || fishing.res) return;
  const f = fishing;
  const inZone = f.cur >= f.zs && f.cur <= f.zs + f.zw;
  if (inZone) {
    // ゾーン中心に近いほどレアな魚
    const acc = 1 - Math.abs(f.cur - (f.zs + f.zw / 2)) / (f.zw / 2);
    const pool = [];
    for (const fi of FISH) {
      let w = fi.w + (fi.w < 0.6 ? acc * 0.9 : 0);
      for (let i = 0; i < Math.max(1, Math.round(w * 10)); i++) pool.push(fi);
    }
    const got = pool[Math.floor(rnd() * pool.length)];
    f.res = { ok: true, fish: got };
    dayFish[got.jp] = (dayFish[got.jp] || 0) + 1;
    totalFish[got.jp] = (totalFish[got.jp] || 0) + 1;
    dayScore += got.pt; score += got.pt;
    sfx.fishOk();
  } else {
    f.res = { ok: false };
    sfx.miss();
  }
  setTimeout(() => { fishing = null; }, 1200);
}

function meetNpc(n) {
  n.met = true;
  n.talk = 3.0;
  metChars[n.ci] = true;
  zukan.chars[n.ci] = true;
  dayMet.push(n.ci);
  score += 40; dayScore += 40;
  sfx.meet();
  const bonus = CHAR_LINES[n.ci] ? CHAR_LINES[n.ci][1] : 'score';
  if (bonus === 'time') { timeLeft += 6; n.bonusTxt = 'のこり時間 +6びょう'; }
  else if (bonus === 'net') { net.big = 12; n.bonusTxt = 'あみが 大きくなった！'; }
  else if (bonus === 'radar') { radarT = 12; n.bonusTxt = '虫の いばしょが わかる！'; }
  else { score += 60; dayScore += 60; n.bonusTxt = 'おみやげ +60てん'; }
  popups.push({ x: n.x, y: n.y - 34, txt: '+40', t: 0, col: '#a8e6ff' });
}

// ===== UPDATE =====
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.t += dt; p.y -= dt * 26;
    if (p.t > 1.1) popups.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  if (state !== 'play') return;

  if (fishing) { updateFishing(dt); return; }

  timeLeft -= dt;
  if (net.big > 0) net.big -= dt;
  if (radarT > 0) radarT -= dt;
  if (net.t >= 0) { net.t += dt; if (net.t > 0.4) net.t = -1; }

  // --- プレイヤー移動 ---
  let ax = 0, ay = 0;
  if (stick.active) {
    let dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > 10) {
      const mag = Math.min(1, (d - 10) / 42);
      ax = dx / d * mag; ay = dy / d * mag;
    }
  }
  const SPEED = 152;
  player.moving = (ax !== 0 || ay !== 0);
  if (player.moving) {
    player.face = Math.atan2(ay, ax);
    player.walk += dt * 9;
    const nx = player.x + ax * SPEED * dt;
    const ny = player.y + ay * SPEED * dt;
    if (isWalkable(nx, player.y)) player.x = nx;
    if (isWalkable(player.x, ny)) player.y = ny;
  } else {
    player.walk = 0;
  }

  // --- カメラ ---
  const tcx = clamp(player.x - W / 2, 0, WORLD_W - W);
  const tcy = clamp(player.y - H / 2 + 40, 0, WORLD_H - H);
  camX = lerp(camX, tcx, Math.min(1, dt * 9));
  camY = lerp(camY, tcy, Math.min(1, dt * 9));

  // --- 虫 ---
  for (const b of bugs) {
    if (b.dead) continue;
    const info = BUGS[b.key];
    b.t += dt;
    const d = dist(player.x, player.y - 14, b.x, b.y);
    if (d < info.alert) b.flee = Math.max(b.flee, 0.9);
    if (b.flee > 0) b.flee -= dt;

    if (b.perched && b.flee <= 0) {
      // 木にとまってじっとしている
      b.x = lerp(b.x, b.hx, Math.min(1, dt * 4));
      b.y = lerp(b.y, b.hy + Math.sin(b.t * 2) * 1.5, Math.min(1, dt * 4));
    } else if (b.flee > 0) {
      const ang = Math.atan2(b.y - (player.y - 14), b.x - player.x) + Math.sin(b.t * 6) * 0.35;
      const sp = info.spd * (b.perched ? 1.25 : 1.0);
      let nx = b.x + Math.cos(ang) * sp * dt;
      let ny = b.y + Math.sin(ang) * sp * dt;
      if (nx < 24 || nx > WORLD_W - 24) nx = b.x;
      if (ny < TOP_LIMIT || ny > WORLD_H - 24) ny = b.y;
      b.x = nx; b.y = ny;
      if (b.perched && b.flee <= 0) { const s = randomSpot('tree'); b.hx = s.x; b.hy = s.y; b.tree = s.tree; }
    } else {
      // ふらふら飛ぶ
      const wob = Math.sin(b.t * 1.3 + b.hx * 0.01) * 1.6 + Math.sin(b.t * 0.47) * 1.2;
      const ang = wob;
      const sp = info.spd * 0.42;
      let nx = b.x + Math.cos(ang) * sp * dt + Math.sin(b.t * 4) * 12 * dt;
      let ny = b.y + Math.sin(ang) * sp * dt + Math.cos(b.t * 3.1) * 12 * dt;
      if (info.spot === 'water') {
        if (!nearWater(nx, ny) || groundAt(nx, ny) === G_WATER) { nx = b.x; ny = b.y; b.t += 0.7; }
      }
      if (nx < 30 || nx > WORLD_W - 30) { nx = b.x; b.t += 0.9; }
      if (ny < TOP_LIMIT || ny > WORLD_H - 30) { ny = b.y; b.t += 0.9; }
      b.x = nx; b.y = ny;
    }
  }

  // --- キャラ ---
  for (const n of npcs) {
    n.t += dt;
    if (n.talk > 0) n.talk -= dt;
    if (n.t > 2.4) {
      n.t = 0;
      for (let k = 0; k < 40; k++) {
        const a = rnd() * Math.PI * 2, r = 60 + rnd() * 130;
        const x = n.x + Math.cos(a) * r, y = n.y + Math.sin(a) * r;
        if (isWalkable(x, y)) { n.tx = x; n.ty = y; break; }
      }
    }
    const dx = n.tx - n.x, dy = n.ty - n.y, dd = Math.sqrt(dx * dx + dy * dy);
    if (dd > 4) {
      const sp = 42 * dt;
      const nx = n.x + dx / dd * sp, ny = n.y + dy / dd * sp;
      if (isWalkable(nx, n.y)) n.x = nx;
      if (isWalkable(n.x, ny)) n.y = ny;
      n.bob += dt * 8;
    }
    if (!n.met && dist(n.x, n.y, player.x, player.y) < 40) meetNpc(n);
  }

  if (timeLeft <= 0) endDay();
}

function updateFishing(dt) {
  const f = fishing;
  f.t += dt;
  if (f.res) return;
  f.cur += f.dir * f.spd * dt;
  if (f.cur > 260) { f.cur = 260; f.dir = -1; }
  if (f.cur < 0) { f.cur = 0; f.dir = 1; }
}

function endDay() {
  state = 'diary';
  sfx.bell();
  saveZukan();
}
function nextFromDiary() {
  sfx.page();
  day++;
  if (day >= DAY_COUNT) {
    state = 'result';
    if (score > zukan.best) zukan.best = score;
    saveZukan();
  } else {
    startDay();
  }
}

// ===== DRAW HELPERS =====
function drawEnv(key, x, y, scale) {
  const r = ENV[key];
  const s = scale || 2;
  ctx.drawImage(imgEnv, r[0], r[1], r[2], r[3], Math.round(x), Math.round(y), r[2] * s, r[3] * s);
}
function drawChar(ci, x, y, s, flip, alpha) {
  const cx = (ci % 8) * 16, cy = Math.floor(ci / 8) * 16;
  const w = 16 * s;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  if (flip) {
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(-1, 1);
    ctx.drawImage(imgChars, cx, cy, 16, 16, -w / 2, -w, w, w);
  } else {
    ctx.drawImage(imgChars, cx, cy, 16, 16, Math.round(x - w / 2), Math.round(y - w), w, w);
  }
  ctx.restore();
}
function drawBug(key, x, y, s, frame, glow) {
  const art = BUG_ART[key];
  if (!art) return;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (glow) {
    const g = ctx.createRadialGradient(0, 3 * s, 0, 0, 3 * s, 12 * s);
    g.addColorStop(0, 'rgba(200,255,140,0.55)');
    g.addColorStop(1, 'rgba(200,255,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-14 * s, -11 * s, 28 * s, 28 * s);
  }
  for (const r of art) {
    let [rx, ry, rw, rh, col, wing] = r;
    let px = (rx - 8) * s, pw = rw * s;
    if (wing && frame) {                 // 羽ばたき：中心に向かって縮む
      px *= 0.62; pw *= 0.62;
    }
    ctx.fillStyle = col;
    ctx.fillRect(px, (ry - 8) * s, Math.max(s * 0.6, pw), rh * s);
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(t, x, y, size, col, align, weight) {
  ctx.fillStyle = col;
  ctx.font = (weight || 'bold') + ' ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}
function wrapText(t, x, y, size, col, maxW, lh) {
  ctx.fillStyle = col;
  ctx.font = 'bold ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  ctx.textAlign = 'left';
  let line = '', yy = y;
  for (const ch of t) {
    if (ch === '\n' || ctx.measureText(line + ch).width > maxW) {
      ctx.fillText(line, x, yy); line = (ch === '\n' ? '' : ch); yy += lh;
    } else line += ch;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy + lh;
}

// ===== DRAW: 鳥居 =====
function drawTorii(x, y, s) {
  const w = 110 * s, h = 130 * s;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.5, 9 * s, 0, 0, Math.PI * 2); ctx.fill();
  const R = '#c0392b', RD = '#8e2a20', RL = '#e05a48';
  // 柱
  ctx.fillStyle = R; ctx.fillRect(-w * 0.40, -h, 11 * s, h);
  ctx.fillStyle = RD; ctx.fillRect(-w * 0.40 + 8 * s, -h, 3 * s, h);
  ctx.fillStyle = R; ctx.fillRect(w * 0.40 - 11 * s, -h, 11 * s, h);
  ctx.fillStyle = RD; ctx.fillRect(w * 0.40 - 3 * s, -h, 3 * s, h);
  // 貫
  ctx.fillStyle = RD; ctx.fillRect(-w * 0.44, -h * 0.72, w * 0.88, 8 * s);
  // 笠木
  ctx.fillStyle = R; ctx.fillRect(-w * 0.52, -h - 2 * s, w * 1.04, 10 * s);
  ctx.fillStyle = RL; ctx.fillRect(-w * 0.52, -h - 2 * s, w * 1.04, 3 * s);
  ctx.fillStyle = RD; ctx.fillRect(-w * 0.5, -h + 8 * s, w, 5 * s);
  ctx.restore();
}

// ===== DRAW: フィールド =====
function drawWorld() {
  const d = DAYS[day];
  ctx.fillStyle = '#4d7a3a';
  ctx.fillRect(0, 0, W, H);

  const ox = Math.round(-camX), oy = Math.round(-camY);
  const tx0 = Math.max(0, Math.floor(camX / TILE)), tx1 = Math.min(WT - 1, Math.floor((camX + W) / TILE));
  const ty0 = Math.max(0, Math.floor(camY / TILE)), ty1 = Math.min(HT - 1, Math.floor((camY + H) / TILE));

  // 地面
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const g = ground[ty * WT + tx];
      drawEnv(GROUND_KEY[g], tx * TILE + ox, ty * TILE + oy, 2);
    }
  }
  // 川のきらめき
  ctx.save();
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (ground[ty * WT + tx] !== G_WATER) continue;
      const ph = Math.sin(elapsed * 2.2 + tx * 0.9 + ty * 1.7);
      if (ph > 0.72) {
        ctx.fillStyle = 'rgba(255,255,255,' + ((ph - 0.72) * 1.6).toFixed(2) + ')';
        ctx.fillRect(tx * TILE + ox + 6, ty * TILE + oy + 10 + ((tx * 7 + ty * 3) % 12), 10, 2);
      }
    }
  }
  ctx.restore();
  // 橋の板
  ctx.save();
  for (let ty = RIVER_TOP - 3; ty <= RIVER_BOT + 3; ty++) {
    if (ty < ty0 - 1 || ty > ty1 + 1) continue;
    let onRiver = false;
    for (let tx = 0; tx < WT; tx++) if (ground[ty * WT + tx] === G_WATER) { onRiver = true; break; }
    for (let tx = BRIDGE_L; tx <= BRIDGE_R; tx++) {
      if (ground[ty * WT + tx] !== G_BRIDGE) continue;
      ctx.fillStyle = onRiver ? 'rgba(92,62,34,0.8)' : 'rgba(112,80,46,0.45)';
      ctx.fillRect(tx * TILE + ox, ty * TILE + oy + 5, TILE, 4);
      ctx.fillRect(tx * TILE + ox, ty * TILE + oy + 19, TILE, 4);
      if (onRiver && (tx === BRIDGE_L || tx === BRIDGE_R)) {
        // 欄干
        ctx.fillStyle = '#6a4a28';
        ctx.fillRect((tx === BRIDGE_L ? tx * TILE : tx * TILE + TILE - 4) + ox, ty * TILE + oy, 4, TILE);
      }
    }
  }
  ctx.restore();

  // 鳥居（神社エリア）
  drawTorii(SHRINE_X * TILE + 16 + ox, 8 * TILE + oy, 1.0);

  // 前後ソートして描画
  const items = [];
  for (const dc of decor) {
    if (dc.y < camY - 120 || dc.y > camY + H + 60) continue;
    items.push({ y: dc.y, kind: 'decor', o: dc });
  }
  for (const t of trees) {
    if (t.y < camY - 260 || t.y > camY + H + 80) continue;
    items.push({ y: t.y + 2, kind: 'tree', o: t });
  }
  for (const b of bugs) {
    if (b.dead) continue;
    if (b.x < camX - 40 || b.x > camX + W + 40 || b.y < camY - 40 || b.y > camY + H + 40) continue;
    items.push({ y: b.y + 999, kind: 'bug', o: b });   // 虫は最前面（見やすさ優先）
  }
  for (const n of npcs) {
    if (n.y < camY - 80 || n.y > camY + H + 80) continue;
    items.push({ y: n.y, kind: 'npc', o: n });
  }
  items.push({ y: player.y, kind: 'player', o: player });
  items.sort((a, b) => a.y - b.y);

  for (const it of items) {
    const o = it.o;
    if (it.kind === 'decor') {
      const r = ENV[o.key];
      drawEnv(o.key, o.x + ox - r[2], o.y + oy - r[3] * 2, 2);
    } else if (it.kind === 'tree') {
      const r = ENV['tree'];
      // 木の下にプレイヤーが隠れたら透かす
      const hide = (Math.abs(player.x - o.x) < 70 && player.y > o.y - 190 && player.y < o.y + 10);
      if (hide) ctx.globalAlpha = 0.42;
      ctx.drawImage(imgEnv, r[0], r[1], r[2], r[3],
        Math.round(o.x + ox - r[2]), Math.round(o.y + oy - r[3] * 2 + 12), r[2] * 2, r[3] * 2);
      ctx.globalAlpha = 1;
    } else if (it.kind === 'npc') {
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.beginPath(); ctx.ellipse(o.x + ox, o.y + oy, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
      const bob = Math.sin(o.bob) * 2;
      drawChar(o.ci, o.x + ox, o.y + oy + bob, SPR * 0.9, false);
      if (!o.met) {
        // まだ会っていない印
        const p = Math.sin(elapsed * 4) * 2;
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(o.x + ox, o.y + oy - 48 + p, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (it.kind === 'player') {
      ctx.fillStyle = 'rgba(0,0,0,0.24)';
      ctx.beginPath(); ctx.ellipse(o.x + ox, o.y + oy, 14, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      const bob = o.moving ? Math.abs(Math.sin(o.walk)) * -3 : 0;
      const flipX = Math.cos(o.face) < -0.35 && o.moving;
      if (flipX) {
        ctx.save();
        ctx.translate(Math.round(o.x + ox), Math.round(o.y + oy + bob));
        ctx.scale(-1, 1);
        ctx.drawImage(imgChars, 0, 0, 16, 16, -SPR_PX / 2, -SPR_PX, SPR_PX, SPR_PX);
        ctx.restore();
      } else {
        drawChar(0, o.x + ox, o.y + oy + bob, SPR, false);
      }
      drawNet(o.x + ox, o.y + oy + bob);
    } else if (it.kind === 'bug') {
      const fr = Math.floor(elapsed * 14) % 2 === 0;
      if (radarT > 0) {
        ctx.strokeStyle = 'rgba(255,240,150,0.5)';
        ctx.lineWidth = 2;
        const rr = 16 + Math.sin(elapsed * 5 + o.hx) * 3;
        ctx.beginPath(); ctx.arc(o.x + ox, o.y + oy, rr, 0, Math.PI * 2); ctx.stroke();
      }
      if (!o.perched) {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath(); ctx.ellipse(o.x + ox, o.y + oy + 20, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
      }
      drawBug(o.key, o.x + ox, o.y + oy, 1.7, fr, o.key === 'hotaru');
    }
  }

  // 時間帯の色味
  ctx.fillStyle = d.tint;
  ctx.fillRect(0, 0, W, H);

  // 木もれ日
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 5; i++) {
    const px = ((i * 137 + Math.sin(elapsed * 0.3 + i) * 30) % (W + 160)) - 80;
    ctx.beginPath();
    ctx.moveTo(px, -20); ctx.lineTo(px + 70, -20); ctx.lineTo(px + 150, H + 20); ctx.lineTo(px + 80, H + 20);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ポップアップ / パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x + ox - p.r, p.y + oy - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    text(p.txt, p.x + ox, p.y + oy, 15, 'rgba(0,0,0,0.6)', 'center');
    text(p.txt, p.x + ox, p.y + oy - 1.5, 15, p.col, 'center');
  }
  ctx.globalAlpha = 1;

  // 会話ふきだし
  for (const n of npcs) {
    if (n.talk <= 0) continue;
    const bx = clamp(n.x + ox, 100, W - 100), by = n.y + oy - 56;
    const line = CHAR_LINES[n.ci] ? CHAR_LINES[n.ci][0] : '……';
    drawBubble(bx, by, CHAR_JP[n.ci], line, n.bonusTxt, n.ci);
  }
}

function drawBubble(x, y, name, line, bonus, ci) {
  ctx.save();
  const wid = 300, pad = 12;
  ctx.font = 'bold 13px "Hiragino Kaku Gothic ProN",sans-serif';
  const lines = [];
  let cur = '';
  for (const ch of line) {
    if (ctx.measureText(cur + ch).width > wid - pad * 2 - 40) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  const hgt = 30 + lines.length * 18 + (bonus ? 20 : 0);
  const bx = clamp(x - wid / 2, 8, W - wid - 8), by = clamp(y - hgt, 156, H - 220);
  ctx.fillStyle = 'rgba(20,26,18,0.86)';
  roundRect(bx, by, wid, hgt, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,235,180,0.6)'; ctx.lineWidth = 2;
  roundRect(bx, by, wid, hgt, 12); ctx.stroke();
  drawChar(ci, bx + 26, by + hgt - 8, 2.0, false);
  text(name, bx + 50, by + 22, 13, '#ffe9a8');
  let yy = by + 42;
  for (const l of lines) { text(l, bx + 50, yy, 13, '#ffffff', 'left', '500'); yy += 18; }
  if (bonus) text('★ ' + bonus, bx + 50, yy + 2, 13, '#a8e6ff');
  ctx.restore();
}

function drawNet(px, py) {
  if (net.t < 0) return;
  const prog = clamp(net.t / 0.34, 0, 1);
  const sweep = (-0.9 + prog * 1.8);
  const ang = net.dir + sweep;
  const reach = netReach() * (0.55 + prog * 0.7);
  const nx = px + Math.cos(ang) * reach;
  const ny = py - 14 + Math.sin(ang) * reach;
  const R = netRadius() * 0.62;
  ctx.save();
  ctx.globalAlpha = 0.85;
  // 柄
  ctx.strokeStyle = '#c8a068'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px, py - 20); ctx.lineTo(nx, ny); ctx.stroke();
  // わく
  ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI * 2); ctx.stroke();
  // あみ

  ctx.beginPath(); ctx.arc(nx, ny, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;

    ctx.beginPath(); ctx.moveTo(nx + i * R * 0.55, ny - R); ctx.lineTo(nx + i * R * 0.55, ny + R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(nx - R, ny + i * R * 0.55); ctx.lineTo(nx + R, ny + i * R * 0.55); ctx.stroke();

  // 振りぬきの残像

}

// ===== DIARY =====
function diaryText() {
  const d = DAYS[day];
  const total = Object.entries(dayCatch).sort((a, b) => BUGS[b[0]].pt - BUGS[a[0]].pt);
  const nCatch = Object.values(dayCatch).reduce((a, b) => a + b, 0);
  const nFish = Object.values(dayFish).reduce((a, b) => a + b, 0);
  let s = 'きょうは ' + ['あさから', 'ひるから', 'ゆうがたに'][day] + ' 博麗神社の まわりを あるいた。';
  if (nCatch === 0) s += ' むしは 一ぴきも つかまらなかった。くやしい。';
  else {
    s += ' あみで ' + nCatch + 'ひき つかまえた。';
    if (total.length) s += ' いちばんの しゅうかくは ' + BUGS[total[0][0]].jp + '。';
  }
  if (nFish > 0) s += ' 川で さかなも ' + nFish + 'びき つれた。';
  if (dayMet.length) {
    s += ' ' + dayMet.slice(0, 3).map(i => CHAR_JP[i]).join('と') + 'に あった。';
    if (dayMet.length > 3) s += ' ほかにも 何人か あった。';
  } else s += ' だれにも 会わなかった。しずかな 一日。';
  if (day === DAY_COUNT - 1) s += ' あしたから また ふつうの 日が つづく。';
  else s += ' あしたも いい天気に なるといいな。';
  return s;
}

function measureLines(t, size, maxW) {
  ctx.font = 'bold ' + size + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  let line = '', n = 1;
  for (const ch of t) {
    if (ch === '\n' || ctx.measureText(line + ch).width > maxW) { n++; line = (ch === '\n' ? '' : ch); }
    else line += ch;
  }
  return n;
}

  drawWorld();
  ctx.fillStyle = 'rgba(20,16,10,0.66)'; ctx.fillRect(0, 0, W, H);

    ['ごうけい てんすう', score + ' てん'],
    ['つかまえた むし', nCatch + ' ひき（' + bugTypes + '/' + BUG_KEYS.length + 'しゅ）'],
    ['つった さかな', nFish + ' びき'],
    ['出会った なかま', nMet + ' / ' + (CHAR_NAMES.length - 1) + ' 人'],
  ];
  let yy = py + 28;
  for (const [k, v] of rows) {
    text(k, px + 16, yy, 13, '#cfe8b8');
    text(v, px + pw - 16, yy + 1, 15, '#ffffff', 'right');
    yy += 26;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.moveTo(px + 14, yy - 12); ctx.lineTo(px + pw - 14, yy - 12); ctx.stroke();

  // むし ずかん（累計）
  text('むし ずかん（これまでの きろく）', px + 16, yy + 8, 11.5, '#ffe066');
  const cellW = (pw - 32) / 5;
  let bi = 0;
  for (const k of BUG_KEYS) {
    const n = zukan.bugs[k] || 0;
    const cx = px + 16 + (bi % 5) * cellW + cellW / 2;
    const cy = yy + 36 + Math.floor(bi / 5) * 44;
    ctx.globalAlpha = n > 0 ? 1 : 0.22;
    drawBug(k, cx, cy, 1.1, false, false);
    ctx.globalAlpha = 1;
    text(n > 0 ? BUGS[k].jp : '？？？', cx, cy + 20, 8.5, n > 0 ? '#e8f0e0' : '#7a8a70', 'center');
    bi++;
  }
  // なかま ずかん
  const my = yy + 36 + 2 * 44 + 12;
  const metList = Object.keys(zukan.chars).map(Number).sort((a, b) => a - b);
  text('会った なかま ' + metList.length + ' / ' + (CHAR_NAMES.length - 1) + '人', px + 16, my, 11.5, '#ffe066');
  let mx2 = px + 18;
  for (const ci of metList.slice(0, 19)) {
    drawChar(ci, mx2 + 8, my + 26, 1.15, false);
    mx2 += 18;
  }
  if (metList.length > 19) text('…', mx2 + 8, my + 24, 12, '#cfe8b8');

  const bp = Math.sin(elapsed * 3) * 3;
  ctx.fillStyle = '#e8604f';
  roundRect(W / 2 - 96, H - 106 + bp, 192, 54, 27); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
  roundRect(W / 2 - 96, H - 106 + bp, 192, 54, 27); ctx.stroke();
  text('もういちど', W / 2, H - 71 + bp, 21, '#ffffff', 'center');
  text('東方Project (C) 上海アリス幻樂団 / ZUN   sprites: Majstek', W / 2, H - 14, 9, 'rgba(255,255,255,0.85)', 'center', '500');
}
// ===== LOADING =====
function drawLoading() {
  ctx.fillStyle = '#2e4a2a'; ctx.fillRect(0, 0, W, H);
  text('よみこみ中……', W / 2, H / 2, 18, '#cfe8b8', 'center');
}

// ===== MAIN LOOP =====
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (assetsReady < 2) {
    elapsed += dt;
    drawLoading();
    requestAnimationFrame(loop);
    return;
  }

  update(dt);

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state === 'title') drawTitle();
  else if (state === 'play') { drawWorld(); drawHud(); if (fishing) drawFishingUi(); }
  else if (state === 'diary') drawDiary();
  else if (state === 'result') drawResult();
  ctx.restore();

  requestAnimationFrame(loop);
}
loadZukan();
requestAnimationFrame(loop);

// ===== RECORD SUPPORT =====
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('record') === '1') {
  window._recordCtrl = {
    start: function() { startGame(); },
    stop: function() { /* no-op, recording ends externally */ },
    setDay: function(d) { day = clamp(d | 0, 0, DAY_COUNT - 1); startDay(); },
    // 録画スクリプト／自動テストが「次の狙い」を知るための覗き窓
    dbg: function() {
      if (state !== 'play') return { state: state, score: score };
      return {
        state: state, score: score, timeLeft: timeLeft,
        px: player.x, py: player.y, camX: camX, camY: camY,
        bugs: bugs.filter(b => !b.dead).map(b => ({ k: b.key, x: b.x, y: b.y })),
        npcs: npcs.filter(n => !n.met).map(n => ({ x: n.x, y: n.y })),
      };
    },
  };
}

})();
</script>
